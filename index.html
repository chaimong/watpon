<title>ห้องเรียนวัดผลดิจิทัล</title>
<meta name="description" content="บทเรียนออนไลน์รายวิชา การวัดและประเมินผลการเรียนรู้ (Learning Measurement and Assessment) ระดับปริญญาตรี">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --ink:#1B2230; --ink-2:#4E586B; --ink-3:#7A8396; --line:#D8DDE6;
  --accent:#AE2550; --accent-ink:#FFFFFF; --accent-soft:#F7E4EA; --data:#1C6C68; --data-soft:#DCEEEB;
  --good:#2B7A4B; --good-soft:#E0F1E6; --warn:#9A6210; --warn-soft:#F6EAD3; --bad:#B0281F; --bad-soft:#F8E1DE;
  --grid:rgba(27,34,48,.045); --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.05);
  --font-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI","Leelawadee UI",Tahoma,sans-serif;
  --font-display:"Noto Serif Thai","Leelawadee UI",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --side:272px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131A; --surface:#171B23; --surface-2:#1F2430; --ink:#E6E9EF; --ink-2:#A7AFBE; --ink-3:#7D8698; --line:#2B3140;
    --accent:#EC7497; --accent-ink:#1A0B11; --accent-soft:#38202A; --data:#5CC3B8; --data-soft:#16302E;
    --good:#6CCB8F; --good-soft:#173324; --warn:#E3B25B; --warn-soft:#352914; --bad:#F2867D; --bad-soft:#3A1E1C;
    --grid:rgba(230,233,239,.04); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131A; --surface:#171B23; --surface-2:#1F2430; --ink:#E6E9EF; --ink-2:#A7AFBE; --ink-3:#7D8698; --line:#2B3140;
  --accent:#EC7497; --accent-ink:#1A0B11; --accent-soft:#38202A; --data:#5CC3B8; --data-soft:#16302E;
  --good:#6CCB8F; --good-soft:#173324; --warn:#E3B25B; --warn-soft:#352914; --bad:#F2867D; --bad-soft:#3A1E1C;
  --grid:rgba(230,233,239,.04); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
/* theme settings: typeface & width (accent colours are generated by the theme script) */
:root[data-font="sans"]{--font-display:"IBM Plex Sans Thai",system-ui,"Segoe UI","Leelawadee UI",Tahoma,sans-serif}
:root[data-font="sarabun"]{--font-body:"Sarabun",system-ui,"Segoe UI","Leelawadee UI",Tahoma,sans-serif;--font-display:"Sarabun",system-ui,"Leelawadee UI",Tahoma,sans-serif}
:root[data-width="wide"] .page{max-width:1320px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:.9375rem/1.7 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--data);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--data);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(1.55rem,2.6vw,2.1rem)} h2{font-size:1.3rem} h3{font-size:1.06rem}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .small{font-size:.86rem}
.note{display:block;margin-top:.5rem;font-size:.84rem;color:var(--ink-3)}
.tag-sim{display:inline-block;font-size:.72rem;padding:0 .5rem;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600;vertical-align:1px}

/* ── shell ───────────────────────────── */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 10px;border-bottom:1px solid var(--line)}
.brand-mark{width:38px;height:38px;flex:none;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;position:relative}
.brand-mark::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--accent)}
.brand b{display:block;font-family:var(--font-display);font-size:.98rem;line-height:1.3}
.brand span{font-size:.72rem;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:.92rem}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ico{width:18px;height:18px;flex:none}
.nav-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 18px;padding-left:10px;border-left:1px dashed var(--line)}
.nav-sub a{padding:4px 8px;font-size:.85rem}
.nav-label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px;font-weight:600}
.side-foot{margin-top:auto;font-size:.76rem;color:var(--ink-3);padding:10px 6px 0;border-top:1px solid var(--line)}
.main{min-width:0;padding-inline:clamp(16px,4vw,44px);padding-block:26px 64px}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}
.scrim{display:none}

/* answer-sheet bubbles */
.bub{--s:22px;width:var(--s);height:var(--s);flex:none;border-radius:50%;border:1.5px solid var(--ink-3);display:inline-grid;place-items:center;font:600 .66rem/1 var(--font-mono);color:var(--ink-3);background:transparent}
.bub.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.bub.now{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bub.part{background:linear-gradient(to top,var(--ink-3) var(--fill,40%),transparent 0);border-color:var(--ink-3);color:var(--ink)}

/* ── common blocks ───────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.flat{box-shadow:none}
.lift{box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;text-decoration:none;line-height:1.4}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;padding:1px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.data{background:var(--data-soft);color:var(--data)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.t th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:.8rem;white-space:nowrap}
.t tr:last-child td{border-bottom:none}
.t td.num,.t th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.reading table.t{margin:.4rem 0;display:block;overflow-x:auto}
.formula{font-family:var(--font-mono);background:var(--surface-2);border-radius:8px;padding:10px 14px;margin:.4rem 0;font-size:.9rem;overflow-x:auto}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:.6rem 0;align-items:center}
.flow span{padding:3px 10px;border:1px solid var(--line);border-radius:99px;font-size:.85rem;background:var(--surface)}
.flow span+span::before{content:"→";margin-right:8px;color:var(--ink-3)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.6}
input[type=number]{font-family:var(--font-mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink-2)}
.fb{border-radius:8px;padding:9px 12px;font-size:.88rem}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)} .fb.info{background:var(--data-soft);color:var(--data)} .fb.warn{background:var(--warn-soft);color:var(--warn)}
.fb b{font-weight:600}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
details.acc{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.acc>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.acc>summary::after{content:"+";color:var(--ink-3);font-family:var(--font-mono)}
details.acc[open]>summary::after{content:"−"}
details.acc>div{padding:0 14px 14px}
.copybox{font-family:var(--font-mono);font-size:.76rem;height:120px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:50;box-shadow:var(--shadow)}

/* ── home ───────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--surface);padding:clamp(20px,4vw,40px)}
.hero h1{font-size:clamp(1.8rem,3.6vw,2.7rem)}
.hero .en{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-3);letter-spacing:.02em}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end}
.sheet{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px 10px;align-items:center;font-family:var(--font-mono);font-size:.74rem;color:var(--ink-3);padding:14px 16px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.sheet .bub{--s:20px}
.loop{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.loop span{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.journey{display:flex;flex-direction:column;gap:0;position:relative}
.jn{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:6px 0;position:relative}
.jn::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:1.5px;background:var(--line)}
.jn:first-child::before{top:50%} .jn:last-child::before{bottom:50%}
.jn .bub{position:relative;z-index:1;background:var(--surface)}
.jn .bub.done{background:var(--ink)}
.mcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s,transform .15s}
.mcard:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.mcard h3{font-size:1rem}
.mcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.data>i{background:var(--data)}

/* ── module ─────────────────────────── */
.mhead{display:flex;flex-direction:column;gap:8px}
.steps{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;padding:6px 4px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2);font-size:.72rem;line-height:1.25;text-align:center}
.step:hover{background:var(--surface)}
.step[aria-current="step"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.step-body{display:flex;flex-direction:column;gap:16px}
.step-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.reading{display:flex;flex-direction:column;gap:14px}
.reading section{display:flex;flex-direction:column;gap:6px}
.reading ul,.reading ol{margin:.2rem 0;padding-left:1.3rem}
.sum{gap:22px;line-height:1.8}
.sum section{scroll-margin-top:80px}
.sum section p{margin:0 0 .55rem;text-indent:2em}
.sum section p[style*="center"]{text-indent:0}
.sum-abs{text-indent:2em;line-height:1.8;margin:0}
.sum-toc{border-top:1px dashed var(--line);padding-top:10px}
.sum-toc ol{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px}
.sum-toc a{text-decoration:none;color:inherit}.sum-toc a:hover{color:var(--accent)}
.sum-key{border-left:4px solid var(--accent)}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.refs li{padding-left:2.2em;text-indent:-2.2em;line-height:1.6;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:.9rem}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.scene{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-bottom:1px dashed var(--line)}
.scene:last-child{border-bottom:none}
.scene .tc{font-family:var(--font-mono);font-size:.78rem;color:var(--accent);padding-top:2px}
.scene .vis{font-size:.8rem;color:var(--ink-3)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.info>div{background:var(--surface);padding:14px}
.info b{display:block;font-family:var(--font-display);color:var(--accent);margin-bottom:2px}
.slides{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.slides div{counter-increment:s;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px;font-size:.82rem;display:flex;flex-direction:column;justify-content:space-between}
.slides div::before{content:"สไลด์ " counter(s);font-family:var(--font-mono);font-size:.68rem;color:var(--ink-3)}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q .stem{font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--ink-3)}
.opt .bub{--s:20px;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.score .big{font:600 1.8rem/1 var(--font-mono)}

/* scenario quiz (paged) */
.quizbox{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sheetbox>summary{cursor:pointer;list-style:none}
.qsheet{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:8px;max-width:440px}
.qb{aspect-ratio:1;max-width:36px;width:100%;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--surface);color:var(--ink-2);font:600 .7rem/1 var(--font-mono);cursor:pointer;padding:0}
.qb.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.qb.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.qb.no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.qb.now{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.qno{display:inline-block;font:600 .78rem var(--font-mono);color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 10px;margin-right:8px;vertical-align:2px}
.stem{line-height:1.75}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qsum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.qsum .big{font:600 1.7rem/1 var(--font-mono)}
/* classify */
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.bucket{border:1.5px dashed var(--line);border-radius:10px;padding:10px;min-height:74px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.bucket.over{border-color:var(--data);background:var(--data-soft)}
.bucket h4{margin:0;font-size:.8rem;color:var(--ink-2)}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);display:flex;flex-direction:column;gap:6px;cursor:grab;font-size:.9rem}
.chip.placed{cursor:default;font-size:.82rem;padding:6px 9px}
.chip.ok{border-color:var(--good);background:var(--good-soft)} .chip.no{border-color:var(--bad);background:var(--bad-soft)}
.chip .choices{display:flex;flex-wrap:wrap;gap:5px}

/* dashboards/charts */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font:600 1.6rem/1.1 var(--font-mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font:11px var(--font-body)}
.chart .ax{stroke:var(--line)}
.chart .gl{stroke:var(--line);stroke-dasharray:2 3}
.mlist{display:flex;flex-direction:column}
.mlist a{display:grid;grid-template-columns:auto minmax(0,1fr) 110px 44px;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-size:.9rem}
.mlist a:last-child{border-bottom:none}
.mlist a:hover{background:var(--surface-2)}
.sel{outline:2px solid var(--data);outline-offset:-2px}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--surface-2)}
tr.cur td{background:var(--data-soft)}
.cell-in{width:56px;padding:3px 6px;text-align:center}
.rb td{min-width:150px}
.rb textarea{min-height:64px;font-size:.84rem}
.lvl{display:flex;gap:6px;flex-wrap:wrap}
.lvl button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;cursor:pointer;font-family:var(--font-mono)}
.lvl button[aria-pressed="true"]{background:var(--data);border-color:var(--data);color:var(--surface)}
.canvas4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.canvas4 .col{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.canvas4 .k{font:700 1.6rem/1 var(--font-display);color:var(--accent)}

@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar b{font-family:var(--font-display);font-size:.95rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hero-grid{grid-template-columns:1fr}
  .main{padding-block:18px 56px}
  .mlist a{grid-template-columns:auto minmax(0,1fr) 44px}
  .mlist a .bar{display:none}
  .scene{grid-template-columns:1fr}
}
/* theme settings page */
.theme-quick{display:flex;gap:6px;align-items:center}
.theme-quick .btn{flex:1;justify-content:center}
.opt-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.topt{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;color:var(--ink)}
.topt:hover{border-color:var(--ink-3)}
.topt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.topt .sw{width:100%;height:34px;border-radius:6px;display:flex;overflow:hidden;border:1px solid var(--line)}
.topt .sw i{flex:1}
.mini{width:100%;height:58px;border-radius:6px;border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px}
.mini i{display:block;height:6px;border-radius:3px}
/* auth (login / register / PIN) */
.auth-mode .app,.auth-mode .topbar,.auth-mode .scrim{display:none}
.auth{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:32px;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--bg)}
.auth-card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.pin-wrap{display:flex;gap:6px;align-items:center}
.pin-wrap input{flex:1}
.welcome-list{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.92rem}
.welcome-list li{display:flex;gap:10px;align-items:center}
.welcome-list li::before{content:"";width:14px;height:14px;flex:none;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,var(--accent) 0 3px,transparent 4px)}
.welcome-cta{justify-content:center;padding:12px 16px;font-size:1rem}
.admin-entry{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}
.crumb{color:var(--accent);font-weight:600;white-space:nowrap}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.92rem}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* PIN keypad */
.pinpad{display:flex;flex-direction:column;align-items:stretch;gap:14px}
.pin-label{text-align:center;color:var(--ink-2);font-size:.95rem}
.pin-note{text-align:center;color:var(--ink-2);font-size:.88rem}
.dots{display:flex;justify-content:center;gap:14px}
.dots i{width:15px;height:15px;border-radius:50%;background:var(--accent-soft);border:1.5px solid color-mix(in srgb,var(--accent) 25%,transparent);transition:background .12s,transform .12s}
.dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.k{height:64px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);background:color-mix(in srgb,var(--accent-soft) 75%,var(--surface));color:var(--data);font:700 1.55rem/1 var(--font-display);cursor:pointer;touch-action:manipulation;transition:transform .06s,filter .12s}
.k:hover{filter:brightness(.97)} .k:active{transform:scale(.96)}
.k.clr{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent);font-family:var(--font-body)}
.k.del{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent);font-family:var(--font-body);font-size:1.35rem}
.pinpad.busy .keys{opacity:.55;pointer-events:none}
.pinpad.filled .dots i{background:var(--good);border-color:var(--good)}
.pin-compact{max-width:340px}
/* profile & admin console */
.av{--s:40px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:700 calc(var(--s) * .42)/1 var(--font-display);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.nav a.me .av{--s:30px}
.prof-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--surface)}
.prof-head.adm{border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.prof-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
input.ro,input[readonly]{background:var(--surface-2);color:var(--ink-2)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches i{display:block;width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatches input:checked+i{box-shadow:0 0 0 2.5px var(--ink)}
.swatches input:focus-visible+i{outline:2px solid var(--data);outline-offset:3px}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.checklist li{display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.checklist li span{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:.75rem;border:1.5px solid var(--line)}
.checklist li.ok{color:var(--ink)} .checklist li.ok span{background:var(--good);border-color:var(--good);color:var(--surface)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .f{min-width:130px} .toolbar .grow{flex:1 1 220px}
.detail{border-color:var(--accent);box-shadow:var(--shadow)}
@media (max-width: 700px){.prof-head{grid-template-columns:auto minmax(0,1fr)}.prof-actions{grid-column:1/-1;justify-content:flex-start}}
.pin-compact .k{height:52px;font-size:1.3rem}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.pinpad.shake .dots{animation:shake .4s}
.pinpad.shake .dots i{border-color:var(--bad)}
.avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav a.me{border:1px solid var(--line);margin-bottom:6px;position:relative}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none;margin-left:auto}
.sync-dot.ok{background:var(--good)} .sync-dot.saving{background:var(--warn)} .sync-dot.error{background:var(--bad)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
/* Theme engine — runs before the page renders so there is no flash of the wrong theme */
(function () {
  var KEY = 'lma.theme', root = document.documentElement, host = root.getAttribute('data-theme');
  var ACCENTS = {
    crimson: { th: 'แดงกระดาษคำตอบ', l: ['#AE2550', '#F7E4EA'], d: ['#EC7497', '#38202A'] },
    blue: { th: 'น้ำเงินวิชาการ', l: ['#1F4E9C', '#E2EAF7'], d: ['#86ABF2', '#1B2740'] },
    jade: { th: 'เขียวหยก', l: ['#0F6E55', '#DCEFE8'], d: ['#5FCBA8', '#15302A'] },
    indigo: { th: 'ม่วงคราม', l: ['#5B3A9E', '#ECE6F7'], d: ['#B7A1F2', '#28213D'] },
    terra: { th: 'ส้มอิฐ', l: ['#B4501B', '#F8E6DA'], d: ['#F29C66', '#3A2517'] },
    graphite: { th: 'เทาแกรไฟต์', l: ['#2F3A4C', '#E4E7ED'], d: ['#C6CEDB', '#272D39'] }
  };
  var css = '';
  Object.keys(ACCENTS).forEach(function (k) {
    if (k === 'crimson') return;
    var a = ACCENTS[k], dk = '--accent:' + a.d[0] + ';--accent-soft:' + a.d[1] + ';--accent-ink:#12151C';
    css += ':root[data-accent="' + k + '"]{--accent:' + a.l[0] + ';--accent-soft:' + a.l[1] + ';--accent-ink:#FFFFFF}';
    css += '@media (prefers-color-scheme: dark){:root[data-accent="' + k + '"]:not([data-theme="light"]){' + dk + '}}';
    css += ':root[data-theme="dark"][data-accent="' + k + '"]{' + dk + '}';
  });
  var st = document.createElement('style'); st.textContent = css; (document.head || root).appendChild(st);
  var SIZES = { s: '93.75%', m: '100%', l: '112.5%', xl: '125%' };
  var DEF = { mode: 'system', accent: 'crimson', size: 'm', font: 'serif', width: 'normal' };
  var t = Object.assign({}, DEF);
  try { Object.assign(t, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function attr(name, val, off) { if (val === off) root.removeAttribute(name); else root.setAttribute(name, val); }
  function apply() {
    if (t.mode === 'light' || t.mode === 'dark') root.setAttribute('data-theme', t.mode);
    else if (host) root.setAttribute('data-theme', host); else root.removeAttribute('data-theme');
    attr('data-accent', t.accent, 'crimson'); attr('data-font', t.font, 'serif'); attr('data-width', t.width, 'normal');
    root.style.fontSize = SIZES[t.size] || '100%';
  }
  function effective() { var m = root.getAttribute('data-theme'); return m === 'dark' || m === 'light' ? m : (mq && mq.matches ? 'dark' : 'light'); }
  window.THEME = {
    accents: ACCENTS, sizes: SIZES, defaults: DEF,
    get: function () { return Object.assign({}, t); },
    set: function (p) { Object.assign(t, p); try { localStorage.setItem(KEY, JSON.stringify(t)); } catch (e) {} apply(); document.dispatchEvent(new CustomEvent('themechange')); },
    reset: function () { t = Object.assign({}, DEF); try { localStorage.removeItem(KEY); } catch (e) {} apply(); document.dispatchEvent(new CustomEvent('themechange')); },
    effective: effective
  };
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { document.dispatchEvent(new CustomEvent('themechange')); });
  apply();
})();
</script>
