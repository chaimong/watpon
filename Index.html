<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนวัดผลดิจิทัล</title>
<meta name="description" content="บทเรียนออนไลน์รายวิชา การวัดและประเมินผลการเรียนรู้ (Learning Measurement and Assessment) ระดับปริญญาตรี">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --ink:#1B2230; --ink-2:#4E586B; --ink-3:#7A8396; --line:#D8DDE6;
  --accent:#AE2550; --accent-ink:#FFFFFF; --accent-soft:#F7E4EA; --data:#1C6C68; --data-soft:#DCEEEB;
  --good:#2B7A4B; --good-soft:#E0F1E6; --warn:#9A6210; --warn-soft:#F6EAD3; --bad:#B0281F; --bad-soft:#F8E1DE;
  --grid:rgba(27,34,48,.045); --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.05);
  --font-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI","Leelawadee UI",Tahoma,sans-serif;
  --font-display:"Noto Serif Thai","Leelawadee UI",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --side:272px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131A; --surface:#171B23; --surface-2:#1F2430; --ink:#E6E9EF; --ink-2:#A7AFBE; --ink-3:#7D8698; --line:#2B3140;
    --accent:#EC7497; --accent-ink:#1A0B11; --accent-soft:#38202A; --data:#5CC3B8; --data-soft:#16302E;
    --good:#6CCB8F; --good-soft:#173324; --warn:#E3B25B; --warn-soft:#352914; --bad:#F2867D; --bad-soft:#3A1E1C;
    --grid:rgba(230,233,239,.04); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131A; --surface:#171B23; --surface-2:#1F2430; --ink:#E6E9EF; --ink-2:#A7AFBE; --ink-3:#7D8698; --line:#2B3140;
  --accent:#EC7497; --accent-ink:#1A0B11; --accent-soft:#38202A; --data:#5CC3B8; --data-soft:#16302E;
  --good:#6CCB8F; --good-soft:#173324; --warn:#E3B25B; --warn-soft:#352914; --bad:#F2867D; --bad-soft:#3A1E1C;
  --grid:rgba(230,233,239,.04); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
/* theme settings: typeface & width (accent colours are generated by the theme script) */
:root[data-font="sans"]{--font-display:"IBM Plex Sans Thai",system-ui,"Segoe UI","Leelawadee UI",Tahoma,sans-serif}
:root[data-font="sarabun"]{--font-body:"Sarabun",system-ui,"Segoe UI","Leelawadee UI",Tahoma,sans-serif;--font-display:"Sarabun",system-ui,"Leelawadee UI",Tahoma,sans-serif}
:root[data-width="wide"] .page{max-width:1320px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:.9375rem/1.7 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--data);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--data);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(1.55rem,2.6vw,2.1rem)} h2{font-size:1.3rem} h3{font-size:1.06rem}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .small{font-size:.86rem}
.note{display:block;margin-top:.5rem;font-size:.84rem;color:var(--ink-3)}
.tag-sim{display:inline-block;font-size:.72rem;padding:0 .5rem;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600;vertical-align:1px}

/* ── shell ───────────────────────────── */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 10px;border-bottom:1px solid var(--line)}
.brand-mark{width:38px;height:38px;flex:none;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;position:relative}
.brand-mark::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--accent)}
.brand b{display:block;font-family:var(--font-display);font-size:.98rem;line-height:1.3}
.brand span{font-size:.72rem;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:.92rem}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ico{width:18px;height:18px;flex:none}
.nav-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 18px;padding-left:10px;border-left:1px dashed var(--line)}
.nav-sub a{padding:4px 8px;font-size:.85rem}
.nav-label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px;font-weight:600}
.side-foot{margin-top:auto;font-size:.76rem;color:var(--ink-3);padding:10px 6px 0;border-top:1px solid var(--line)}
.main{min-width:0;padding-inline:clamp(16px,4vw,44px);padding-block:26px 64px}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}
.scrim{display:none}

/* answer-sheet bubbles */
.bub{--s:22px;width:var(--s);height:var(--s);flex:none;border-radius:50%;border:1.5px solid var(--ink-3);display:inline-grid;place-items:center;font:600 .66rem/1 var(--font-mono);color:var(--ink-3);background:transparent}
.bub.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.bub.now{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bub.part{background:linear-gradient(to top,var(--ink-3) var(--fill,40%),transparent 0);border-color:var(--ink-3);color:var(--ink)}

/* ── common blocks ───────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.flat{box-shadow:none}
.lift{box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;text-decoration:none;line-height:1.4}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;padding:1px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.data{background:var(--data-soft);color:var(--data)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.t th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:.8rem;white-space:nowrap}
.t tr:last-child td{border-bottom:none}
.t td.num,.t th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.reading table.t{margin:.4rem 0;display:block;overflow-x:auto}
.formula{font-family:var(--font-mono);background:var(--surface-2);border-radius:8px;padding:10px 14px;margin:.4rem 0;font-size:.9rem;overflow-x:auto}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:.6rem 0;align-items:center}
.flow span{padding:3px 10px;border:1px solid var(--line);border-radius:99px;font-size:.85rem;background:var(--surface)}
.flow span+span::before{content:"→";margin-right:8px;color:var(--ink-3)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.6}
input[type=number]{font-family:var(--font-mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink-2)}
.fb{border-radius:8px;padding:9px 12px;font-size:.88rem}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)} .fb.info{background:var(--data-soft);color:var(--data)} .fb.warn{background:var(--warn-soft);color:var(--warn)}
.fb b{font-weight:600}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
details.acc{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.acc>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.acc>summary::after{content:"+";color:var(--ink-3);font-family:var(--font-mono)}
details.acc[open]>summary::after{content:"−"}
details.acc>div{padding:0 14px 14px}
.copybox{font-family:var(--font-mono);font-size:.76rem;height:120px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:50;box-shadow:var(--shadow)}

/* ── home ───────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--surface);padding:clamp(20px,4vw,40px)}
.hero h1{font-size:clamp(1.8rem,3.6vw,2.7rem)}
.hero .en{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-3);letter-spacing:.02em}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end}
.sheet{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px 10px;align-items:center;font-family:var(--font-mono);font-size:.74rem;color:var(--ink-3);padding:14px 16px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.sheet .bub{--s:20px}
.loop{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.loop span{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.journey{display:flex;flex-direction:column;gap:0;position:relative}
.jn{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:6px 0;position:relative}
.jn::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:1.5px;background:var(--line)}
.jn:first-child::before{top:50%} .jn:last-child::before{bottom:50%}
.jn .bub{position:relative;z-index:1;background:var(--surface)}
.jn .bub.done{background:var(--ink)}
.mcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s,transform .15s}
.mcard:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.mcard h3{font-size:1rem}
.mcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.data>i{background:var(--data)}

/* ── module ─────────────────────────── */
.mhead{display:flex;flex-direction:column;gap:8px}
.steps{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;padding:6px 4px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2);font-size:.72rem;line-height:1.25;text-align:center}
.step:hover{background:var(--surface)}
.step[aria-current="step"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.step-body{display:flex;flex-direction:column;gap:16px}
.step-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.reading{display:flex;flex-direction:column;gap:14px}
.reading section{display:flex;flex-direction:column;gap:6px}
.reading ul,.reading ol{margin:.2rem 0;padding-left:1.3rem}
.sum{gap:22px;line-height:1.8}
.sum section{scroll-margin-top:80px}
.sum section p{margin:0 0 .55rem;text-indent:2em}
.sum section p[style*="center"]{text-indent:0}
.sum-abs{text-indent:2em;line-height:1.8;margin:0}
.sum-toc{border-top:1px dashed var(--line);padding-top:10px}
.sum-toc ol{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px}
.sum-toc a{text-decoration:none;color:inherit}.sum-toc a:hover{color:var(--accent)}
.sum-key{border-left:4px solid var(--accent)}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.refs li{padding-left:2.2em;text-indent:-2.2em;line-height:1.6;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:.9rem}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.scene{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-bottom:1px dashed var(--line)}
.scene:last-child{border-bottom:none}
.scene .tc{font-family:var(--font-mono);font-size:.78rem;color:var(--accent);padding-top:2px}
.scene .vis{font-size:.8rem;color:var(--ink-3)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.info>div{background:var(--surface);padding:14px}
.info b{display:block;font-family:var(--font-display);color:var(--accent);margin-bottom:2px}
.slides{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.slides div{counter-increment:s;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px;font-size:.82rem;display:flex;flex-direction:column;justify-content:space-between}
.slides div::before{content:"สไลด์ " counter(s);font-family:var(--font-mono);font-size:.68rem;color:var(--ink-3)}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q .stem{font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--ink-3)}
.opt .bub{--s:20px;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.score .big{font:600 1.8rem/1 var(--font-mono)}

/* scenario quiz (paged) */
.quizbox{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sheetbox>summary{cursor:pointer;list-style:none}
.qsheet{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:8px;max-width:440px}
.qb{aspect-ratio:1;max-width:36px;width:100%;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--surface);color:var(--ink-2);font:600 .7rem/1 var(--font-mono);cursor:pointer;padding:0}
.qb.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.qb.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.qb.no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.qb.now{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.qno{display:inline-block;font:600 .78rem var(--font-mono);color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 10px;margin-right:8px;vertical-align:2px}
.stem{line-height:1.75}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qsum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.qsum .big{font:600 1.7rem/1 var(--font-mono)}
/* classify */
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.bucket{border:1.5px dashed var(--line);border-radius:10px;padding:10px;min-height:74px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.bucket.over{border-color:var(--data);background:var(--data-soft)}
.bucket h4{margin:0;font-size:.8rem;color:var(--ink-2)}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);display:flex;flex-direction:column;gap:6px;cursor:grab;font-size:.9rem}
.chip.placed{cursor:default;font-size:.82rem;padding:6px 9px}
.chip.ok{border-color:var(--good);background:var(--good-soft)} .chip.no{border-color:var(--bad);background:var(--bad-soft)}
.chip .choices{display:flex;flex-wrap:wrap;gap:5px}

/* dashboards/charts */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font:600 1.6rem/1.1 var(--font-mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font:11px var(--font-body)}
.chart .ax{stroke:var(--line)}
.chart .gl{stroke:var(--line);stroke-dasharray:2 3}
.mlist{display:flex;flex-direction:column}
.mlist a{display:grid;grid-template-columns:auto minmax(0,1fr) 110px 44px;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-size:.9rem}
.mlist a:last-child{border-bottom:none}
.mlist a:hover{background:var(--surface-2)}
.sel{outline:2px solid var(--data);outline-offset:-2px}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--surface-2)}
tr.cur td{background:var(--data-soft)}

(function () {
  var KEY = 'lma.theme', root = document.documentElement, host = root.getAttribute('data-theme');
  var ACCENTS = {
    crimson: { th: 'แดงกระดาษคำตอบ', l: ['#AE2550', '#F7E4EA'], d: ['#EC7497', '#38202A'] },
    blue: { th: 'น้ำเงินวิชาการ', l: ['#1F4E9C', '#E2EAF7'], d: ['#86ABF2', '#1B2740'] },
    jade: { th: 'เขียวหยก', l: ['#0F6E55', '#DCEFE8'], d: ['#5FCBA8', '#15302A'] },
    indigo: { th: 'ม่วงคราม', l: ['#5B3A9E', '#ECE6F7'], d: ['#B7A1F2', '#28213D'] },
    terra: { th: 'ส้มอิฐ', l: ['#B4501B', '#F8E6DA'], d: ['#F29C66', '#3A2517'] },
    graphite: { th: 'เทาแกรไฟต์', l: ['#2F3A4C', '#E4E7ED'], d: ['#C6CEDB', '#272D39'] }
  };
  var css = '';
  Object.keys(ACCENTS).forEach(function (k) {
    if (k === 'crimson') return;
    var a = ACCENTS[k], dk = '--accent:' + a.d[0] + ';--accent-soft:' + a.d[1] + ';--accent-ink:#12151C';
    css += ':root[data-accent="' + k + '"]{--accent:' + a.l[0] + ';--accent-soft:' + a.l[1] + ';--accent-ink:#FFFFFF}';
    css += '@media (prefers-color-scheme: dark){:root[data-accent="' + k + '"]:not([data-theme="light"]){' + dk + '}}';
    css += ':root[data-theme="dark"][data-accent="' + k + '"]{' + dk + '}';
  });
  var st = document.createElement('style'); st.textContent = css; (document.head || root).appendChild(st);
  var SIZES = { s: '93.75%', m: '100%', l: '112.5%', xl: '125%' };
  var DEF = { mode: 'system', accent: 'crimson', size: 'm', font: 'serif', width: 'normal' };
  var t = Object.assign({}, DEF);
  try { Object.assign(t, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function attr(name, val, off) { if (val === off) root.removeAttribute(name); else root.setAttribute(name, val); }
  function apply() {
    if (t.mode === 'light' || t.mode === 'dark') root.setAttribute('data-theme', t.mode);
    else if (host) root.setAttribute('data-theme', host); else root.removeAttribute('data-theme');
    attr('data-accent', t.accent, 'crimson'); attr('data-font', t.font, 'serif'); attr('data-width', t.width, 'normal');
    root.style.fontSize = SIZES[t.size] || '100%';
  }
  function effective() { var m = root.getAttribute('data-theme'); return m === 'dark' || m === 'light' ? m : (mq && mq.matches ? 'dark' : 'light'); }
  window.THEME = {
    accents: ACCENTS, sizes: SIZES, defaults: DEF,
    get: function () { return Object.assign({}, t); },
    set: function (p) { Object.assign(t, p); try { localStorage.setItem(KEY, JSON.stringify(t)); } catch (e) {} apply(); document.dispatchEvent(new CustomEvent('themechange')); },
    reset: function () { t = Object.assign({}, DEF); try { localStorage.removeItem(KEY); } catch (e) {} apply(); document.dispatchEvent(new CustomEvent('themechange')); },
    effective: effective
  };
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { document.dispatchEvent(new CustomEvent('themechange')); });
  apply();
})();
</script>

    { h: 'ความหมายของการวัด การประเมิน และการประเมินค่า', p: `
      <p><b>การวัด (Measurement)</b> คือการกำหนดตัวเลขหรือสัญลักษณ์ให้แก่วัตถุหรือเหตุการณ์ตามกฎเกณฑ์ที่กำหนดไว้ (Stevens, 1946) ในทางการศึกษา ผลของการวัดคือ <i>ข้อมูล</i> เช่น คะแนน 16 จาก 20 หรือระดับ 3 ตามเกณฑ์การให้คะแนน คุณลักษณะที่วัดส่วนใหญ่ เช่น ความเข้าใจหรือการคิดวิเคราะห์ เป็นคุณลักษณะแฝง (latent trait) ที่สังเกตโดยตรงไม่ได้ จึงต้องอนุมานจากพฤติกรรมหรือผลงานที่สังเกตได้ (Crocker &amp; Algina, 1986)</p>
      <p><b>การประเมิน (Assessment)</b> หมายถึงกระบวนการรวบรวมและตีความหลักฐานการเรียนรู้จากหลายวิธี เช่น การทดสอบ การสังเกต และการตรวจผลงาน เพื่ออธิบายว่าผู้เรียนรู้อะไรและทำอะไรได้ (Miller et al., 2013; Brookhart &amp; Nitko, 2019) ส่วน <b>การประเมินค่า (Evaluation)</b> คือการตัดสินคุณค่าหรือคุณภาพของสิ่งที่ประเมินโดยเทียบกับเกณฑ์หรือมาตรฐาน เพื่อนำไปสู่การตัดสินใจ เช่น ผ่านหรือไม่ผ่าน ระดับผลการเรียน หรือการปรับปรุงหลักสูตร (Scriven, 1967)</p>
      <p>ในภาษาไทย คำว่า “การประเมิน” ถูกใช้แทนทั้ง Assessment และ Evaluation ผู้เรียนจึงควรพิจารณาจากบริบทว่ากำลังกล่าวถึง “การตีความหลักฐาน” หรือ “การตัดสินคุณค่าตามเกณฑ์”</p>` },
    { h: 'ระดับของการวัด (Scales of Measurement)', p: `
      <p>Stevens (1946) จำแนกระดับของการวัดเป็น 4 ระดับ ซึ่งกำหนดว่าการดำเนินการทางคณิตศาสตร์และสถิติแบบใดเหมาะสมกับข้อมูล</p>
      <table class="t"><thead><tr><th>ระดับ</th><th>คุณสมบัติ</th><th>ตัวอย่างทางการศึกษา</th></tr></thead><tbody>
      <tr><td>นามบัญญัติ (Nominal)</td><td>จำแนกกลุ่มเท่านั้น</td><td>เพศ แผนการเรียน กลุ่มเรียน</td></tr>
      <tr><td>เรียงอันดับ (Ordinal)</td><td>จำแนกและเรียงลำดับได้ แต่ช่วงห่างไม่จำเป็นต้องเท่ากัน</td><td>ลำดับที่สอบได้ ระดับคุณภาพตามเกณฑ์การให้คะแนน</td></tr>
      <tr><td>อันตรภาค (Interval)</td><td>ช่วงห่างเท่ากัน ไม่มีศูนย์แท้</td><td>คะแนนมาตรฐาน T อุณหภูมิเซลเซียส</td></tr>
      <tr><td>อัตราส่วน (Ratio)</td><td>ช่วงห่างเท่ากันและมีศูนย์แท้</td><td>เวลาที่ใช้ทำงาน จำนวนคำที่อ่านถูกต่อนาที</td></tr></tbody></table>
      <p>ข้อสังเกตสำคัญคือ ระดับคุณภาพตามเกณฑ์การให้คะแนนเป็นข้อมูลเรียงอันดับ การนำไปหาค่าเฉลี่ยจึงควรแปลผลอย่างระมัดระวังและรายงานการแจกแจงความถี่ประกอบ</p>` },
    { h: 'ความคลาดเคลื่อนของการวัด', p: `
      <p>ทฤษฎีการทดสอบแบบดั้งเดิม (Classical Test Theory) อธิบายว่า คะแนนที่สังเกตได้ (X) ประกอบด้วยคะแนนจริง (T) และความคลาดเคลื่อน (E) หรือ <b>X = T + E</b> (Lord &amp; Novick, 1968) ความคลาดเคลื่อนเกิดได้จากหลายแหล่ง เช่น ข้อคำถามที่กำกวม สภาพร่างกายและจิตใจของผู้สอบ สภาพแวดล้อมในการสอบ และความไม่คงเส้นคงวาของผู้ตรวจ (Crocker &amp; Algina, 1986)</p>
      <p>แนวคิดนี้มีนัยสำคัญต่อการปฏิบัติ 3 ประการ ได้แก่ (1) คะแนนเป็น <i>ค่าประมาณ</i> ของความสามารถ ไม่ใช่ความสามารถจริง (2) การตัดสินใจที่มีผลสำคัญต่อผู้เรียนควรใช้หลักฐานจากหลายแหล่ง และ (3) ผู้สอนควรตรวจสอบความเที่ยงและความคลาดเคลื่อนมาตรฐานของการวัด ซึ่งจะกล่าวถึงใน Module 5 และ 6 (AERA et al., 2014)</p>` },
    { h: 'จุดมุ่งหมายของการวัดและประเมินผล', p: `
      <p>การวัดและประเมินผลในชั้นเรียนมีจุดมุ่งหมายหลายประการ (Miller et al., 2013; Brookhart &amp; Nitko, 2019) ได้แก่</p>
      <ul><li><b>วินิจฉัย (Diagnosis)</b> ค้นหาจุดเด่น จุดที่ต้องพัฒนา และความเข้าใจคลาดเคลื่อน</li>
      <li><b>พัฒนา (Improvement)</b> ให้ข้อมูลย้อนกลับแก่ผู้เรียนและปรับปรุงการสอน</li>
      <li><b>จัดตำแหน่งและคัดเลือก (Placement/Selection)</b> จัดผู้เรียนเข้ากลุ่มหรือโปรแกรมที่เหมาะสม</li>
      <li><b>ตัดสินและรับรองผล (Certification)</b> ตัดสินระดับผลการเรียนหรือการผ่านเกณฑ์</li>
      <li><b>พยากรณ์ (Prediction)</b> คาดการณ์ความสำเร็จในอนาคต</li>
      <li><b>ประเมินหลักสูตรและการจัดการเรียนรู้ (Program Evaluation)</b></li></ul>
      <p>ในบริบทของประเทศไทย หลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551 กำหนดหลักการพื้นฐานของการวัดและประเมินผลการเรียนรู้ไว้ 2 ประการ คือ การประเมินเพื่อพัฒนาผู้เรียน และการประเมินเพื่อตัดสินผลการเรียน และแบ่งการประเมินเป็น 4 ระดับ ได้แก่ ระดับชั้นเรียน ระดับสถานศึกษา ระดับเขตพื้นที่การศึกษา และระดับชาติ (กระทรวงศึกษาธิการ, 2551)</p>` },
    { h: 'ประเภทของการประเมินตามช่วงเวลาและการใช้ผล', p: `
      <p>Scriven (1967) เสนอคำว่า <i>formative</i> และ <i>summative evaluation</i> ในบริบทการประเมินหลักสูตร ต่อมา Bloom et al. (1971) ได้นำแนวคิดนี้มาใช้กับการประเมินการเรียนรู้ของผู้เรียน การจำแนกที่ใช้ทั่วไปมีดังนี้</p>
      <ul><li><b>การประเมินเพื่อวินิจฉัย (Diagnostic Assessment)</b> ใช้ก่อนหรือระหว่างเรียน เพื่อค้นหาความรู้เดิม ทักษะพื้นฐาน และความเข้าใจคลาดเคลื่อน สำหรับวางแผนการสอน</li>
      <li><b>การประเมินระหว่างเรียน (Formative Assessment)</b> ใช้ระหว่างการเรียนการสอน เพื่อให้ข้อมูลย้อนกลับและปรับการเรียนการสอน การสังเคราะห์งานวิจัยของ Black และ Wiliam (1998) พบหลักฐานว่าการประเมินระหว่างเรียนที่ดีช่วยยกระดับผลสัมฤทธิ์ของผู้เรียนได้</li>
      <li><b>การประเมินสรุปผล (Summative Assessment)</b> ใช้เมื่อจบหน่วยการเรียนรู้หรือรายวิชา เพื่อสรุปและรับรองผลการเรียนรู้</li></ul>
      <p>ประเด็นสำคัญคือ ประเภทของการประเมินขึ้นกับ <b>การนำผลไปใช้</b> มิใช่รูปแบบของเครื่องมือ แบบทดสอบชุดเดียวกันอาจทำหน้าที่ formative หากผลถูกใช้ปรับการเรียนรู้ หรือทำหน้าที่ summative หากใช้เพื่อสรุปผล (Wiliam, 2011)</p>` },
    { h: 'กรอบอ้างอิงในการแปลผล', p: `
      <p>คะแนนเพียงตัวเลขเดียวไม่มีความหมายจนกว่าจะเทียบกับกรอบอ้างอิง ซึ่งมี 3 แบบหลัก</p>
      <ul><li><b>อิงกลุ่ม (Norm-referenced)</b> เทียบผลของผู้เรียนกับผู้อื่นในกลุ่มอ้างอิง เช่น ตำแหน่งเปอร์เซ็นไทล์ หรือคะแนนมาตรฐาน เหมาะกับการคัดเลือกและจัดอันดับ</li>
      <li><b>อิงเกณฑ์ (Criterion-referenced)</b> เทียบผลกับเกณฑ์หรือมาตรฐานการเรียนรู้ที่กำหนด แนวคิดนี้ได้รับการเสนออย่างเป็นระบบโดย Glaser (1963) เหมาะกับการตรวจสอบการบรรลุผลลัพธ์การเรียนรู้</li>
      <li><b>อิงตนเอง (Self-referenced หรือ Ipsative)</b> เทียบผลกับผลครั้งก่อนของผู้เรียนเอง เพื่อดูพัฒนาการ</li></ul>
      <p>การประเมินในชั้นเรียนที่มุ่งพัฒนาผู้เรียนตามผลลัพธ์การเรียนรู้มักใช้การแปลผลแบบอิงเกณฑ์เป็นหลัก (Brookhart &amp; Nitko, 2019)</p>` },
    { h: 'Assessment for Learning, as Learning และ of Learning', p: `
      <p>Earl (2003) จำแนกบทบาทของการประเมินตามผู้ใช้ผลและจุดมุ่งหมาย ดังนี้</p>
      <table class="t"><thead><tr><th>แนวคิด</th><th>จุดเน้น</th><th>ผู้ใช้ผลหลัก</th><th>ตัวอย่าง</th></tr></thead><tbody>
      <tr><td>Assessment <b>for</b> Learning</td><td>ใช้หลักฐานเพื่อปรับการสอนและให้ข้อมูลย้อนกลับ</td><td>ผู้สอน</td><td>คำถามระหว่างสอน บัตรทบทวนท้ายคาบ (exit ticket)</td></tr>
      <tr><td>Assessment <b>as</b> Learning</td><td>ผู้เรียนติดตามและกำกับการเรียนรู้ของตนเอง (metacognition)</td><td>ผู้เรียน</td><td>การประเมินตนเองด้วยเกณฑ์ บันทึกการเรียนรู้</td></tr>
      <tr><td>Assessment <b>of</b> Learning</td><td>สรุปและรับรองผลการเรียนรู้</td><td>ผู้สอน ผู้บริหาร ผู้ปกครอง</td><td>การสอบปลายภาค การตัดสินระดับผลการเรียน</td></tr></tbody></table>
      <p>Wiliam (2011) ชี้ว่า การประเมินจะเป็น “เพื่อการเรียนรู้” ก็ต่อเมื่อหลักฐานถูกนำไปใช้ปรับการเรียนการสอนให้ตอบสนองความต้องการของผู้เรียน การออกแบบการประเมินในชั้นเรียนจึงควรมีทั้งสามบทบาทอย่างสมดุล</p>` }
  ],
  key: [
    'การวัดให้ข้อมูล การประเมินตีความหลักฐาน และการประเมินค่าตัดสินคุณค่าโดยเทียบกับเกณฑ์',
    'ระดับของการวัดกำหนดว่าข้อมูลควรวิเคราะห์ด้วยสถิติแบบใด (Stevens, 1946)',
    'ทุกการวัดมีความคลาดเคลื่อน (X = T + E) จึงควรใช้หลักฐานหลายแหล่งก่อนตัดสินใจเรื่องสำคัญ',
    'การประเมินเป็น formative หรือ summative ขึ้นอยู่กับการนำผลไปใช้ ไม่ใช่รูปแบบของเครื่องมือ',

  ],

window.SUMMARIES[2] = {
  abstract: `ผลลัพธ์การเรียนรู้ (Learning Outcomes) เป็นจุดตั้งต้นของการออกแบบการสอนและการประเมิน เพราะบอกว่าผู้เรียนต้องแสดงพฤติกรรมใดจึงจะถือว่าเกิดการเรียนรู้ บทนี้สรุประดับของผลลัพธ์การเรียนรู้ หลักการเขียนผลลัพธ์ที่สังเกตและวัดได้ อนุกรมวิธานของ Bloom ฉบับปรับปรุง พฤติกรรมด้านจิตพิสัยและทักษะพิสัย และการแปลงเป้าหมายกว้างให้เป็นพฤติกรรมที่วัดได้พร้อมหลักฐานการเรียนรู้`,
  sections: [
    { h: 'ผลลัพธ์การเรียนรู้และระดับของผลลัพธ์', p: `
      <p>การศึกษาที่มุ่งผลลัพธ์ (Outcome-based Education) ให้ความสำคัญกับสิ่งที่ผู้เรียนทำได้จริงเมื่อจบการเรียนรู้ และใช้ผลลัพธ์นั้นกำหนดหลักสูตร การสอน และการประเมิน (Spady, 1994) Biggs และ Tang (2011) เรียกผลลัพธ์ที่ตั้งใจให้เกิดว่า Intended Learning Outcomes (ILOs) และถือเป็นแกนของการจัดการเรียนการสอนที่สอดคล้องกัน</p>
      <p>ผลลัพธ์การเรียนรู้มีหลายระดับที่ต้องเชื่อมโยงกันเป็นลำดับ ได้แก่ ผลลัพธ์ระดับหลักสูตร (PLOs) ผลลัพธ์ระดับรายวิชา (CLOs) และผลลัพธ์ระดับบทเรียนหรือหน่วยการเรียนรู้ (LLOs) ผลลัพธ์ระดับล่างหลายข้อร่วมกันสนับสนุนผลลัพธ์ระดับบน ส่วนจุดประสงค์การเรียนรู้ (Learning Objectives) มักเป็นข้อความที่ละเอียดกว่าและใช้วางแผนการสอนรายคาบ</p>` },
    { h: 'หลักการเขียนผลลัพธ์การเรียนรู้', p: `
      <p>Mager (1962) เสนอว่าจุดประสงค์ที่ดีควรมีองค์ประกอบ 3 ส่วน คือ พฤติกรรมที่ผู้เรียนแสดง (performance) เงื่อนไขที่พฤติกรรมเกิดขึ้น (conditions) และเกณฑ์ที่ยอมรับได้ (criterion) ต่อมามีการขยายเป็นรูปแบบ ABCD ได้แก่ Audience (ผู้เรียน) Behavior (พฤติกรรม) Condition (เงื่อนไข) และ Degree (ระดับเกณฑ์) (Smaldino et al., 2019)</p>
      <ul><li>เขียนจากมุมของผู้เรียน เช่น “ผู้เรียนสามารถ...” มิใช่สิ่งที่ผู้สอนจะทำ</li>
      <li>ใช้คำกริยาที่สังเกตได้ 1 คำต่อ 1 ผลลัพธ์ หลีกเลี่ยงคำที่สังเกตไม่ได้ เช่น “รู้” “เข้าใจ” “ตระหนัก” หากไม่ระบุพฤติกรรมที่แสดงออก</li>
      <li>ระบุเนื้อหาหรือบริบทให้ชัด และเพิ่มเงื่อนไขหรือเกณฑ์เมื่อจำเป็น</li>
      <li>ระดับพฤติกรรมเหมาะกับวุฒิภาวะของผู้เรียนและเวลาที่มี</li></ul>
      <p>ตัวอย่าง: “เมื่อได้รับข้อมูลคำตอบของผู้สอบ 40 คน (C) นักศึกษา (A) สามารถคำนวณค่าความยากและค่าอำนาจจำแนกรายข้อ (B) ได้ถูกต้องอย่างน้อย 9 ใน 10 ข้อ (D)”</p>` },
    { h: 'อนุกรมวิธานของ Bloom ฉบับปรับปรุง', p: `
      <p>Anderson และ Krathwohl (2001) ปรับปรุงอนุกรมวิธานด้านพุทธิพิสัยให้เป็น <b>สองมิติ</b> คือ มิติกระบวนการทางปัญญา (Cognitive Process) 6 ระดับ และมิติความรู้ (Knowledge) 4 ประเภท (Krathwohl, 2002)</p>
      <table class="t"><thead><tr><th>กระบวนการทางปัญญา</th><th>ความหมาย</th><th>ตัวอย่างคำกริยา</th></tr></thead><tbody>
      <tr><td>จำ (Remember)</td><td>ระลึกหรือจำแนกข้อมูลจากความจำระยะยาว</td><td>ระบุ บอก ทวน</td></tr>
      <tr><td>เข้าใจ (Understand)</td><td>สร้างความหมายจากสารที่ได้รับ</td><td>อธิบาย ยกตัวอย่าง สรุป จำแนก</td></tr>
      <tr><td>ประยุกต์ใช้ (Apply)</td><td>ใช้กระบวนการในสถานการณ์ที่กำหนด</td><td>คำนวณ ใช้ ดำเนินการ</td></tr>
      <tr><td>วิเคราะห์ (Analyze)</td><td>แยกส่วนและหาความสัมพันธ์ขององค์ประกอบ</td><td>วิเคราะห์ เปรียบเทียบ จัดระบบ</td></tr>
      <tr><td>ประเมิน (Evaluate)</td><td>ตัดสินโดยใช้เกณฑ์หรือมาตรฐาน</td><td>ตรวจสอบ วิพากษ์ ตัดสิน</td></tr>
      <tr><td>สร้างสรรค์ (Create)</td><td>รวมองค์ประกอบเป็นสิ่งใหม่ที่มีความเป็นเอกภาพ</td><td>ออกแบบ วางแผน สร้าง</td></tr></tbody></table>
      <p>มิติความรู้ประกอบด้วย ความรู้ข้อเท็จจริง (Factual) ความรู้มโนทัศน์ (Conceptual) ความรู้เชิงกระบวนการ (Procedural) และความรู้อภิปัญญา (Metacognitive) ข้อควรระวังคือ คำกริยาเพียงคำเดียวไม่ได้กำหนดระดับเสมอไป ต้องพิจารณาภาระงานที่ให้ผู้เรียนทำ เช่น การ “เปรียบเทียบ” สิ่งที่ผู้สอนเคยเปรียบเทียบให้ดูแล้วอาจเป็นเพียงระดับจำ</p>` },
    { h: 'พฤติกรรมด้านจิตพิสัย (Affective Domain)', p: `
      <p>Krathwohl et al. (1964) จำแนกพฤติกรรมด้านจิตพิสัยตามระดับการซึมซับค่านิยมเข้าสู่ตนเอง (internalization) เป็น 5 ระดับ ได้แก่ การรับรู้ (Receiving) การตอบสนอง (Responding) การเห็นคุณค่า (Valuing) การจัดระบบค่านิยม (Organization) และการสร้างลักษณะนิสัยตามค่านิยม (Characterization by a value or value complex)</p>
      <p>การประเมินด้านจิตพิสัยควรใช้หลักฐานหลายแหล่ง เช่น การสังเกตพฤติกรรมในสถานการณ์จริง การประเมินตนเอง และแบบสอบถาม และควรใช้เพื่อการพัฒนามากกว่าการตัดสิน เพราะพฤติกรรมด้านนี้อ่อนไหวต่อการตอบตามความคาดหวังทางสังคม (Miller et al., 2013)</p>` },
    { h: 'พฤติกรรมด้านทักษะพิสัย (Psychomotor Domain)', p: `
      <p>อนุกรมวิธานด้านทักษะพิสัยที่ใช้แพร่หลายมี 2 แนวคิด</p>
      <ul><li><b>Simpson (1972)</b> 7 ระดับ ได้แก่ การรับรู้ (Perception) ความพร้อม (Set) การตอบสนองตามคำแนะนำ (Guided Response) การทำได้เป็นกลไก (Mechanism) การตอบสนองที่ซับซ้อน (Complex Overt Response) การปรับใช้ (Adaptation) และการริเริ่ม (Origination)</li>
      <li><b>Dave (1970)</b> 5 ระดับ ได้แก่ การเลียนแบบ (Imitation) การทำตามแบบ (Manipulation) ความแม่นยำ (Precision) การประสานการเคลื่อนไหว (Articulation) และการทำได้อย่างเป็นธรรมชาติ (Naturalization)</li></ul>
      <p>การประเมินทักษะพิสัยต้องให้ผู้เรียนลงมือปฏิบัติจริง และใช้เครื่องมือ เช่น แบบตรวจสอบรายการหรือเกณฑ์การให้คะแนนที่ระบุพฤติกรรมบ่งชี้อย่างชัดเจน (ดู Module 7)</p>` },
    { h: 'จากเป้าหมายกว้างสู่พฤติกรรมที่วัดได้และหลักฐานการเรียนรู้', p: `
      <p>Wiggins และ McTighe (2005) เสนอให้ผู้สอนถามว่า “หลักฐานใดจะแสดงว่าผู้เรียนบรรลุผลลัพธ์แล้ว” ตั้งแต่ขั้นเขียนผลลัพธ์ การแปลงเป้าหมายกว้างให้เป็นพฤติกรรมที่วัดได้จึงช่วยให้ออกแบบการประเมินได้ตรงกับสิ่งที่ต้องการ</p>
      <table class="t"><thead><tr><th>เป้าหมายกว้าง</th><th>พฤติกรรมที่สังเกตและวัดได้</th><th>หลักฐานการเรียนรู้</th></tr></thead><tbody>
      <tr><td>เข้าใจการประเมินระหว่างเรียน</td><td>ยกตัวอย่างกิจกรรมการประเมินระหว่างเรียนในวิชาของตน และอธิบายการใช้ผลได้</td><td>แผนกิจกรรมพร้อมคำอธิบายการใช้ผล</td></tr>
      <tr><td>ตระหนักถึงจริยธรรมการใช้ข้อมูล</td><td>ระบุความเสี่ยงด้านความเป็นส่วนตัวในแผนการใช้ข้อมูลผู้เรียนและเสนอวิธีป้องกันได้</td><td>ตารางวิเคราะห์ความเสี่ยง</td></tr>
      <tr><td>รู้วิธีวิเคราะห์ข้อสอบ</td><td>คำนวณค่า p และ r จากข้อมูลคำตอบ และระบุข้อที่ควรปรับปรุงได้</td><td>รายงานผลการวิเคราะห์ข้อสอบ</td></tr></tbody></table>` }
  ],
  key: [
    'ผลลัพธ์การเรียนรู้ระดับหลักสูตร รายวิชา และบทเรียนต้องเชื่อมโยงกันเป็นลำดับ',
    'ผลลัพธ์ที่ดีระบุพฤติกรรมที่สังเกตได้ เงื่อนไข และเกณฑ์ (Mager, 1962; รูปแบบ ABCD)',
    'Bloom ฉบับปรับปรุงมีสองมิติ คือ กระบวนการทางปัญญา 6 ระดับ และความรู้ 4 ประเภท (Anderson & Krathwohl, 2001)',
    'ระดับของผลลัพธ์ขึ้นกับภาระงานที่ให้ผู้เรียนทำ ไม่ใช่คำกริยาเพียงอย่างเดียว',
    'ผลลัพธ์ทุกข้อควรกำหนดหลักฐานการเรียนรู้ที่จะใช้ประเมินตั้งแต่ขั้นออกแบบ'
  ],
  refs: [
    'Anderson, L. W., &amp; Krathwohl, D. R. (Eds.). (2001). <i>A taxonomy for learning, teaching, and assessing: A revision of Bloom’s taxonomy of educational objectives</i>. Longman.',
    'Biggs, J., &amp; Tang, C. (2011). <i>Teaching for quality learning at university</i> (4th ed.). Open University Press.',
    'Dave, R. H. (1970). Psychomotor levels. In R. J. Armstrong (Ed.), <i>Developing and writing behavioral objectives</i> (pp. 20–21). Educational Innovators Press.',
    'Krathwohl, D. R. (2002). A revision of Bloom’s taxonomy: An overview. <i>Theory Into Practice, 41</i>(4), 212–218.',
    'Krathwohl, D. R., Bloom, B. S., &amp; Masia, B. B. (1964). <i>Taxonomy of educational objectives, Handbook II: Affective domain</i>. David McKay.',
    'Mager, R. F. (1962). <i>Preparing instructional objectives</i>. Fearon.',
    'Miller, M. D., Linn, R. L., &amp; Gronlund, N. E. (2013). <i>Measurement and assessment in teaching</i> (11th ed.). Pearson.',
    'Simpson, E. J. (1972). <i>The classification of educational objectives in the psychomotor domain</i>. Gryphon House.',
    'Smaldino, S. E., Lowther, D. L., Mims, C., &amp; Russell, J. D. (2019). <i>Instructional technology and media for learning</i> (12th ed.). Pearson.',
    'Spady, W. G. (1994). <i>Outcome-based education: Critical issues and answers</i>. American Association of School Administrators.',

  ]

window.SUMMARIES[3] = {
  abstract: `การออกแบบการประเมินที่ดีเริ่มจากการทำให้ผลลัพธ์การเรียนรู้ กิจกรรมการเรียนรู้ และวิธีการประเมินสอดคล้องกัน บทนี้สรุปหลักความสอดคล้องเชิงสร้างสรรค์ การออกแบบย้อนกลับ องค์ประกอบของแผนการประเมิน การสร้างผังการออกข้อสอบ การเลือกวิธีประเมินให้เหมาะกับผลลัพธ์ และหลักการกำหนดสัดส่วนคะแนนอย่างเป็นธรรม`,
  sections: [
    { h: 'ความสอดคล้องเชิงสร้างสรรค์ (Constructive Alignment)', p: `
      <p>Biggs (1996) เสนอว่าผลลัพธ์การเรียนรู้ที่ตั้งใจ (ILOs) กิจกรรมการเรียนการสอน (Teaching and Learning Activities) และงานที่ใช้ประเมิน (Assessment Tasks) ต้องสอดคล้องกัน โดยใช้ <b>คำกริยาในผลลัพธ์การเรียนรู้เป็นตัวเชื่อม</b> หากผลลัพธ์คือ “ออกแบบ” ผู้เรียนต้องได้ฝึกออกแบบในกิจกรรม และการประเมินต้องพิจารณาผลงานการออกแบบ มิใช่เพียงถามให้จำขั้นตอนการออกแบบ (Biggs &amp; Tang, 2011)</p>
      <p>คำว่า “เชิงสร้างสรรค์” (constructive) มาจากแนวคิดคอนสตรัคติวิสต์ที่ว่าผู้เรียนสร้างความรู้ผ่านกิจกรรมที่ตนลงมือทำ ส่วน “ความสอดคล้อง” (alignment) หมายถึงการจัดสภาพแวดล้อมการเรียนรู้ให้ทุกองค์ประกอบมุ่งไปสู่ผลลัพธ์เดียวกัน</p>` },
    { h: 'การออกแบบย้อนกลับ (Backward Design)', p: `
      <p>Wiggins และ McTighe (2005) เสนอการออกแบบย้อนกลับ 3 ขั้นตอน ได้แก่ (1) กำหนดผลลัพธ์ที่ต้องการ (Identify desired results) (2) กำหนดหลักฐานที่ยอมรับได้ (Determine acceptable evidence) และ (3) วางแผนประสบการณ์การเรียนรู้และการสอน (Plan learning experiences and instruction)</p>
      <p>จุดเด่นของแนวคิดนี้คือการวางแผน <b>การประเมินก่อนการวางแผนกิจกรรม</b> ทำให้ผู้สอนคิดเหมือนผู้ประเมิน และลดปัญหา “สอนอย่างหนึ่ง สอบอีกอย่างหนึ่ง”</p>` },
    { h: 'องค์ประกอบของแผนการประเมิน (Assessment Plan)', p: `
      <p>แผนการประเมินที่ครบถ้วนควรตอบคำถามต่อไปนี้ (Brookhart &amp; Nitko, 2019)</p>
      <table class="t"><thead><tr><th>คำถาม</th><th>สิ่งที่ต้องระบุ</th></tr></thead><tbody>
      <tr><td>วัดอะไร</td><td>ผลลัพธ์การเรียนรู้หรือสมรรถนะ</td></tr>
      <tr><td>หลักฐานคืออะไร</td><td>สิ่งที่ผู้เรียนต้องแสดงหรือผลิต</td></tr>
      <tr><td>วัดอย่างไร</td><td>วิธีการและเครื่องมือ</td></tr>
      <tr><td>เมื่อใด</td><td>ก่อน ระหว่าง หรือหลังเรียน</td></tr>
      <tr><td>ใครประเมิน</td><td>ผู้สอน ผู้เรียนประเมินตนเอง เพื่อน หรือผู้เกี่ยวข้อง</td></tr>
      <tr><td>ใช้เกณฑ์ใด</td><td>เกณฑ์การให้คะแนนหรือระดับคุณภาพ</td></tr>
      <tr><td>น้ำหนักเท่าใด</td><td>สัดส่วนคะแนน</td></tr>
      <tr><td>ใช้ผลอย่างไร</td><td>ให้ข้อมูลย้อนกลับ สอนซ่อมเสริม หรือตัดสินผล</td></tr></tbody></table>
      <p>ผู้สอนตรวจสอบความสอดคล้องได้ด้วยตาราง CLO × วิธีการประเมิน โดยตอบ 3 คำถาม: CLO ทุกข้อมีการประเมินหรือไม่ การประเมินทุกชิ้นเชื่อมกับ CLO ใด และน้ำหนักคะแนนสะท้อนความสำคัญของ CLO หรือไม่</p>` },
    { h: 'ผังการออกข้อสอบ (Test Blueprint หรือ Table of Specifications)', p: `
      <p>ผังการออกข้อสอบเป็นตารางสองมิติที่ใช้วางแผนให้ข้อสอบเป็นตัวแทนของเนื้อหาและระดับพฤติกรรมตามสัดส่วนที่ตั้งใจ จึงเป็นหลักฐานสำคัญของความตรงเชิงเนื้อหา (Miller et al., 2013; Fives &amp; DiDonato-Barnes, 2013) แถวแทนเนื้อหาหรือผลลัพธ์การเรียนรู้ คอลัมน์แทนระดับพฤติกรรม และแต่ละช่องระบุจำนวนข้อหรือคะแนน</p>
      <p><b>ขั้นตอน:</b> กำหนดน้ำหนักเนื้อหาจากความสำคัญหรือเวลาที่สอน → กำหนดน้ำหนักระดับพฤติกรรม → กำหนดจำนวนข้อทั้งหมด → คำนวณ น้ำหนักเนื้อหา × น้ำหนักพฤติกรรม × จำนวนข้อทั้งหมด → ปัดเศษและปรับให้ผลรวมแถวและคอลัมน์ถูกต้อง → ตรวจความเหมาะสมรายช่อง</p>
      <p><b>ตัวอย่าง (ข้อมูลสมมุติ):</b> ข้อสอบ 40 ข้อ เนื้อหา A:B:C = 30:40:30 และพฤติกรรม จำ–เข้าใจ : ประยุกต์ใช้ : วิเคราะห์ขึ้นไป = 40:40:20</p>
      <table class="t"><thead><tr><th>เนื้อหา</th><th class="num">จำ–เข้าใจ</th><th class="num">ประยุกต์ใช้</th><th class="num">วิเคราะห์ขึ้นไป</th><th class="num">รวม</th></tr></thead><tbody>
      <tr><td>A (30%)</td><td class="num">5 (4.8)</td><td class="num">5 (4.8)</td><td class="num">2 (2.4)</td><td class="num">12</td></tr>
      <tr><td>B (40%)</td><td class="num">6 (6.4)</td><td class="num">6 (6.4)</td><td class="num">4 (3.2)</td><td class="num">16</td></tr>
      <tr><td>C (30%)</td><td class="num">5 (4.8)</td><td class="num">5 (4.8)</td><td class="num">2 (2.4)</td><td class="num">12</td></tr>
      <tr><td><b>รวม</b></td><td class="num">16</td><td class="num">16</td><td class="num">8</td><td class="num">40</td></tr></tbody></table>
      <p class="small muted">ตัวเลขในวงเล็บคือค่าที่คำนวณได้ก่อนปัดเศษ ช่อง B × วิเคราะห์ขึ้นไป ปรับจาก 3.2 เป็น 4 เพื่อให้ผลรวมคอลัมน์ตรงกับสัดส่วนที่ตั้งไว้</p>` },
    { h: 'การเลือกวิธีประเมินให้เหมาะกับผลลัพธ์การเรียนรู้', p: `
      <p>วิธีประเมินที่เหมาะสมขึ้นกับธรรมชาติของผลลัพธ์การเรียนรู้ (Brookhart &amp; Nitko, 2019; Miller et al., 2013)</p>
      <table class="t"><thead><tr><th>ธรรมชาติของผลลัพธ์</th><th>วิธีประเมินที่เหมาะสม</th></tr></thead><tbody>
      <tr><td>ความรู้ ข้อเท็จจริง มโนทัศน์</td><td>ข้อสอบเลือกตอบ ถูก–ผิด จับคู่ ตอบสั้น</td></tr>
      <tr><td>การให้เหตุผล การวิเคราะห์ การประเมิน</td><td>ข้อสอบเชิงสถานการณ์ อัตนัย กรณีศึกษา</td></tr>
      <tr><td>ทักษะการปฏิบัติ</td><td>การประเมินการปฏิบัติ พร้อมแบบตรวจสอบรายการหรือเกณฑ์การให้คะแนน</td></tr>
      <tr><td>ผลงานและการสร้างสรรค์</td><td>โครงงาน แฟ้มสะสมงาน พร้อมเกณฑ์การให้คะแนน</td></tr>
      <tr><td>คุณลักษณะและเจตคติ</td><td>การสังเกต แบบสอบถาม การประเมินตนเองและเพื่อน โดยใช้หลายแหล่ง</td></tr></tbody></table>` },
    { h: 'สัดส่วนคะแนนและความเป็นธรรม', p: `
      <ul><li>น้ำหนักคะแนนควรสะท้อนความสำคัญของผลลัพธ์การเรียนรู้ มิใช่ความสะดวกในการตรวจ</li>
      <li>ไม่ควรให้การประเมินชิ้นเดียวมีน้ำหนักมากจนความคลาดเคลื่อนเพียงครั้งเดียวกำหนดผลของทั้งรายวิชา</li>
      <li>ระบุให้ชัดว่าชิ้นงานใดเป็นการประเมินระหว่างเรียน (อาจไม่นับคะแนน) และชิ้นใดเป็นการประเมินสรุปผล</li>
      <li>แจ้งเกณฑ์และสัดส่วนคะแนนให้ผู้เรียนทราบล่วงหน้า</li></ul>
      <p>มาตรฐานการทดสอบทางการศึกษาและจิตวิทยากำหนดให้ <b>ความเป็นธรรม (Fairness)</b> เป็นหลักพื้นฐานของการใช้คะแนน ซึ่งครอบคลุมโอกาสในการเรียนรู้สิ่งที่ถูกประเมิน การเข้าถึงเครื่องมือ และการปรับการประเมินให้เหมาะกับผู้เรียนที่มีความต้องการจำเป็นพิเศษ (AERA et al., 2014)</p>` }
  ],
  key: [
    'ผลลัพธ์การเรียนรู้ กิจกรรม และการประเมินต้องสอดคล้องกัน โดยใช้คำกริยาในผลลัพธ์เป็นตัวเชื่อม (Biggs, 1996)',
    'การออกแบบย้อนกลับวางแผนหลักฐานการเรียนรู้ก่อนวางแผนกิจกรรม (Wiggins & McTighe, 2005)',
    'ผังการออกข้อสอบเป็นหลักฐานความตรงเชิงเนื้อหาของแบบทดสอบ',
    'วิธีประเมินต้องเหมาะกับธรรมชาติของผลลัพธ์การเรียนรู้',
    'น้ำหนักคะแนนต้องสะท้อนความสำคัญของผลลัพธ์และคำนึงถึงความเป็นธรรม (AERA et al., 2014)'

window.SUMMARIES[4] = {
  abstract: `เครื่องมือวัดเป็นช่องทางที่ผู้เรียนใช้แสดงหลักฐานการเรียนรู้ คุณภาพของเครื่องมือจึงกำหนดคุณภาพของข้อมูลที่ได้ บทนี้สรุปประเภทของข้อสอบ หลักการเขียนข้อสอบแบบเลือกตอบ ถูก–ผิด จับคู่ ตอบสั้น และอัตนัย เครื่องมือที่ไม่ใช่แบบทดสอบ และกระบวนการทบทวนคุณภาพเครื่องมือก่อนนำไปทดลองใช้`,
  sections: [
    { h: 'ประเภทของข้อสอบ', p: `
      <p>ข้อสอบแบ่งตามลักษณะการตอบได้ 2 กลุ่มใหญ่ (Haladyna &amp; Rodriguez, 2013)</p>
      <ul><li><b>แบบเลือกตอบ (Selected-response)</b> เช่น เลือกตอบ ถูก–ผิด และจับคู่ ตรวจได้รวดเร็วและเป็นปรนัย ครอบคลุมเนื้อหาได้กว้างในเวลาจำกัด แต่มีโอกาสเดา และเขียนให้วัดการคิดขั้นสูงได้ยากกว่า</li>
      <li><b>แบบสร้างคำตอบ (Constructed-response)</b> เช่น ตอบสั้นและอัตนัย วัดการเรียบเรียงความคิดและการให้เหตุผลได้ดี แต่ใช้เวลาตรวจมาก และมีความคลาดเคลื่อนจากผู้ตรวจ</li></ul>
      <p>การเลือกประเภทข้อสอบต้องพิจารณาจากผลลัพธ์การเรียนรู้ที่ต้องการวัดเป็นหลัก (ดู Module 3)</p>` },
    { h: 'หลักการเขียนข้อสอบแบบเลือกตอบ', p: `
      <p>Haladyna et al. (2002) สังเคราะห์แนวทางการเขียนข้อสอบเลือกตอบจากตำราและงานวิจัย ข้อที่สำคัญสำหรับผู้สอน ได้แก่</p>
      <ul><li>ตัวคำถาม (stem) ชัดเจน ถามประเด็นเดียว และบรรจุสาระส่วนใหญ่ไว้ในตัวคำถาม</li>
      <li>หลีกเลี่ยงคำปฏิเสธ หากจำเป็นให้เน้นคำนั้นให้เห็นชัด</li>
      <li>มีคำตอบถูกหรือ “ถูกที่สุด” เพียงตัวเลือกเดียวที่ผู้เชี่ยวชาญเห็นพ้องกัน</li>
      <li>ตัวลวง (distractors) น่าเชื่อถือ และสร้างจากความเข้าใจคลาดเคลื่อนที่พบจริง</li>
      <li>ตัวเลือกเป็นเรื่องเดียวกัน ยาวใกล้เคียงกัน และไม่มีคำใบ้ทางไวยากรณ์หรือคำซ้ำกับตัวคำถาม</li>
      <li>หลีกเลี่ยง “ถูกทุกข้อ” และใช้ “ไม่มีข้อใดถูก” อย่างระมัดระวัง</li>
      <li>กระจายตำแหน่งของคำตอบถูกให้สมดุล</li></ul>
      <p>เรื่องจำนวนตัวเลือก การวิเคราะห์อภิมานของ Rodriguez (2005) พบว่าข้อสอบ 3 ตัวเลือกให้คุณภาพใกล้เคียงกับ 4–5 ตัวเลือกในหลายบริบท เพราะตัวลวงที่เพิ่มขึ้นมักไม่มีผู้เลือก ประเด็นสำคัญจึงอยู่ที่ <b>คุณภาพของตัวลวง</b> มากกว่าจำนวน (แบบทดสอบในรายวิชานี้ใช้ 5 ตัวเลือก ก–จ เพื่อฝึกการเขียนตัวลวงที่มีคุณภาพ)</p>` },
    { h: 'ข้อสอบแบบถูก–ผิด จับคู่ และตอบสั้น', p: `
      <ul><li><b>ถูก–ผิด:</b> ข้อความหนึ่งข้อมีความคิดเดียว ถูกหรือผิดอย่างชัดเจน หลีกเลี่ยงคำเด็ดขาด เช่น “ทุกครั้ง” “ไม่เคย” ที่กลายเป็นคำใบ้ และหลีกเลี่ยงการปฏิเสธซ้อน ข้อจำกัดคือโอกาสเดาถูก 50% ต่อข้อ</li>
      <li><b>จับคู่:</b> รายการในแต่ละชุดเป็นเรื่องเดียวกัน (homogeneous) จำนวนตัวเลือกมากกว่าคำถามหรือใช้ซ้ำได้ ระบุวิธีจับคู่ให้ชัด และจัดไว้ในหน้าเดียวกัน</li>
      <li><b>ตอบสั้นหรือเติมคำ:</b> ถามให้มีคำตอบถูกที่ชัดเจนและสั้น วางช่องว่างไว้ท้ายประโยค และเตรียมเฉลยที่ยอมรับคำตอบใกล้เคียงไว้ล่วงหน้า</li></ul>
      <p class="small muted">สรุปจาก Miller et al. (2013) และ Brookhart และ Nitko (2019)</p>` },
    { h: 'ข้อสอบอัตนัยและการตรวจให้คะแนน', p: `
      <p>ข้อสอบอัตนัยเหมาะกับการวัดการเรียบเรียงความคิด การให้เหตุผล และการประเมินค่า แต่มีความคลาดเคลื่อนจากผู้ตรวจสูงกว่าข้อสอบเลือกตอบ แนวทางเพิ่มความเที่ยงของการตรวจ (Miller et al., 2013; Brookhart &amp; Nitko, 2019) ได้แก่</p>
      <ul><li>ระบุภาระงานให้ชัด เช่น อภิปราย เปรียบเทียบ ให้เหตุผล พร้อมกำหนดขอบเขตหรือความยาว</li>
      <li>เตรียมเกณฑ์การให้คะแนนหรือแนวคำตอบก่อนการสอบ</li>
      <li>ตรวจทีละข้อของผู้สอบทุกคน แทนการตรวจทั้งฉบับทีละคน เพื่อคงมาตรฐานเดียวกัน</li>
      <li>ปิดชื่อผู้สอบเพื่อลดอคติจากความประทับใจเดิม (halo effect)</li>
      <li>หลีกเลี่ยงการให้เลือกทำบางข้อ เพราะทำให้เปรียบเทียบคะแนนระหว่างผู้สอบได้ยาก</li></ul>` },
    { h: 'เครื่องมือที่ไม่ใช่แบบทดสอบ', p: `
      <table class="t"><thead><tr><th>เครื่องมือ</th><th>เหมาะกับ</th><th>หลักการสำคัญ</th></tr></thead><tbody>
      <tr><td>การสังเกต (Observation)</td><td>พฤติกรรม ทักษะ</td><td>กำหนดพฤติกรรมบ่งชี้ ช่วงเวลา และวิธีบันทึก</td></tr>
      <tr><td>การสัมภาษณ์ (Interview)</td><td>ความคิด เหตุผล ความรู้สึก</td><td>ใช้แนวคำถามแบบมีโครงสร้างหรือกึ่งโครงสร้าง และไม่ถามชี้นำ</td></tr>
      <tr><td>แบบสอบถาม (Questionnaire)</td><td>ความคิดเห็น เจตคติ</td><td>ข้อละหนึ่งประเด็น ภาษาง่าย พิจารณาข้อความทางลบและการกลับคะแนน มาตรประมาณค่าแบบ Likert (1932) เป็นรูปแบบที่ใช้แพร่หลาย</td></tr>
      <tr><td>แบบตรวจสอบรายการ (Checklist)</td><td>ขั้นตอน องค์ประกอบ</td><td>บันทึกแบบมีหรือไม่มี ทำหรือไม่ทำ</td></tr>
      <tr><td>มาตรประมาณค่า (Rating Scale)</td><td>ระดับคุณภาพหรือความถี่</td><td>นิยามแต่ละระดับให้ชัด</td></tr>
      <tr><td>เกณฑ์การให้คะแนน (Rubric)</td><td>ผลงาน การปฏิบัติ</td><td>เกณฑ์ ระดับ และคำอธิบายระดับ (ดู Module 7)</td></tr>
      <tr><td>แฟ้มสะสมงาน (Portfolio)</td><td>พัฒนาการต่อเนื่อง</td><td>มีเกณฑ์คัดเลือกชิ้นงาน การสะท้อนคิด และเกณฑ์ประเมิน</td></tr></tbody></table>` },
    { h: 'การทบทวนคุณภาพก่อนทดลองใช้', p: `

  abstract: `การวิเคราะห์ข้อสอบ (Item Analysis) เป็นการใช้ข้อมูลการตอบของผู้สอบเพื่อตรวจสอบคุณภาพของข้อสอบรายข้อและทั้งฉบับ ผลการวิเคราะห์ช่วยให้ผู้สอนปรับปรุงข้อสอบ ตรวจพบเฉลยผิดหรือข้อกำกวม และเข้าใจความคลาดเคลื่อนของคะแนน บทนี้สรุปค่าความยาก ค่าอำนาจจำแนก การวิเคราะห์ตัวลวง ความเที่ยงทั้งฉบับ ความคลาดเคลื่อนมาตรฐานของการวัด และหลักการตัดสินใจปรับปรุงข้อสอบ`,
  sections: [
    { h: 'กรอบแนวคิดของการวิเคราะห์ข้อสอบ', p: `
      <p>การวิเคราะห์ข้อสอบตามทฤษฎีการทดสอบแบบดั้งเดิมใช้สถิติที่คำนวณได้ง่ายจากข้อมูลการตอบ ได้แก่ ค่าความยาก ค่าอำนาจจำแนก และสัดส่วนการเลือกตัวเลือก (Crocker &amp; Algina, 1986) ค่าสถิติเหล่านี้ <b>ขึ้นกับกลุ่มผู้สอบ</b> ข้อสอบข้อเดียวกันอาจมีค่าต่างกันเมื่อใช้กับกลุ่มที่มีความสามารถต่างกัน การตีความจึงต้องพิจารณาลักษณะของกลุ่ม จุดประสงค์ของแบบทดสอบ และเนื้อหาของข้อสอบประกอบเสมอ (Haladyna &amp; Rodriguez, 2013)</p>` },
    { h: 'ค่าความยาก (Difficulty Index, p)', p: `
      <p style="text-align:center"><b>p = R / N</b></p>
      <p>R คือจำนวนผู้ตอบถูก และ N คือจำนวนผู้สอบทั้งหมด ค่า p อยู่ระหว่าง 0 ถึง 1 ค่ายิ่งสูงแสดงว่าข้อสอบยิ่งง่าย แบบทดสอบอิงกลุ่มนิยมเลือกข้อที่มีค่า p ประมาณ .20–.80 เพราะข้อที่ง่ายหรือยากเกินไปให้ข้อมูลการจำแนกผู้สอบได้น้อย (Ebel &amp; Frisbie, 1991)</p>
      <p><b>ข้อควรระวัง:</b> แบบทดสอบอิงเกณฑ์ที่ใช้หลังการสอนเพื่อตรวจการรอบรู้ (mastery) อาจมีค่า p สูงได้โดยไม่ใช่ข้อบกพร่อง เพราะเป้าหมายคือให้ผู้เรียนส่วนใหญ่บรรลุผลลัพธ์</p>` },
    { h: 'ค่าอำนาจจำแนก (Discrimination Index, r)', p: `
      <p style="text-align:center"><b>r = (R<sub>U</sub> − R<sub>L</sub>) / n</b></p>
      <p>R<sub>U</sub> และ R<sub>L</sub> คือจำนวนผู้ตอบถูกในกลุ่มสูงและกลุ่มต่ำ และ n คือจำนวนผู้สอบในแต่ละกลุ่ม การแบ่งกลุ่มนิยมใช้ร้อยละ 27 บนและล่างตามข้อเสนอของ Kelley (1939) ค่า r อยู่ระหว่าง −1 ถึง +1</p>
      <table class="t"><thead><tr><th>ค่า r</th><th>การตีความ (Ebel &amp; Frisbie, 1991)</th></tr></thead><tbody>
      <tr><td>≥ .40</td><td>ข้อสอบดีมาก</td></tr><tr><td>.30–.39</td><td>ดี อาจปรับปรุงเล็กน้อย</td></tr>
      <tr><td>.20–.29</td><td>พอใช้ ควรปรับปรุง</td></tr><tr><td>&lt; .20</td><td>ควรปรับปรุงมากหรือตัดออก</td></tr></tbody></table>
      <p>ค่า r <b>ติดลบ</b> หมายความว่ากลุ่มต่ำตอบถูกมากกว่ากลุ่มสูง ผู้สอนควรตรวจเฉลยและความกำกวมของข้อสอบทันที อีกทางเลือกหนึ่งคือสหสัมพันธ์แบบพอยต์ไบซีเรียลที่ปรับแก้ (corrected item–total หรือ item–rest correlation) ซึ่งใช้ข้อมูลของผู้สอบทุกคน (Crocker &amp; Algina, 1986)</p>` },
    { h: 'การวิเคราะห์ตัวลวง (Distractor Analysis)', p: `
      <p>ตัวลวงที่ทำหน้าที่ได้ดีควรมีผู้เลือกพอสมควร และผู้เลือกส่วนใหญ่มาจากกลุ่มต่ำ Haladyna และ Downing (1993) ใช้เกณฑ์ว่าตัวลวงที่มีผู้เลือกน้อยกว่าร้อยละ 5 เป็นตัวลวงที่ไม่ทำหน้าที่ (non-functioning distractor)</p>
      <ul><li><b>ตัวลวงไม่มีผู้เลือก</b> แสดงว่าตัวลวงไม่น่าเชื่อ ควรเขียนใหม่จากความเข้าใจคลาดเคลื่อนที่พบจริง</li>
      <li><b>ตัวลวงที่กลุ่มสูงเลือกมากกว่ากลุ่มต่ำ</b> อาจถูกบางส่วน กำกวม หรือเฉลยผิด ควรตรวจเนื้อหาของข้อสอบ</li>
      <li><b>ตัวลวงที่ดี</b> กลุ่มต่ำเลือกมากกว่ากลุ่มสูง และช่วยวินิจฉัยความเข้าใจคลาดเคลื่อนของผู้เรียนได้</li></ul>` },
    { h: 'ความเที่ยงทั้งฉบับและความคลาดเคลื่อนมาตรฐานของการวัด', p: `
      <p>ความเที่ยงของแบบทดสอบที่ตรวจแบบถูกผิด (0/1) นิยมคำนวณด้วย <b>KR-20 = [k/(k−1)] × [1 − Σpq / σ²ₓ]</b> (Kuder &amp; Richardson, 1937) ข้อสอบที่มีค่าอำนาจจำแนกดีจะช่วยเพิ่มความเที่ยงทั้งฉบับ ส่วนแบบทดสอบที่มีจำนวนข้อน้อย หรือผู้สอบมีความสามารถใกล้เคียงกันมาก มักมีค่า KR-20 ต่ำ</p>
      <p>ความคลาดเคลื่อนมาตรฐานของการวัด <b>SEM = σₓ √(1 − rₓₓ)</b> บอกขนาดความคลาดเคลื่อนของคะแนนรายบุคคล (Harvill, 1991) เช่น ผู้สอบได้ 30 คะแนน และ SEM = 2 ช่วง 30 ± 2 (28–32) มีโอกาสครอบคลุมคะแนนจริงประมาณร้อยละ 68 และช่วง ±2 SEM ประมาณร้อยละ 95 (ตัวอย่างสมมุติ) ความต่างของคะแนนระหว่างผู้สอบที่น้อยกว่า SEM จึงไม่ควรตีความว่าความสามารถต่างกันจริง</p>` },
    { h: 'หลักการตัดสินใจปรับปรุงข้อสอบ', p: `
      <table class="t"><thead><tr><th>ลักษณะที่พบ</th><th>สาเหตุที่เป็นไปได้</th><th>แนวทางแก้ไข</th></tr></thead><tbody>
      <tr><td>p สูงมาก r ต่ำ</td><td>ง่ายเกินไป มีคำใบ้ หรือตัวลวงอ่อน</td><td>ตัดคำใบ้ ปรับตัวลวง หรือคงไว้หากเป็นเนื้อหาพื้นฐานที่ต้องรอบรู้</td></tr>
      <tr><td>p ต่ำมาก r ต่ำ</td><td>ยากเกินไป ไม่ได้สอน กำกวม หรือเฉลยผิด</td><td>ตรวจเฉลยและการสอน ปรับภาษา</td></tr>
      <tr><td>r ติดลบ</td><td>เฉลยผิด หรือมีคำตอบถูกมากกว่าหนึ่งตัวเลือก</td><td>ตรวจเฉลย ให้คะแนนใหม่หากจำเป็น และเขียนข้อใหม่</td></tr>
      <tr><td>ตัวลวงไม่มีผู้เลือก</td><td>ตัวลวงไม่น่าเชื่อ</td><td>เขียนตัวลวงใหม่จากความเข้าใจคลาดเคลื่อนจริง</td></tr>
      <tr><td>กลุ่มสูงเลือกตัวลวงมาก</td><td>ตัวลวงถูกบางส่วนหรือกำกวม</td><td>แก้ถ้อยคำให้ชัดเจน</td></tr></tbody></table>
      <p>ค่าสถิติที่คำนวณจากกลุ่มตัวอย่างขนาดเล็ก เช่น ผู้สอบ 30–40 คน มีความคลาดเคลื่อนจากการสุ่มสูง จึงควรใช้เป็น <b>สัญญาณให้ตรวจสอบ</b> ร่วมกับการพิจารณาเนื้อหาโดยผู้เชี่ยวชาญ มิใช่เกณฑ์ตัดข้อสอบโดยอัตโนมัติ (Haladyna &amp; Rodriguez, 2013)</p>` }
  ],
  key: [
    'ค่าสถิติรายข้อขึ้นกับกลุ่มผู้สอบ จึงต้องตีความร่วมกับบริบทและจุดประสงค์ของแบบทดสอบ',
    'p = R/N บอกความง่าย ส่วน r = (RU − RL)/n บอกความสามารถในการแยกกลุ่มสูงกับกลุ่มต่ำ',
    'r ติดลบเป็นสัญญาณให้ตรวจเฉลยและความกำกวมทันที',
    'ตัวลวงที่มีผู้เลือกน้อยกว่าร้อยละ 5 ถือว่าไม่ทำหน้าที่ (Haladyna & Downing, 1993)',
    'SEM บอกช่วงความคลาดเคลื่อนของคะแนนรายบุคคล ความต่างที่น้อยกว่า SEM ไม่ควรตีความว่าแตกต่างจริง'
  ],
  refs: [
    'Crocker, L., &amp; Algina, J. (1986). <i>Introduction to classical and modern test theory</i>. Holt, Rinehart and Winston.',
    'Ebel, R. L., &amp; Frisbie, D. A. (1991). <i>Essentials of educational measurement</i> (5th ed.). Prentice Hall.',
    'Haladyna, T. M., &amp; Downing, S. M. (1993). How many options is enough for a multiple-choice test item? <i>Educational and Psychological Measurement, 53</i>(4), 999–1010.',
    'Haladyna, T. M., &amp; Rodriguez, M. C. (2013). <i>Developing and validating test items</i>. Routledge.',
    'Harvill, L. M. (1991). Standard error of measurement. <i>Educational Measurement: Issues and Practice, 10</i>(2), 33–41.',
    'Kelley, T. L. (1939). The selection of upper and lower groups for the validation of test items. <i>Journal of Educational Psychology, 30</i>(1), 17–24.',
    'Kuder, G. F., &amp; Richardson, M. W. (1937). The theory of the estimation of test reliability. <i>Psychometrika, 2</i>(3), 151–160.'
  ]
};

window.SUMMARIES[7] = {
  abstract: `การประเมินตามสภาพจริงให้ผู้เรียนแสดงความรู้และทักษะผ่านภาระงานที่มีความหมายและใกล้เคียงบริบทจริง โดยใช้เกณฑ์การให้คะแนนที่ชัดเจนเป็นเครื่องมือหลัก บทนี้สรุปแนวคิดการประเมินตามสภาพจริง รูปแบบการประเมิน การออกแบบภาระงาน ประเภทและหลักการเขียนเกณฑ์การให้คะแนน การเพิ่มความเที่ยงของการให้คะแนน และการใช้เกณฑ์การให้คะแนนเพื่อการเรียนรู้`,
  sections: [
    { h: 'แนวคิดการประเมินตามสภาพจริง (Authentic Assessment)', p: `
      <p>Wiggins (1990) อธิบายว่าการประเมินตามสภาพจริงคือการประเมินที่ตรวจสอบการปฏิบัติของผู้เรียนโดยตรงในภาระงานทางปัญญาที่มีคุณค่า ผู้เรียนต้องใช้ความรู้อย่างมีวิจารณญาณในบริบทที่ใกล้เคียงกับที่ผู้ประกอบวิชาชีพหรือพลเมืองต้องเผชิญจริง ต่อมา Wiggins (1998) เสนอว่าการประเมินควร “ให้การศึกษา” (educative) คือช่วยให้ผู้เรียนพัฒนา มิใช่เพียงตรวจสอบ</p>
      <p>การประเมินตามสภาพจริงไม่ได้หมายถึง “ทุกงานที่ไม่ใช่ข้อสอบ” ภาระงานที่ไม่มีเกณฑ์ชัดเจน หรือไม่สัมพันธ์กับผลลัพธ์การเรียนรู้ ไม่ถือว่าเป็นการประเมินที่มีคุณภาพ</p>` },
    { h: 'รูปแบบของการประเมินตามสภาพจริง', p: `
      <table class="t"><thead><tr><th>รูปแบบ</th><th>จุดเน้น</th><th>ข้อควรระวัง</th></tr></thead><tbody>
      <tr><td>การประเมินการปฏิบัติ (Performance Assessment)</td><td>การปฏิบัติหรือผลงานตามภาระงาน</td><td>ใช้เวลามาก ต้องมีเกณฑ์และการฝึกผู้ประเมิน</td></tr>
      <tr><td>การประเมินโครงงาน (Project-based Assessment)</td><td>กระบวนการและผลงานระยะยาว</td><td>แยกส่วนความรับผิดชอบของบุคคลและกลุ่มให้ชัด</td></tr>
      <tr><td>แฟ้มสะสมงาน (Portfolio Assessment)</td><td>พัฒนาการและการสะท้อนคิด</td><td>ต้องมีเกณฑ์คัดเลือกชิ้นงานและเกณฑ์ประเมิน (Paulson et al., 1991)</td></tr>
      <tr><td>การสังเกต (Observation)</td><td>พฤติกรรมในสถานการณ์จริง</td><td>กำหนดพฤติกรรมบ่งชี้ และลดอคติของผู้สังเกต</td></tr>
      <tr><td>การประเมินตนเอง (Self-assessment)</td><td>การกำกับการเรียนรู้ของตนเอง</td><td>ต้องฝึกการใช้เกณฑ์ (Andrade &amp; Du, 2007)</td></tr>
      <tr><td>การประเมินโดยเพื่อน (Peer Assessment)</td><td>เรียนรู้จากการประเมินงานของผู้อื่น</td><td>ต้องฝึกและมีตัวอย่าง ปกปิดชื่อเมื่อเหมาะสม (Topping, 1998)</td></tr></tbody></table>` },
    { h: 'การออกแบบภาระงานการปฏิบัติ', p: `
      <p>Wiggins และ McTighe (2005) เสนอกรอบ <b>GRASPS</b> สำหรับเขียนภาระงานให้มีบริบทจริง ได้แก่ Goal (เป้าหมายของงาน) Role (บทบาทของผู้เรียน) Audience (ผู้รับผลงาน) Situation (สถานการณ์) Product/Performance (ผลงานหรือการปฏิบัติ) และ Standards (เกณฑ์ความสำเร็จ)</p>
      <p><b>ตัวอย่าง:</b> “ในฐานะครูฝึกสอนวิชาพลศึกษา (R) ให้ออกแบบการประเมินทักษะการเสิร์ฟลูกวอลเลย์บอล (G) สำหรับนักเรียนชั้น ม.2 ที่มีทักษะหลากหลายระดับ (S) เพื่อเสนอต่อครูพี่เลี้ยง (A) โดยจัดทำภาระงานพร้อมเกณฑ์การให้คะแนนแบบแยกองค์ประกอบ (P) ที่ครอบคลุมท่าทาง ความแม่นยำ และความสม่ำเสมอ (S)”</p>` },
    { h: 'เกณฑ์การให้คะแนนแบบแยกองค์ประกอบและแบบภาพรวม', p: `
      <p>เกณฑ์การให้คะแนน (Rubric) ประกอบด้วย เกณฑ์ที่ใช้ประเมิน ระดับคุณภาพ และคำอธิบายระดับคุณภาพของแต่ละเกณฑ์ (Brookhart, 2013)</p>
      <ul><li><b>แบบแยกองค์ประกอบ (Analytic Rubric)</b> แยกประเมินทีละเกณฑ์ ให้ข้อมูลย้อนกลับละเอียด เหมาะกับการประเมินระหว่างเรียน แต่ใช้เวลาตรวจมากกว่า</li>
      <li><b>แบบภาพรวม (Holistic Rubric)</b> ให้ระดับเดียวจากภาพรวมของผลงาน ตรวจได้เร็ว เหมาะกับการตัดสินภาพรวม แต่ให้ข้อมูลย้อนกลับน้อย</li></ul>
      <p>นอกจากนี้ Brookhart (2013) ยังจำแนกเกณฑ์ทั่วไป (general rubric) ที่ใช้ได้กับภาระงานหลายชิ้นในกลุ่มเดียวกัน และเกณฑ์เฉพาะงาน (task-specific rubric) ที่ใช้กับงานชิ้นเดียว โดยเสนอว่าเกณฑ์ทั่วไปเหมาะกับการใช้เพื่อการเรียนรู้มากกว่า เพราะผู้เรียนนำไปใช้ซ้ำได้</p>` },
    { h: 'หลักการเขียนคำอธิบายระดับคุณภาพ', p: `
      <ul><li>เกณฑ์สะท้อนผลลัพธ์การเรียนรู้ มิใช่ความเรียบร้อยหรือความยาวของงานเป็นหลัก</li>
      <li>คำอธิบายบอก <b>คุณภาพที่สังเกตได้</b> ของแต่ละระดับ</li>
      <li>คำอธิบายแต่ละระดับขนานกัน คือเปลี่ยนเฉพาะระดับคุณภาพในมิติเดียวกัน</li>
      <li>หลีกเลี่ยงคำคลุมเครือ เช่น “ดี” “ดีมาก” และการนับจำนวนเพียงอย่างเดียว</li>
      <li>ใช้จำนวนระดับที่เหมาะสม โดยทั่วไป 3–5 ระดับ</li>
      <li>ทดลองใช้กับผลงานตัวอย่าง และตรวจความสอดคล้องระหว่างผู้ประเมินก่อนใช้จริง</li></ul>
      <p class="small muted">สรุปจาก Brookhart (2013)</p>` },
    { h: 'ความเที่ยงของการให้คะแนนและการใช้เกณฑ์เพื่อการเรียนรู้', p: `
      <p>การทบทวนงานวิจัยของ Jonsson และ Svingby (2007) พบว่าเกณฑ์การให้คะแนนช่วยเพิ่มความสอดคล้องของการให้คะแนนได้ โดยเฉพาะเมื่อเกณฑ์เป็นแบบแยกองค์ประกอบ มีผลงานตัวอย่าง (anchor/exemplar) และมีการฝึกผู้ประเมิน แนวปฏิบัติที่แนะนำคือ ประชุมปรับเทียบ (calibration) ระหว่างผู้ประเมิน ตรวจความสอดคล้องด้วย κ หรือ ICC (Module 5) และปรับถ้อยคำในเกณฑ์ที่ผู้ประเมินตีความต่างกัน</p>
      <p>ในด้านการเรียนรู้ Panadero และ Jonsson (2013) สรุปว่าการใช้เกณฑ์การให้คะแนนเพื่อการประเมินระหว่างเรียนช่วยให้ผู้เรียนเข้าใจความคาดหวัง กำกับตนเอง และปรับปรุงงานได้ดีขึ้น เมื่อผู้เรียนได้เห็นเกณฑ์ล่วงหน้าและฝึกใช้เกณฑ์ประเมินตนเองหรือเพื่อน เกณฑ์การให้คะแนนแบบดิจิทัลในระบบ LMS ช่วยให้แสดงเกณฑ์ คำนวณคะแนน และเก็บข้อมูลย้อนกลับรายเกณฑ์ได้สะดวก แต่คุณภาพยังขึ้นกับการเขียนเกณฑ์มากกว่าเทคโนโลยี</p>` }

window.SUMMARIES[8] = {
  abstract: `ข้อมูลผลการประเมินมีคุณค่าเมื่อถูกวิเคราะห์ แปลผลอย่างถูกต้อง และนำไปใช้พัฒนาผู้เรียน บทนี้สรุปสถิติพื้นฐานสำหรับอ่านผลการประเมิน คะแนนมาตรฐาน การวัดพัฒนาการ หลักการให้ข้อมูลย้อนกลับที่มีประสิทธิภาพ การวิเคราะห์การเรียนรู้และการตัดสินใจโดยอาศัยข้อมูล ตลอดจนจริยธรรมและกฎหมายที่เกี่ยวข้องกับการใช้ข้อมูลผู้เรียน`,
  sections: [
    { h: 'สถิติพื้นฐานสำหรับอ่านผลการประเมิน', p: `
      <ul><li><b>แนวโน้มเข้าสู่ส่วนกลาง:</b> ค่าเฉลี่ย (mean) และมัธยฐาน (median) มัธยฐานเหมาะกว่าเมื่อข้อมูลเบ้หรือมีค่าผิดปกติ</li>
      <li><b>การกระจาย:</b> ส่วนเบี่ยงเบนมาตรฐาน (SD) พิสัย และฮิสโตแกรม ช่วยตอบว่าผู้เรียนในห้อง “ใกล้เคียงกัน” หรือ “ต่างกันมาก”</li>
      <li><b>รายมาตรฐานหรือรายเกณฑ์:</b> ร้อยละของคะแนนเฉลี่ยและร้อยละของผู้บรรลุเกณฑ์ ช่วยระบุผลลัพธ์ที่ต้องสอนเสริม</li>
      <li><b>รายบุคคล:</b> จุดแข็ง จุดที่ต้องพัฒนา และแนวโน้มของผลการเรียน</li></ul>
      <p>ค่าเฉลี่ยของห้องที่เพิ่มขึ้นไม่ได้แปลว่าผู้เรียนทุกคนพัฒนาขึ้น ผู้สอนจึงควรดูการกระจายและข้อมูลรายบุคคลประกอบเสมอ (Miller et al., 2013)</p>` },
    { h: 'คะแนนมาตรฐานและการแปลผล', p: `
      <table class="t"><thead><tr><th>กรอบการแปลผล</th><th>สถิติที่ใช้</th><th>ตัวอย่างการแปลผล</th></tr></thead><tbody>
      <tr><td>อิงกลุ่ม</td><td>z = (X − X̄) / SD ; T = 50 + 10z ; เปอร์เซ็นไทล์</td><td>“คะแนนสูงกว่าค่าเฉลี่ยของห้อง 1 ส่วนเบี่ยงเบนมาตรฐาน”</td></tr>
      <tr><td>อิงเกณฑ์</td><td>ร้อยละ ระดับตามเกณฑ์ ผ่านหรือไม่ผ่านเกณฑ์</td><td>“บรรลุมาตรฐาน S1 และ S2 แต่ยังไม่บรรลุ S3”</td></tr>
      <tr><td>อิงตนเอง</td><td>คะแนนพัฒนาการ แนวโน้ม</td><td>“คะแนนเพิ่มขึ้น 6 คะแนนจากก่อนเรียน”</td></tr></tbody></table>
      <p>คะแนนมาตรฐานทำให้เปรียบเทียบคะแนนจากแบบทดสอบต่างฉบับได้ เพราะแปลงให้อยู่บนมาตราเดียวกัน อย่างไรก็ตาม การแปลงคะแนน z เป็นเปอร์เซ็นไทล์ด้วยตารางโค้งปกติ ใช้ได้เมื่อการแจกแจงของคะแนนใกล้เคียงโค้งปกติเท่านั้น (Miller et al., 2013)</p>` },
    { h: 'การวัดพัฒนาการ (Learning Gain)', p: `
      <p>พัฒนาการอย่างง่ายคำนวณจาก <b>gain = คะแนนหลังเรียน − คะแนนก่อนเรียน</b> แต่ผู้ที่มีคะแนนก่อนเรียนสูงมีช่องว่างให้พัฒนาได้น้อยกว่า Hake (1998) จึงเสนอ <b>normalized gain</b></p>
      <p style="text-align:center"><b>⟨g⟩ = (%หลังเรียน − %ก่อนเรียน) / (100 − %ก่อนเรียน)</b></p>
      <p>ซึ่งบอกสัดส่วนของพัฒนาการที่เกิดขึ้นเทียบกับพัฒนาการสูงสุดที่เป็นไปได้ Hake (1998) จำแนกค่า ⟨g⟩ เป็นระดับต่ำ (&lt; .30) ปานกลาง (.30–.70) และสูง (&gt; .70) ในการแปลผลรายบุคคล ผู้สอนควรคำนึงถึง SEM ด้วย เพราะความต่างเพียง 1–2 คะแนนอาจอยู่ในช่วงความคลาดเคลื่อนของการวัด (Harvill, 1991)</p>` },
    { h: 'การให้ข้อมูลย้อนกลับที่มีประสิทธิภาพ', p: `
      <p>Hattie และ Timperley (2007) เสนอว่าข้อมูลย้อนกลับที่มีประสิทธิภาพต้องตอบ 3 คำถาม ได้แก่ <b>Where am I going?</b> (เป้าหมายคืออะไร) <b>How am I going?</b> (ความก้าวหน้าเป็นอย่างไร) และ <b>Where to next?</b> (ขั้นต่อไปคืออะไร) และจำแนกข้อมูลย้อนกลับเป็น 4 ระดับ ได้แก่ ระดับงาน (task) ระดับกระบวนการ (process) ระดับการกำกับตนเอง (self-regulation) และระดับตัวบุคคล (self) โดยข้อมูลย้อนกลับระดับตัวบุคคล เช่น “เก่งมาก” มักมีผลต่อการเรียนรู้น้อยที่สุด</p>
      <p>Shute (2008) สรุปจากการทบทวนงานวิจัยว่าข้อมูลย้อนกลับเพื่อการพัฒนาควรเฉพาะเจาะจง ชัดเจน มุ่งที่งานมากกว่าตัวผู้เรียน มีปริมาณพอเหมาะ และให้ในจังหวะที่ผู้เรียนนำไปใช้ปรับปรุงได้</p>` },
    { h: 'การวิเคราะห์การเรียนรู้และการตัดสินใจโดยอาศัยข้อมูล', p: `
      <p>นิยามที่ใช้แพร่หลายจากการประชุม LAK ครั้งแรกในปี 2011 (อ้างใน Siemens &amp; Long, 2011) ระบุว่า Learning Analytics คือ การวัด การเก็บรวบรวม การวิเคราะห์ และการรายงานข้อมูลเกี่ยวกับผู้เรียนและบริบทของผู้เรียน เพื่อทำความเข้าใจและพัฒนาการเรียนรู้และสภาพแวดล้อมที่การเรียนรู้เกิดขึ้น</p>
      <p>Mandinach และ Gummer (2016) เสนอแนวคิด <b>การรู้เท่าทันข้อมูลสำหรับครู (Data Literacy for Educators)</b> คือความสามารถในการเปลี่ยนข้อมูลเป็นสารสนเทศและนำไปสู่การปฏิบัติที่เหมาะสมในการสอน แนวทางที่ใช้ในรายวิชานี้เป็นแบบ <b>data-informed</b> ซึ่งถือว่าข้อมูลเป็นหลักฐานประกอบ และครูยังคงใช้วิจารณญาณทางวิชาชีพและบริบทในการตัดสินใจ มิใช่ให้ข้อมูลตัดสินแทนทั้งหมด</p>` },

  ['ครูรวบรวมผลงาน บันทึกการสังเกต และคำตอบในชั้นเรียน เพื่อทำความเข้าใจว่านักเรียนเข้าใจเรื่องเศษส่วนเพียงใด กิจกรรมนี้ตรงกับข้อใดมากที่สุด', 'การประเมิน (Assessment)', ['การวัด (Measurement)', 'การประเมินค่า (Evaluation)', 'การทดสอบมาตรฐาน (Standardized)', 'การจัดอันดับ (Ranking)'], 'การรวบรวมและตีความหลักฐานจากหลายแหล่งเพื่อเข้าใจการเรียนรู้คือ Assessment'],
  ['นักศึกษาฝึกสอนต้องสรุปความสัมพันธ์ของการวัด การประเมิน และการประเมินค่า ให้เพื่อนครู ข้อสรุปใดถูกต้องที่สุด', 'วัดได้ข้อมูล ประเมินตีความ ประเมินค่าตัดสิน', ['ประเมินค่าต้องเกิดก่อนการวัดเสมอ', 'การวัดกับการประเมินค่าเป็นสิ่งเดียวกันเสมอ', 'การประเมินไม่จำเป็นต้องใช้ข้อมูลใด', 'การวัดใช้ตัดสินผ่านหรือไม่ผ่านโดยตรง'], 'การวัดให้ข้อมูล การประเมินรวบรวมและตีความหลักฐาน การประเมินค่าตัดสินคุณค่าตามเกณฑ์'],
  ['นักเรียนคนหนึ่งทำแบบทดสอบชุดเดิมสองวันติดกัน ได้คะแนนต่างกัน 3 คะแนน ทั้งที่ความรู้ไม่ได้เปลี่ยน ปรากฏการณ์นี้อธิบายด้วยแนวคิดใด', 'ความคลาดเคลื่อนในการวัด', ['ความตรงเชิงเนื้อหาของข้อสอบ', 'การแปลผลแบบอิงกลุ่มของครู', 'การประเมินตามสภาพจริงของงาน', 'ความยากที่เหมาะสมของข้อสอบ'], 'ตามทฤษฎีการทดสอบแบบดั้งเดิม X = T + E คะแนนที่สังเกตได้มีความคลาดเคลื่อน (E) ปนอยู่เสมอ'],
  ['ครูเข้าใจสูตร X = T + E และต้องการให้คะแนนสะท้อนความสามารถจริงมากขึ้น ครูควรดำเนินการใด', 'ลดแหล่งความคลาดเคลื่อนของการวัด', ['เพิ่มคะแนนพิเศษให้นักเรียนทุกคน', 'ลดจำนวนข้อสอบให้สั้นลงกว่าเดิม', 'ตั้งเกณฑ์ผ่านให้สูงขึ้นกว่าเดิม', 'เปลี่ยนเป็นการสอบปากเปล่าทุกครั้ง'], 'เมื่อ E ลดลง คะแนนที่สังเกตได้ (X) จะใกล้คะแนนจริง (T) มากขึ้น'],
  ['ครูรู้ว่า “ความเข้าใจ” มองไม่เห็นโดยตรง จึงให้นักเรียนอธิบายและยกตัวอย่างแทน ข้อนี้สะท้อนลักษณะใดของการวัดทางการศึกษา', 'เป็นการวัดทางอ้อมจากพฤติกรรม', ['เป็นการวัดทางตรงที่แม่นยำเสมอ', 'เป็นการวัดที่ไม่มีความคลาดเคลื่อน', 'เป็นการวัดที่ใช้ได้กับทักษะเท่านั้น', 'เป็นการวัดที่ต้องใช้แบบมาตรฐาน'], 'คุณลักษณะแฝงอย่างความเข้าใจต้องอนุมานจากพฤติกรรมที่สังเกตได้'],
  ['โรงเรียนจัดสอบภาษาอังกฤษเพื่อแบ่งนักเรียนเข้าห้องเรียนตามระดับความสามารถ การสอบนี้มีจุดมุ่งหมายหลักข้อใด', 'จัดตำแหน่ง (Placement)', ['วินิจฉัย (Diagnosis)', 'รับรองผล (Certification)', 'พยากรณ์ (Prediction)', 'ประเมินหลักสูตร (Program)'], 'การใช้ผลเพื่อจัดผู้เรียนเข้ากลุ่ม/ระดับที่เหมาะสม คือการจัดตำแหน่ง'],
  ['มหาวิทยาลัยใช้คะแนนสอบเข้าเพื่อคาดการณ์ว่าผู้สมัครจะเรียนได้ดีเพียงใดในปีแรก ข้อนี้คือจุดมุ่งหมายใด', 'การพยากรณ์ความสำเร็จ', ['การจัดตำแหน่งผู้เรียน', 'การวินิจฉัยจุดบกพร่อง', 'การพัฒนาการเรียนรู้', 'การรับรองผลการเรียน'], 'การใช้คะแนนคาดการณ์ผลในอนาคตคือการพยากรณ์ (Prediction)'],
  ['คณะกรรมการวิชาการนำผลสอบของนักเรียนทั้งระดับชั้นมาพิจารณาว่าควรปรับเนื้อหารายวิชาใด การใช้ผลนี้ตรงกับข้อใด', 'ประเมินหลักสูตรและการสอน', ['วินิจฉัยผู้เรียนเป็นรายคน', 'จัดตำแหน่งผู้เรียนเข้าห้อง', 'รับรองผลเป็นรายบุคคล', 'พยากรณ์ความสำเร็จในอนาคต'], 'ใช้ข้อมูลภาพรวมเพื่อตัดสินใจเกี่ยวกับหลักสูตร/การสอน คือการประเมินโครงการ/หลักสูตร'],
  ['ก่อนเริ่มหน่วยพันธุศาสตร์ ครูให้นักเรียนทำแบบสำรวจสั้น ๆ เพื่อค้นหาความเข้าใจคลาดเคลื่อนเรื่องยีน การประเมินนี้เป็นประเภทใด', 'Diagnostic Assessment', ['Formative Assessment', 'Summative Assessment', 'Assessment of Learning', 'Norm-referenced Test'], 'ประเมินก่อนเรียนเพื่อหาความรู้เดิมและความเข้าใจคลาดเคลื่อน คือการประเมินเพื่อวินิจฉัย'],
  ['ระหว่างสอน ครูให้นักเรียนชูบัตรสีบอกระดับความเข้าใจ แล้วปรับตัวอย่างใหม่ทันทีเมื่อเห็นบัตรแดงจำนวนมาก การประเมินนี้เป็นประเภทใด', 'Formative Assessment', ['Diagnostic Assessment', 'Summative Assessment', 'Placement Assessment', 'Norm-referenced Test'], 'ใช้ข้อมูลระหว่างเรียนเพื่อปรับการสอนทันที คือการประเมินระหว่างเรียน'],
  ['เมื่อจบภาคเรียน ครูจัดสอบปลายภาคแล้วนำคะแนนไปตัดสินระดับผลการเรียน การประเมินนี้เป็นประเภทใด', 'Summative Assessment', ['Formative Assessment', 'Diagnostic Assessment', 'Assessment as Learning', 'Self Assessment Only'], 'การสรุปผลเมื่อจบหน่วย/ภาคเพื่อตัดสินผล คือการประเมินสรุปผล'],
  ['ครูใช้ข้อสอบชุดเต็ม 40 ข้อกลางหน่วย แต่ไม่นำไปคิดคะแนน และใช้ผลจัดกลุ่มสอนเสริมตามจุดอ่อน การประเมินนี้ควรจัดเป็นประเภทใด', 'Formative เพราะใช้ผลปรับการเรียน', ['Summative เพราะเป็นข้อสอบชุดใหญ่', 'Diagnostic เพราะทำก่อนเริ่มหน่วย', 'Summative เพราะมีการรวมคะแนน', 'Norm-referenced เพราะเทียบเพื่อน'], 'ประเภทการประเมินขึ้นกับการใช้ผล ไม่ใช่ขนาดหรือรูปแบบของข้อสอบ'],
  ['นักเรียน ป.2 หลายคนอ่านไม่คล่อง ครูจึงสัมภาษณ์และทดสอบย่อยรายคนเพื่อหาสาเหตุเฉพาะของแต่ละคน การประเมินนี้มุ่งเน้นข้อใด', 'วินิจฉัยสาเหตุของปัญหา', ['จัดอันดับความสามารถ', 'รับรองผลการเรียนรู้', 'พยากรณ์ผลในอนาคต', 'ตัดสินระดับผลการเรียน'], 'การค้นหาสาเหตุของปัญหาการเรียนรายบุคคลคือการประเมินเพื่อวินิจฉัย'],
  ['ผู้บริหารเสนอว่า “ให้สอบถี่ขึ้น การประเมินจะเป็น Formative มากขึ้นเอง” คำตอบใดถูกต้องที่สุด', 'ไม่ใช่ ต้องดูว่าใช้ผลปรับการเรียนหรือไม่', ['ใช่ ยิ่งสอบบ่อยยิ่งเป็น Formative มาก', 'ใช่ ถ้าข้อสอบเป็นปรนัยทั้งหมดทุกข้อ', 'ไม่ใช่ เพราะ Formative ห้ามมีคะแนนเลย', 'ใช่ ถ้าสอบทุกสัปดาห์โดยไม่แจ้งล่วงหน้า'], 'หัวใจของ Formative คือการใช้ข้อมูลเพื่อ Feedback และปรับการเรียนการสอน ไม่ใช่ความถี่ของการสอบ'],
  ['ครูต้องการหลักฐานเพื่อรายงานผลการเรียนรู้ทั้งภาคเรียนต่อผู้ปกครองและโรงเรียน ครูควรใช้การประเมินในลักษณะใด', 'การประเมินสรุปผลเมื่อจบภาค', ['การประเมินวินิจฉัยก่อนเรียน', 'การถามตอบระหว่างสอนรายคาบ', 'การสังเกตโดยไม่มีการบันทึก', 'การประเมินตนเองเพียงอย่างเดียว'], 'การรายงานและรับรองผลต้องใช้หลักฐานเชิงสรุป (Summative) ที่ครอบคลุม'],
  ['ครูอ่าน Exit ticket ท้ายคาบแล้วพบว่านักเรียนครึ่งห้องยังสับสน จึงเปลี่ยนแผนคาบถัดไป การกระทำนี้ตรงกับแนวคิดใด', 'Assessment for Learning', ['Assessment of Learning', 'Assessment as Learning', 'Norm-referenced Assessment', 'Placement Assessment'], 'ครูใช้ข้อมูลเพื่อปรับการสอน คือการประเมินเพื่อการเรียนรู้'],
  ['นักเรียนใช้ Rubric ตรวจร่างรายงานของตนเอง บันทึกจุดที่ต้องแก้ แล้วตั้งเป้าหมายก่อนส่งฉบับจริง กิจกรรมนี้ตรงกับแนวคิดใด', 'Assessment as Learning', ['Assessment of Learning', 'Assessment for Learning', 'Summative Assessment', 'Placement Assessment'], 'ผู้เรียนใช้การประเมินเพื่อกำกับการเรียนของตนเอง (metacognition) คือ as Learning'],
  ['โรงเรียนออกหนังสือรับรองผลการเรียนให้นักเรียนที่จบชั้นมัธยมศึกษาปีที่ 3 การประเมินที่ใช้ตรงกับแนวคิดใด', 'Assessment of Learning', ['Assessment for Learning', 'Assessment as Learning', 'Diagnostic Assessment', 'Formative Assessment'], 'การสรุปและรับรองผลการเรียนรู้คือการประเมินผลการเรียนรู้ (of Learning)'],
  ['ครูต้องการเพิ่มกิจกรรม Assessment as Learning ในชั้นเรียน กิจกรรมใดเหมาะสมที่สุด', 'ให้เขียนบันทึกการเรียนและประเมินตนเอง', ['เพิ่มจำนวนการสอบย่อยทุกสัปดาห์', 'รายงานคะแนนให้ผู้ปกครองทราบบ่อยขึ้นกว่าเดิม', 'ใช้ข้อสอบมาตรฐานระดับชาติแทน', 'ประกาศอันดับคะแนนไว้หน้าห้อง'], 'as Learning เน้นให้ผู้เรียนสะท้อนคิดและกำกับการเรียนรู้ของตนเอง'],
  ['ครูออกแบบกิจกรรมแบบ Assessment as Learning และต้องระบุ “ผู้ใช้ผลการประเมินหลัก” ในแผนการสอน ควรระบุว่าใคร', 'ผู้เรียน', ['ครูผู้สอน', 'ผู้บริหาร', 'ผู้ปกครอง', 'หน่วยงานนอก'], 'ใน as Learning ผู้เรียนเป็นผู้ใช้ผลเพื่อติดตามและปรับการเรียนของตนเอง'],
  ['ครูเขียน Feedback บอก “ขั้นต่อไป” บนการบ้านทุกชิ้น โดยไม่ให้คะแนน เพื่อให้นักเรียนแก้งานก่อนส่งใหม่ การปฏิบัตินี้ตรงกับแนวคิดใดมากที่สุด', 'การประเมินเพื่อการเรียนรู้', ['การประเมินผลการเรียนรู้', 'การประเมินเพื่อจัดตำแหน่ง', 'การประเมินเพื่อรับรองผล', 'การประเมินแบบอิงกลุ่ม'], 'Feedback ที่บอกขั้นต่อไปเพื่อพัฒนาการเรียนคือ Assessment for Learning'],
  ['ครูรายงานว่า “นักเรียนคนนี้มีคะแนนอยู่ที่เปอร์เซ็นไทล์ที่ 85 ของห้อง” เป็นการแปลผลแบบใด', 'แปลผลแบบอิงกลุ่ม', ['แปลผลแบบอิงเกณฑ์', 'แปลผลแบบอิงตนเอง', 'แปลผลแบบอิงมาตรฐาน', 'แปลผลแบบอิงรูบริก'], 'เปอร์เซ็นไทล์บอกตำแหน่งเทียบกับผู้อื่นในกลุ่ม จึงเป็นการแปลผลอิงกลุ่ม'],
  ['ครูรายงานว่า “นักเรียนอ่านออกเสียงได้ระดับ 3 จาก 4 ตามเกณฑ์ที่กำหนด” เป็นการแปลผลแบบใด', 'แปลผลแบบอิงเกณฑ์', ['แปลผลแบบอิงกลุ่ม', 'แปลผลแบบเปอร์เซ็นไทล์', 'แปลผลแบบคะแนนมาตรฐาน', 'แปลผลแบบจัดอันดับ'], 'เทียบกับเกณฑ์ที่กำหนดล่วงหน้า ไม่ได้เทียบกับผู้อื่น จึงเป็นอิงเกณฑ์'],
  ['ครูต้องการทราบว่านักเรียนแต่ละคนบรรลุตัวชี้วัดตามหลักสูตรหรือไม่ โดยไม่ต้องเปรียบเทียบกับเพื่อน ควรแปลผลแบบใด', 'อิงเกณฑ์ตามตัวชี้วัด', ['อิงกลุ่มด้วยเปอร์เซ็นไทล์', 'จัดอันดับทั้งห้องเรียน', 'ใช้คะแนน T เทียบห้อง', 'เทียบกับค่าเฉลี่ยของห้อง'], 'การตัดสินการบรรลุตัวชี้วัดต้องเทียบกับเกณฑ์/มาตรฐาน'],
  ['มูลนิธิมีทุนการศึกษาเพียง 5 ทุนสำหรับผู้สมัคร 120 คน การแปลผลคะแนนสอบแบบใดเหมาะสมที่สุด', 'อิงกลุ่ม เพราะต้องจัดอันดับคัดเลือก', ['อิงเกณฑ์ เพราะมีมาตรฐานชัดเจน', 'อิงตนเอง เพราะดูพัฒนาการรายคน', 'อิงเกณฑ์ เพราะทุกคนผ่านได้หมด', 'ไม่ต้องแปลผล ใช้คะแนนดิบพอ'], 'การคัดเลือกเมื่อจำนวนที่นั่งจำกัดต้องเปรียบเทียบผู้สมัครกัน จึงใช้อิงกลุ่ม'],
  ['ครูสอบย่อยทุกวันศุกร์และบันทึกคะแนน แต่ไม่คืนกระดาษคำตอบและไม่อธิบายข้อผิด ผลการเรียนจึงไม่ดีขึ้น ปัญหาหลักคือข้อใด', 'ไม่มีการใช้ผลเพื่อพัฒนาผู้เรียน', ['สอบน้อยเกินไปในหนึ่งภาคเรียน', 'ข้อสอบยากเกินไปสำหรับนักเรียน', 'ใช้การแปลผลแบบอิงกลุ่มทุกครั้ง', 'ไม่มีการสอบปลายภาคเรียนเลย'], 'การวัดซ้ำโดยไม่ให้ Feedback หรือปรับการสอน ไม่ทำให้เกิดการเรียนรู้'],

  ['ครูให้นักศึกษา “ตัดสินว่า Rubric ชุดหนึ่งมีคุณภาพเพียงพอหรือไม่ตามเกณฑ์ที่กำหนด พร้อมเหตุผล” งานนี้อยู่ในระดับใด', 'Evaluate', ['Analyze', 'Apply', 'Create', 'Understand'], 'การตรวจสอบและตัดสินตามเกณฑ์คือระดับประเมิน'],
