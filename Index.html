  /* ── บัญชีในเบราว์เซอร์ (โหมด local) : API เดียวกับ Apps Script เพื่อให้หน้าจอเดียวกันใช้ได้ทั้งสองโหมด ── */
  const LDB = 'lma.local.db';
  const ldb = () => { let d = null; try { d = JSON.parse(ls.get(LDB) || 'null'); } catch (e) {} return d || { users: {}, sessions: {}, log: [] }; };
  const lsave = d => ls.set(LDB, JSON.stringify(d));
  const lpub = o => ({ studentId: o.studentId, name: o.name, nickname: o.nickname || '', email: o.email || '', phone: o.phone || '', major: o.major || '', section: o.section || '', year: o.year || '', avatar: o.avatar || '', role: 'student', hasPin: !!o.pinHash, mustChangePass: false, lastLogin: o.lastLogin || '', lastMethod: o.lastMethod || '', createdAt: o.createdAt || '', consentAt: o.consentAt || '' });
  function localApi(r) {
    const d = ldb(), now = new Date().toISOString(), fail = (error, message) => ({ ok: false, error, message });
    const log = (id, action, detail = '') => { d.log.push({ time: now, studentId: id, action, detail }); if (d.log.length > 500) d.log.shift(); };
    const sess = () => { const s = d.sessions[r.token]; return s && s.exp > Date.now() ? d.users[s.id] : null; };
    const newSess = id => { const t = uid(); d.sessions[t] = { id, exp: Date.now() + 12 * 3600e3 }; return { token: t, expiresAt: d.sessions[t].exp }; };
    const find = un => { un = normDigits(un); return un.includes('@') ? Object.values(d.users).find(u => u.email && u.email === un.toLowerCase()) : d.users[un.toUpperCase()]; };
    const res = (() => {
      switch (r.action) {
        case 'ping': return { ok: true, classCode: false, local: true };
        case 'register': {
          const id = normDigits(r.studentId).toUpperCase(), email = String(r.email || '').trim().toLowerCase();
          if (!/^[0-9A-Z-]{4,20}$/.test(id)) return fail('bad_id', 'ชื่อผู้ใช้ (รหัสนักศึกษา) ต้องเป็นตัวเลข/ตัวอักษรอังกฤษ 4–20 ตัว');
          if (String(r.name || '').trim().length < 3) return fail('bad_name', 'กรุณากรอกชื่อ-นามสกุล');
          const pe = passwordProblem(r.password, id); if (pe) return fail('weak_password', pe);
          if (!r.consent) return fail('no_consent', 'กรุณายินยอมให้เก็บข้อมูลก่อนสมัคร');
          if (d.users[id]) return fail('exists', 'ชื่อผู้ใช้นี้สมัครไว้แล้วในเบราว์เซอร์นี้ — เข้าสู่ระบบแทน');
          if (email && find(email)) return fail('email_exists', 'อีเมลนี้ถูกใช้กับบัญชีอื่นแล้ว');
          const salt = uid();
          d.users[id] = { studentId: id, name: String(r.name).trim(), email, major: String(r.major || '').trim(), section: String(r.section || '').trim(), passHash: hashL(r.password, salt), passSalt: salt, pinHash: '', salt: '', pinFails: 0, pinLockedUntil: 0, failedCount: 0, lockedUntil: 0, createdAt: now, lastLogin: now, lastMethod: 'register', consentAt: now };
          /* ย้ายความก้าวหน้าที่เคยเรียนแบบไม่ล็อกอินในเบราว์เซอร์นี้มาให้บัญชีแรก */
          const old = ls.get('lma.v1'); if (old && !ls.get('lma.v1:' + id) && Object.keys(d.users).length === 1) ls.set('lma.v1:' + id, old);
          log(id, 'register'); const s = newSess(id); lsave(d);
          return Object.assign({ ok: true, user: lpub(d.users[id]) }, s);
        }
        case 'login': {
          const u = find(r.username || ''), byPin = r.pin != null && r.pin !== '';
          if (!u) return fail('bad_login', byPin ? 'ชื่อผู้ใช้หรือรหัส PIN ไม่ถูกต้อง' : 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
          if (byPin && !u.pinHash) return fail('no_pin', 'บัญชีนี้ยังไม่ได้ตั้งรหัส PIN — เข้าสู่ระบบด้วยรหัสผ่าน แล้วตั้ง PIN ที่ โปรไฟล์ของฉัน › ความปลอดภัย');
          const F = byPin ? ['pinHash', 'salt', 'pinFails', 'pinLockedUntil', normDigits(r.pin)] : ['passHash', 'passSalt', 'failedCount', 'lockedUntil', String(r.password || '')];
          if (u[F[3]] > Date.now()) return fail('locked', `ใส่${byPin ? ' PIN' : 'รหัสผ่าน'}ผิดหลายครั้ง ลองใหม่ในอีก ${Math.ceil((u[F[3]] - Date.now()) / 60000)} นาที${byPin ? ' — เข้าสู่ระบบด้วยรหัสผ่านแทนได้' : ''}`);
          if (hashL(F[4], u[F[1]]) !== u[F[0]]) {
            u[F[2]] = (u[F[2]] || 0) + 1; log(u.studentId, byPin ? 'pin_fail' : 'login_fail', String(u[F[2]]));
            const left = 5 - u[F[2]]; if (left <= 0) { u[F[2]] = 0; u[F[3]] = Date.now() + 15 * 60e3; }
            lsave(d); return fail('bad_login', left <= 0 ? `ใส่ผิด 5 ครั้ง ล็อก 15 นาที${byPin ? ' — ใช้รหัสผ่านแทนได้' : ''}` : `${byPin ? 'รหัส PIN ไม่ถูกต้อง' : 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'} (เหลือ ${left} ครั้ง)`);
          }
          u[F[2]] = 0; u[F[3]] = 0; u.lastLogin = now; u.lastMethod = byPin ? 'pin' : 'password'; log(u.studentId, 'login', u.lastMethod);

        }
        case 'logout': delete d.sessions[r.token]; lsave(d); return { ok: true };
        case 'me': { const u = sess(); return u ? { ok: true, user: lpub(u) } : fail('no_session', 'กรุณาเข้าสู่ระบบใหม่'); }
        case 'loadProgress': return sess() ? { ok: true, state: null } : fail('no_session', 'กรุณาเข้าสู่ระบบใหม่');
        case 'saveProgress': return { ok: true };
        case 'setPin': case 'removePin': case 'changePassword': case 'updateProfile': case 'myActivity': {
          const u = sess(); if (!u) return fail('no_session', 'กรุณาเข้าสู่ระบบใหม่');
          if (r.action === 'myActivity') return { ok: true, items: d.log.filter(l => l.studentId === u.studentId).slice(-40).reverse() };
          if (r.action === 'updateProfile') {
            ['nickname', 'phone', 'major', 'section', 'year', 'avatar', 'name'].forEach(k => { if (k in r) u[k] = String(r[k] || '').trim(); });
            if ('email' in r) { const e = String(r.email || '').trim().toLowerCase(); const other = e && find(e); if (other && other.studentId !== u.studentId) return fail('email_exists', 'อีเมลนี้ถูกใช้กับบัญชีอื่นแล้ว'); u.email = e; }
            log(u.studentId, 'update_profile'); lsave(d); return { ok: true, user: lpub(u) };
          }
          const pw = r.action === 'changePassword' ? r.oldPassword : r.password;
          if (hashL(String(pw || ''), u.passSalt) !== u.passHash) return fail('bad_password', 'รหัสผ่านปัจจุบันไม่ถูกต้อง');
          if (r.action === 'setPin') { const pin = normDigits(r.pin), pe = pinProblem(pin); if (pe) return fail('weak_pin', pe); u.salt = uid(); u.pinHash = hashL(pin, u.salt); u.pinFails = 0; u.pinLockedUntil = 0; log(u.studentId, 'set_pin'); }
          else if (r.action === 'removePin') { u.pinHash = ''; u.salt = ''; log(u.studentId, 'remove_pin'); }
          else { const pe = passwordProblem(r.newPassword, u.studentId); if (pe) return fail('weak_password', pe); if (r.newPassword === r.oldPassword) return fail('same', 'รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม'); u.passSalt = uid(); u.passHash = hashL(r.newPassword, u.passSalt); log(u.studentId, 'change_password'); }

    })();

  /* ── transport ─────────────────────────────── */
  function call(action, payload = {}, opt = {}) {
    const req = Object.assign({ action }, payload);
    if (hasGAS()) return new Promise(res => google.script.run.withSuccessHandler(res).withFailureHandler(e => res({ ok: false, error: 'network', message: 'เชื่อมต่อฐานข้อมูลไม่ได้: ' + (e && e.message || e) })).api(req));
    if (!CFG.apiUrl) return localApi(req);
    return fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), keepalive: !!opt.keepalive, redirect: 'follow' })
      .then(r => r.json()).catch(() => ({ ok: false, error: 'network', message: 'เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่' }));
  }

  /* ── session ───────────────────────────────── */
  const loadSession = () => { try { return JSON.parse(ls.get(SKEY) || 'null'); } catch (e) { return null; } };
  const saveSession = () => ls.set(SKEY, JSON.stringify({ token, user, expiresAt: sessionExp }));
  function clearSession() { token = null; user = null; ls.del(SKEY); }

  /* ── rules (ตรงกับฝั่งเซิร์ฟเวอร์) ─────────── */
  function pinProblem(pin) {
    pin = String(pin || '');
    if (!/^\d{6}$/.test(pin)) return 'รหัส PIN ต้องเป็นตัวเลข 6 หลัก';
    if (/^(\d)\1{5}$/.test(pin)) return 'รหัส PIN ต้องไม่ใช่ตัวเลขเดียวกันทั้งหมด';
    const d = pin.split('').map(Number); let up = true, down = true;
    for (let i = 1; i < 6; i++) { if (d[i] !== (d[i - 1] + 1) % 10) up = false; if (d[i] !== (d[i - 1] + 9) % 10) down = false; }
    if (up || down) return 'รหัส PIN ต้องไม่เป็นตัวเลขเรียงกัน เช่น 123456';
    return '';
  }
  function passwordProblem(p, id) {
    p = String(p || '');
    if (p.length < 8) return 'รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร';
    if (!/[A-Za-zก-๙]/.test(p) || !/\d/.test(p)) return 'รหัสผ่านต้องมีทั้งตัวอักษรและตัวเลข';
    if (id && p.toUpperCase().includes(String(id).toUpperCase())) return 'รหัสผ่านต้องไม่มีรหัสนักศึกษาอยู่ในนั้น';
    return '';
  }

  /* ── PIN keypad component ──────────────────── */
  function keypadHTML(id, label, note) {
    const k = n => `<button type="button" class="k" data-k="${n}" aria-label="${n}">${n}</button>`;
    return `<div class="pinpad" id="${id}"><p class="pin-label" data-plabel>${label}</p>
      <div class="dots" role="img" aria-label="กรอกแล้ว 0 จาก 6 หลัก">${'<i></i>'.repeat(6)}</div>
      <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k).join('')}<button type="button" class="k clr" data-k="clear" aria-label="ล้างทั้งหมด" title="ล้างทั้งหมด">↺</button>${k(0)}<button type="button" class="k del" data-k="back" aria-label="ลบตัวสุดท้าย" title="ลบ">⌫</button></div>
      ${note ? `<p class="pin-note">${note}</p>` : ''}</div>`;
  }
  /** ผูกแป้น: รองรับแตะ/คลิก (มือถือ แท็บเล็ต คอมพิวเตอร์) และแป้นพิมพ์ 0–9 ทั้งแถวบนและ Numpad
      — อ่านจากตำแหน่งปุ่ม (e.code) จึงใช้ได้แม้ตั้งแป้นพิมพ์เป็นภาษาไทย ; รับเลขไทย ๐–๙ ; Backspace = ลบ, Esc/Delete = ล้าง */
  function bindKeypad(root, onComplete) {
    let v = '', locked = false;
    const dots = root.querySelector('.dots');
    const draw = () => { [...dots.children].forEach((d, i) => d.classList.toggle('on', i < v.length)); dots.setAttribute('aria-label', `กรอกแล้ว ${v.length} จาก 6 หลัก`); };
    const press = k => {
      if (locked) return;
      if (k === 'clear') v = ''; else if (k === 'back') v = v.slice(0, -1); else if (v.length < 6) v += k;
      draw();
      if (v.length === 6) { const pin = v; locked = true; setTimeout(() => onComplete(pin, api), 120); } /* ล็อกทันทีกันการกดซ้ำระหว่างตรวจสอบ */
    };
    /* ปิดแป้นพิมพ์บนจอมือถือเมื่อเริ่มแตะแป้น PIN (iOS ไม่ย้าย focus ออกจากช่องกรอกเมื่อแตะปุ่ม) */
    root.addEventListener('pointerdown', () => { const t = document.activeElement; if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName)) t.blur(); });
    root.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
    const digitOf = e => {
      const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code || ''); if (m) return m[1];
      if (/^\d$/.test(e.key)) return e.key;
      if (/^[๐-๙]$/.test(e.key)) return String(e.key.charCodeAt(0) - 0x0E50);
      return null;
    };
    const onKey = e => {
      if (!root.isConnected) return document.removeEventListener('keydown', onKey);
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const t = document.activeElement; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
      const d = digitOf(e);
      if (d != null) { press(d); e.preventDefault(); }
      else if (e.key === 'Backspace') { press('back'); e.preventDefault(); }
      else if (e.key === 'Escape' || e.key === 'Delete') press('clear');
    };
    document.addEventListener('keydown', onKey);
    const api = {
      clear() { v = ''; locked = false; draw(); },
      shake() { root.classList.remove('shake'); void root.offsetWidth; root.classList.add('shake'); v = ''; locked = false; draw(); },
      busy(on) { locked = on; root.classList.toggle('busy', on); },
      label(t) { root.querySelector('[data-plabel]').textContent = t; }
    };
    draw();
    return api;
  }

  /* ── auth screens ──────────────────────────── */

    el.querySelectorAll('[data-eye]').forEach(b => b.onclick = () => { const i = document.getElementById(b.dataset.eye); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'ซ่อน' : 'แสดง'; });

  const pwInput = (id, label, ac, extra = '') => `<label class="f" for="${id}">${label}<span class="pin-wrap"><input id="${id}" type="password" autocomplete="${ac}" ${extra}><button type="button" class="btn ghost sm" data-eye="${id}" aria-label="แสดงรหัส">แสดง</button></span></label>`;

  const localNote = () => mode() === 'local' ? `<div class="fb warn small"><b>โหมดออฟไลน์</b> — บัญชีและความก้าวหน้าเก็บในเบราว์เซอร์นี้เท่านั้น (ใช้ข้ามอุปกรณ์ได้เมื่อผู้สอนเชื่อมฐานข้อมูล Google Sheets)</div>` : '';

  /** หน้าต้อนรับ: ต้องกดเข้าสู่ระบบก่อนจึงเข้าชั้นเรียนได้ */
  function showWelcome(note = '') {
    const C = window.COURSE || {};
    const el = shell(`<div class="stack welcome" style="gap:10px">
        <span class="eyebrow">${esc(C.level || 'ปริญญาตรี')}</span>
        <h1 style="font-size:clamp(1.6rem,5vw,2.1rem)">${esc(C.th || 'การวัดและประเมินผลการเรียนรู้')}</h1>
        <span class="mono small muted">${esc(C.en || '')}</span>
        <p class="small">ผู้สอน <b>${esc(C.instructor || '')}</b></p>
        <ul class="welcome-list"><li>9 Modules · 12 ขั้นตอนต่อบทเรียน</li><li>แบบทดสอบเชิงสถานการณ์ 270 ข้อ พร้อม Feedback ทันที</li><li>Data Lab · Digital Rubric · Innovation Project</li><li>ติดตามความก้าวหน้าของตนเองได้ตลอด</li></ul></div>
      ${note ? `<div class="fb info">${note}</div>` : ''}${localNote()}
      <div class="stack" style="gap:8px"><button type="button" class="btn primary welcome-cta" data-go-login>เข้าสู่ระบบเพื่อเข้าชั้นเรียน</button>
        <button type="button" class="btn welcome-cta" data-go-reg>สมัครสมาชิก (ใช้งานครั้งแรก)</button></div>
      <p class="small muted" style="text-align:center">กรุณาเข้าสู่ระบบก่อนเข้าชั้นเรียน เพื่อบันทึกความก้าวหน้า คะแนน และผลงานของคุณ</p>
      <div class="admin-entry"><span class="small muted">สำหรับผู้สอน / ผู้ดูแลระบบ</span><button type="button" class="btn sm" data-go-admin>🔐 เข้าสู่ระบบผู้ดูแลระบบ</button></div>`);
    adminEntry = false;
    el.querySelector('[data-go-login]').onclick = () => showLogin('pin');
    el.querySelector('[data-go-reg]').onclick = () => showRegister();
    el.querySelector('[data-go-admin]').onclick = () => { adminEntry = true; showLogin('password'); };
    el.querySelector('[data-go-login]').focus();
  }

  /** หน้าเข้าสู่ระบบ — mode: 'pin' | 'password' */
  function showLogin(mode = 'pin', note = '', typed) {
    const RK = adminEntry ? AKEY : UKEY;   /* จำชื่อผู้ใช้ผู้ดูแลแยกจากผู้เรียน (ใช้เครื่องร่วมกันได้) */
    const remembered = ls.get(RK) || '', prefill = typed != null ? typed : remembered;
    const userField = `<label class="f" for="lUser">ชื่อผู้ใช้หรืออีเมล<input id="lUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="${adminEntry ? 'ชื่อผู้ใช้ผู้ดูแล เช่น ADMIN หรืออีเมล' : 'รหัสนักศึกษา หรืออีเมล'}" enterkeyhint="next" value="${esc(prefill)}"></label>`;
    const links = `<div class="auth-links"><button type="button" class="linkbtn" data-mode="${mode === 'pin' ? 'password' : 'pin'}">${mode === 'pin' ? 'เข้าสู่ระบบด้วยรหัสผ่าน' : 'เข้าสู่ระบบด้วยรหัส PIN'}</button>${remembered ? '<button type="button" class="linkbtn" data-forget>ลืมชื่อผู้ใช้ที่จำไว้</button>' : ''}</div>`;
    const foot = adminEntry
      ? `<p class="small muted" style="text-align:center"><button type="button" class="linkbtn" data-home>← หน้าแรก</button> · ลืมรหัสผู้ดูแล? เปิด Apps Script แล้ว Run <span class="mono">resetAdminPassword</span></p><span data-reg hidden></span>`
      : `<p class="small muted" style="text-align:center"><button type="button" class="linkbtn" data-home>← หน้าแรก</button> · ยังไม่มีบัญชี? <button type="button" class="linkbtn" data-reg>สมัครสมาชิก</button> · ลืมรหัส? แจ้งผู้สอนเพื่อรีเซ็ต</p>`;
    const head = adminEntry
      ? `<div class="stack" style="gap:4px"><span class="pill bad" style="align-self:flex-start">🔐 ผู้ดูแลระบบ · Admin</span><h1 style="font-size:1.6rem">เข้าสู่ระบบผู้ดูแลระบบ</h1><p class="small muted">สำหรับบัญชีที่มีสิทธิ์ผู้สอนหรือผู้ดูแลระบบ · เข้าได้ทั้ง${mode === 'pin' ? 'รหัส PIN' : 'รหัสผ่าน'}และ${mode === 'pin' ? 'รหัสผ่าน' : 'รหัส PIN'} · เข้าแล้วไปที่คอนโซลผู้ดูแลระบบทันที</p></div>`
      : mode === 'pin'
      ? `<div class="stack" style="gap:4px"><h1 style="font-size:1.6rem">เข้าสู่ระบบด้วยรหัส PIN</h1><p class="small muted">ใช้ได้ทุกอุปกรณ์ · ตั้งรหัส PIN ไว้ที่ <b class="crumb">โปรไฟล์ของฉัน › ความปลอดภัย</b></p></div>`
      : `<div class="stack" style="gap:4px"><h1 style="font-size:1.6rem">เข้าสู่ระบบด้วยรหัสผ่าน</h1><p class="small muted">หลังเข้าสู่ระบบ ตั้งรหัส PIN ได้ที่ <b class="crumb">โปรไฟล์ของฉัน › ความปลอดภัย</b> เพื่อเข้าครั้งต่อไปได้เร็วขึ้น</p></div>`;
    const body = mode === 'pin'
      ? `${userField}${keypadHTML('loginPad', 'กรอกรหัส PIN 6 หลัก', 'กรอกครบ 6 หลักแล้วระบบจะเข้าสู่ระบบให้อัตโนมัติ')}<div data-msg hidden role="alert"></div>`
      : `<form id="fPass" class="stack" novalidate>${userField}${pwInput('lPass', 'รหัสผ่าน', 'current-password')}<div data-msg hidden role="alert"></div><button type="submit" class="btn primary">เข้าสู่ระบบ</button></form>`;
    const store = storageOK ? '' : `<div class="fb warn small">เบราว์เซอร์นี้ไม่จดจำชื่อผู้ใช้ (โหมดส่วนตัว/หน้าเว็บฝัง) — เข้าสู่ระบบและบันทึกความก้าวหน้าได้ตามปกติ</div>`;
    const el = shell(`${head}${note ? `<div class="fb info">${note}</div>` : ''}${store}${localNote()}${body}${links}${foot}`);
    const uf = el.querySelector('#lUser');
    el.querySelector('[data-mode]').onclick = e => showLogin(e.currentTarget.dataset.mode, '', uf.value.trim());
    el.querySelector('[data-reg]').onclick = () => showRegister();
    el.querySelector('[data-home]').onclick = () => showWelcome();
    const fg = el.querySelector('[data-forget]'); if (fg) fg.onclick = () => { ls.del(RK); showLogin(mode, 'ลบชื่อผู้ใช้ที่จำไว้ในเครื่องนี้แล้ว'); };
    const done = (r, name) => {
      if (!r.ok) {
        if (r.error === 'no_pin') say(el, esc(r.message) + ' <button type="button" class="linkbtn" data-topass>ไปที่เข้าสู่ระบบด้วยรหัสผ่าน</button>');
        else say(el, esc(r.message));
        const tp = el.querySelector('[data-topass]'); if (tp) tp.onclick = () => showLogin('password', '', uf.value.trim());
        return false;
      }
      const staff = r.user && (r.user.role === 'admin' || r.user.role === 'teacher');
      ls.set(adminEntry && !staff ? UKEY : RK, name); accept(r); return true;
    };
    if (mode === 'pin') {
      const pad = bindKeypad(el.querySelector('#loginPad'), async pin => {
        const name = normDigits(uf.value); uf.value = name;
        if (!name) { pad.shake(); say(el, 'กรอกชื่อผู้ใช้หรืออีเมลก่อน แล้วจึงกดรหัส PIN'); uf.focus(); return; }
        pad.busy(true); say(el, 'กำลังตรวจสอบ…', 'info');
        const r = await call('login', { username: name, pin, device: deviceName() });
        pad.busy(false);
        if (!done(r, name)) pad.shake();
      });
      uf.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); uf.blur(); } });
      if (!prefill) uf.focus();
    } else {
      const f = el.querySelector('#fPass'), btn = f.querySelector('button[type=submit]');
      f.onsubmit = async e => {
        e.preventDefault(); const name = normDigits(uf.value), pw = f.lPass.value;
        if (!name || !pw) return say(el, 'กรอกชื่อผู้ใช้หรืออีเมล และรหัสผ่าน');
        busy(btn, true); say(el, '');
        const r = await call('login', { username: name, password: pw, device: deviceName() });
        busy(btn, false, 'เข้าสู่ระบบ');
        done(r, name);
      };
      (prefill ? f.lPass : uf).focus();
    }
  }

  function showRegister() {
    const el = shell(`<div class="stack" style="gap:4px"><h1 style="font-size:1.6rem">สมัครสมาชิก</h1><p class="small muted">สมัครด้วยรหัสผ่าน แล้วตั้งรหัส PIN ภายหลังที่ <b class="crumb">โปรไฟล์ของฉัน › ความปลอดภัย</b></p></div>
      <form id="fReg" class="stack" novalidate>
        <div class="grid g2"><label class="f" for="rId">ชื่อผู้ใช้ (รหัสนักศึกษา) *<input id="rId" type="text" autocomplete="username" autocapitalize="characters" required></label>
        <label class="f" for="rName">ชื่อ-นามสกุล *<input id="rName" type="text" autocomplete="name" required></label>
        <label class="f" for="rMajor">สาขาวิชา<input id="rMajor" type="text" placeholder="เช่น คณิตศาสตร์"></label>
        <label class="f" for="rSec">กลุ่มเรียน / Section<input id="rSec" type="text" placeholder="เช่น 01"></label></div>
        <label class="f" for="rMail">อีเมล (ใช้เข้าสู่ระบบแทนรหัสนักศึกษาได้)<input id="rMail" type="email" autocomplete="email"></label>
        ${classCode ? '<label class="f" for="rCode">รหัสชั้นเรียน * (ได้จากผู้สอน)<input id="rCode" type="text" autocomplete="off" required></label>' : ''}
        <div class="grid g2">${pwInput('rPw', 'รหัสผ่าน *', 'new-password')}${pwInput('rPw2', 'ยืนยันรหัสผ่าน *', 'new-password')}</div>
        <p class="small muted" data-pwhint>อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข และไม่มีรหัสนักศึกษาอยู่ในรหัสผ่าน</p>
        <label class="row small" style="gap:8px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="rConsent" style="margin-top:5px"><span>ข้าพเจ้ายินยอมให้เก็บชื่อผู้ใช้ ชื่อ อีเมล ข้อมูลการเรียน และผลการประเมินในบทเรียนนี้ เพื่อใช้ติดตามและช่วยเหลือการเรียนในรายวิชาเท่านั้น (พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562) — เข้าถึงได้เฉพาะผู้สอนรายวิชา</span></label>
        <div data-msg hidden role="alert"></div><button type="submit" class="btn primary">สมัครสมาชิก</button></form>
      <div class="auth-links"><button type="button" class="linkbtn" data-home>← หน้าแรก</button><button type="button" class="linkbtn" data-back>มีบัญชีแล้ว? เข้าสู่ระบบ</button></div>`);
    const f = el.querySelector('#fReg'), btn = f.querySelector('button[type=submit]'), hint = el.querySelector('[data-pwhint]');
    el.querySelector('[data-back]').onclick = () => showLogin(); el.querySelector('[data-home]').onclick = () => showWelcome();
    f.rPw.addEventListener('input', () => { const p = passwordProblem(f.rPw.value, f.rId.value.trim()); hint.style.color = f.rPw.value ? (p ? 'var(--bad)' : 'var(--good)') : ''; hint.textContent = f.rPw.value ? (p || 'รหัสผ่านนี้ใช้ได้') : 'อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข และไม่มีรหัสนักศึกษาอยู่ในรหัสผ่าน'; });
    f.onsubmit = async e => {
      e.preventDefault();
      const d = { studentId: normDigits(f.rId.value), name: f.rName.value.trim(), major: f.rMajor.value.trim(), section: f.rSec.value.trim(), email: f.rMail.value.trim(), password: f.rPw.value, consent: f.rConsent.checked, classCode: f.rCode ? f.rCode.value.trim() : '' };
      if (!/^[0-9A-Za-z-]{4,20}$/.test(d.studentId)) return say(el, 'ชื่อผู้ใช้ (รหัสนักศึกษา) ต้องเป็นตัวเลข/ตัวอักษรอังกฤษ 4–20 ตัว');
      if (d.name.length < 3) return say(el, 'กรุณากรอกชื่อ-นามสกุล');
      const p = passwordProblem(d.password, d.studentId); if (p) return say(el, p);
      if (d.password !== f.rPw2.value) return say(el, 'รหัสผ่านทั้งสองช่องไม่ตรงกัน');
      if (!d.consent) return say(el, 'กรุณาอ่านและยินยอมการเก็บข้อมูลก่อนสมัคร');
      busy(btn, true); say(el, '');
      d.device = deviceName(); const r = await call('register', d);
      busy(btn, false, 'สมัครสมาชิก');
      if (!r.ok) return say(el, esc(r.message));
      ls.set(UKEY, d.studentId.toUpperCase());
      accept(r, 'สมัครสมาชิกสำเร็จ — ตั้งรหัส PIN เพื่อเข้าสู่ระบบเร็วขึ้นได้ที่นี่', '#account-security');
    };
    f.rId.focus();
  }

  /* บังคับตั้งรหัสผ่านใหม่ (หลังผู้สอนรีเซ็ต) */
  function showSetPassword() {
    const el = shell(`<div class="stack" style="gap:4px"><h1 style="font-size:1.6rem">ตั้งรหัสผ่านใหม่</h1><p class="small muted">สวัสดี ${esc(user.name)} — ${user.role === 'admin' || user.role === 'teacher' ? 'บัญชีผู้ดูแลระบบนี้ใช้รหัสผ่านชั่วคราวจาก Apps Script กรุณาตั้งรหัสผ่านของคุณเองก่อนเข้าคอนโซลผู้ดูแลระบบ' : 'บัญชีนี้ใช้รหัสผ่านชั่วคราวจากผู้สอน กรุณาตั้งรหัสผ่านของคุณเองก่อนเข้าเรียน'}</p></div>
      <form id="fSet" class="stack" novalidate>${pwInput('sOld', 'รหัสผ่านชั่วคราว', 'current-password')}<div class="grid g2">${pwInput('sNew', 'รหัสผ่านใหม่', 'new-password')}${pwInput('sNew2', 'ยืนยันรหัสผ่านใหม่', 'new-password')}</div>
      <div data-msg hidden role="alert"></div><button type="submit" class="btn primary">บันทึกรหัสผ่านใหม่</button></form>
      <div class="auth-links"><button type="button" class="linkbtn" data-out>ออกจากระบบ</button></div>`);
    const f = el.querySelector('form'), btn = f.querySelector('button[type=submit]');
    el.querySelector('[data-out]').onclick = logout;
    f.onsubmit = async e => {
      e.preventDefault();
      const p = passwordProblem(f.sNew.value, user.studentId); if (p) return say(el, p);
      if (f.sNew.value !== f.sNew2.value) return say(el, 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน');
      busy(btn, true);
      const r = await call('changePassword', { token, oldPassword: f.sOld.value, newPassword: f.sNew.value });
      busy(btn, false, 'บันทึกรหัสผ่านใหม่');
      if (!r.ok) { if (r.error === 'no_session') { clearSession(); return showLogin('password', 'หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่'); } return say(el, esc(r.message)); }
      user = r.user; saveSession(); adminEntry = false; enter('ตั้งรหัสผ่านใหม่เรียบร้อย — ตั้งรหัส PIN ได้ที่ โปรไฟล์ของฉัน › ความปลอดภัย', '#account-security');
    };
  }

  function accept(r, hello, goto) {
    token = r.token; user = r.user; sessionExp = r.expiresAt; saveSession();
    if (user.mustChangePass) return showSetPassword();
    if (adminEntry) {   /* เข้าทางผู้ดูแลระบบ: บัญชีผู้สอน/ผู้ดูแล → คอนโซลทันที ; บัญชีผู้เรียน → ชั้นเรียนตามปกติ */
      adminEntry = false;
      if (user.role === 'admin' || user.role === 'teacher') return enter(`เข้าสู่ระบบผู้ดูแลระบบ — ยินดีต้อนรับ ${user.name}`, '#admin');
      return enter('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลระบบ — เข้าสู่ชั้นเรียนตามปกติ', goto);
    }
    enter(hello || `ยินดีต้อนรับ ${user.name}`, goto);
  }

  /* โหลดความก้าวหน้าจากชีต (ถ้าใหม่กว่า) แล้วเริ่มแอป */
  async function enter(hello, goto) {
    storageKey = 'lma.v1:' + user.studentId;
    shell(`<div class="stack" style="align-items:center;padding:20px 0"><span class="bub now" style="--s:34px"></span><p>กำลังโหลดความก้าวหน้าของ ${esc(user.name)}…</p></div>`);
    const r = await call('loadProgress', { token });
    if (!r.ok && r.error === 'no_session') { clearSession(); return showLogin('pin', 'หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่'); }
    /* ข้อมูลจากอุปกรณ์อื่น: ส่งเข้าแอปโดยตรง (แอปเลือกชุดที่ใหม่กว่าระหว่างในเครื่องกับเซิร์ฟเวอร์) */
    let initialState = null;
    if (r.ok && r.state) { try { initialState = JSON.parse(r.state); } catch (e) {} }
    sync.at = r.ok ? Date.now() : 0; sync.state = r.ok ? 'ok' : 'error'; sync.msg = r.ok ? '' : r.message; sync.dirty = false;
    if (goto) location.hash = goto;
    start(initialState);
    if (hello && window.U) U.toast(hello);
  }

  function start(initialState) {
    if (window.PROFILE && PROFILE.reset) PROFILE.reset();
    document.body.classList.remove('auth-mode');
    const a = $('#auth'); if (a) a.remove();
    window.LMA_start({ storageKey, initialState, onSave: () => { sync.dirty = true; } });
    if (mode() === 'server' && !started) {   /* ตั้งตัวซิงก์ครั้งเดียว แม้เข้าสู่ระบบใหม่หลายครั้ง */
      started = true;
      const every = () => (storageOK ? (CFG.syncEverySeconds || 60) : 20) * 1000; /* ไม่มีที่เก็บในเครื่อง → ซิงก์ถี่ขึ้น */
      setInterval(() => { if (token && sync.dirty && Date.now() - sync.at > every()) push(); }, 5000);
      document.addEventListener('visibilitychange', () => { if (token && document.visibilityState === 'hidden' && sync.dirty) push(true); });
    }
  }

  async function push(keepalive) {
    if (!token || sync.state === 'saving') return;
    if (mode() === 'local') { sync.dirty = false; return { ok: true }; }   /* โหมด local เก็บในเครื่องอยู่แล้ว */
    sync.state = 'saving'; sync.dirty = false;
    /* ส่งสถานะจากหน่วยความจำของแอปโดยตรง — ไม่พึ่ง localStorage (กันการส่งข้อมูลว่างทับข้อมูลจริงบนเบราว์เซอร์ที่ปิดที่เก็บ) */
    const S = window.U && window.U.st ? window.U.st() : null;
    if (!S) { sync.state = 'idle'; return; }
    const state = JSON.stringify(S);
    const savedAt = S.savedAt || Date.now();
    const r = await call('saveProgress', { token, summary: window.U ? U.summary() : {}, state, savedAt }, { keepalive });
    sync.at = Date.now();
    if (r.ok) { sync.state = 'ok'; sync.msg = ''; }
    else { sync.state = 'error'; sync.msg = r.message; sync.dirty = true; if (r.error === 'no_session') { clearSession(); showLogin('pin', 'หมดเวลาเข้าสู่ระบบ ความก้าวหน้าในเครื่องนี้ยังอยู่ — เข้าสู่ระบบอีกครั้งเพื่อซิงก์'); } }
    const dot = document.querySelector('[data-syncdot]'); if (dot) dot.className = 'sync-dot ' + sync.state;
    return r;
  }

  /* ออกจากระบบโดยไม่โหลดหน้าใหม่ (การ reload ในหน้าฝังของ Apps Script อาจได้หน้าว่างบางอุปกรณ์) */
  async function logout() {
    if (sync.dirty) await push();
    if (token) await call('logout', { token });
    clearSession(); sync.state = 'idle'; sync.dirty = false; sync.msg = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
    showWelcome('ออกจากระบบแล้ว — กดเข้าสู่ระบบเพื่อกลับเข้าชั้นเรียน');
  }

  /* ── API สำหรับ profile.js / app.js ──────── */
  window.AUTH = {
    call: (action, payload, opt) => call(action, Object.assign({ token }, payload || {}), opt),
    user: () => user, setUser: u => { user = u; saveSession(); }, online, mode, logout,
    sync: () => push(), syncInfo: () => Object.assign({}, sync, { every: CFG.syncEverySeconds || 60 }),
    ui: { keypadHTML, bindKeypad, pwInput, pinProblem, passwordProblem, busy }
  };

  /* ── boot ──────────────────────────────────── */
  (async function boot() {
    const s = loadSession();
    if (s && s.token && s.expiresAt > Date.now() && s.user) {
      token = s.token; user = s.user; sessionExp = s.expiresAt;
      if (user.mustChangePass) return showSetPassword();
      return enter();
    }
    clearSession();
    shell('<p class="muted" style="text-align:center;padding:16px 0">กำลังเชื่อมต่อฐานข้อมูล…</p>');
    const p = await call('ping');
    classCode = !!(p && p.classCode);
    if (!p.ok) return showLogin('pin', esc(p.message || 'เชื่อมต่อฐานข้อมูลไม่ได้'));
    showWelcome();
  })();
})();

</script>
</body>
</html>
