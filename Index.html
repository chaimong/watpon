          <p class="small">จุดแข็ง: <b>${strong.map(s => D.standards[+s[1] - 1]).join(', ') || 'ยังไม่มีมาตรฐานที่ได้ ≥ 4'}</b> · ต้องพัฒนา: <b>${weak.map(s => D.standards[+s[1] - 1]).join(', ') || '–'}</b>${p.flags.length ? ` · ตัวบ่งชี้: ${p.flags.join(', ')}` : ''}</p></div>
        <label class="f"><b style="color:var(--ink)">ร่าง Assessment Report ของฉัน</b> (สรุปผล · จุดแข็ง/จุดที่ต้องพัฒนาของชั้น · แผนปรับการสอน 3 ข้อ · วิธีติดตามผล · ข้อควรระวังด้านจริยธรรม)<textarea data-note="report-draft" style="min-height:180px"></textarea></label></div>`;
      const t = el.querySelector('[data-note]'); t.value = U().st().notes['report-draft'] || ''; t.oninput = () => { U().st().notes['report-draft'] = t.value; U().saveSoon(); };
    };
    on(el, 'click', 'tr[data-pick]', t => { st.pick = t.dataset.pick; U().save(); draw(); });
    draw();
  };

  /* ─── M8 : Feedback Composer ─────────────────────── */
  T.feedback = el => {
    const D = window.DATASETS.classData;
    const st = store('feedback', { who: 'N17', goal: '', now: '', next: '' });
    const draw = () => {
      const r = D.rows.find(x => x[0] === st.who) || D.rows[0];
      const all = `${st.goal} ${st.now} ${st.next}`;
      const warn = [];
      if (/เก่ง|ฉลาด|โง่|ขี้เกียจ|แย่/.test(all)) warn.push(['no', 'มีคำที่เป็น Feedback ระดับตัวบุคคล (self) — เปลี่ยนเป็นข้อความเกี่ยวกับงาน/กระบวนการ']);
      if (!st.next.trim()) warn.push(['warn', 'ยังไม่มี “ขั้นต่อไป” — ส่วนสำคัญที่สุดของ Feedback']);
      else if (st.next.trim().length < 25) warn.push(['warn', '“ขั้นต่อไป” ยังสั้น — ระบุสิ่งที่ทำได้จริงและเฉพาะเจาะจง']);
      if (st.now.trim() && !/S[1-4]|มาตรฐาน|อ่าน|คำนวณ|แปล|นำเสนอ|คะแนน|\d/.test(st.now)) warn.push(['warn', '“ตอนนี้อยู่ตรงไหน” ควรอ้างหลักฐาน เช่น มาตรฐานหรือคะแนน']);
      if (!warn.length && st.next.trim()) warn.push(['ok', 'Feedback ครบ 3 คำถามและไม่พบคำระดับตัวบุคคล']);
      el.innerHTML = `<div class="grid g2" style="align-items:start"><div class="stack">
        <label class="f">นักเรียน (ข้อมูลจำลอง)<select id="fb-who" data-who>${D.rows.map(x => `<option ${x[0] === st.who ? 'selected' : ''}>${x[0]}</option>`).join('')}</select></label>
        <div class="tbl-wrap"><table class="t"><thead><tr><th class="num">ก่อน</th><th class="num">หลัง</th>${D.standards.map(s => `<th class="num">${s.split(' ')[0]}</th>`).join('')}<th class="num">งาน</th></tr></thead><tbody><tr><td class="num">${r[1]}</td><td class="num">${r[6]}</td>${[2, 3, 4, 5].map(i => `<td class="num">${r[i]}</td>`).join('')}<td class="num">${r[7]}/6</td></tr></tbody></table></div>
        <label class="f">Where am I going? — เป้าหมาย<textarea id="fb-goal" data-k="goal" placeholder="เช่น เป้าหมายของหน่วยนี้คือแปลความหมายค่ากลางและสรุปข้อมูลพร้อมเหตุผล">${E(st.goal)}</textarea></label>
        <label class="f">How am I going? — ตอนนี้อยู่ตรงไหน (อ้างหลักฐาน)<textarea id="fb-now" data-k="now">${E(st.now)}</textarea></label>
        <label class="f">Where to next? — ขั้นต่อไป<textarea id="fb-next" data-k="next">${E(st.next)}</textarea></label></div>
        <div class="stack"><div class="card flat stack" style="background:var(--surface-2)"><span class="eyebrow">Feedback ถึง ${st.who}</span><p>${E(st.goal)}</p><p>${E(st.now)}</p><p><b>${E(st.next)}</b></p></div><div class="stack" data-warn style="gap:6px">${warn.map(([c, t]) => `<div class="fb ${c}">${t}</div>`).join('')}</div><button class="btn sm" data-copy style="align-self:flex-start">คัดลอก Feedback</button></div></div>`;
    };
    on(el, 'change', '[data-who]', s => { st.who = s.value; U().save(); draw(); });
    on(el, 'input', '[data-k]', t => { st[t.dataset.k] = t.value; U().saveSoon(); });
    on(el, 'change', 'textarea[data-k]', () => draw());
    on(el, 'click', '[data-copy]', () => U().copy([st.goal, st.now, st.next].filter(Boolean).join('\n')));
    draw();
  };

  /* ─── M7 : Digital Rubric Builder ────────────────── */
  const RB_EX = { example: true, title: 'การนำเสนอผลการวิเคราะห์ข้อสอบ', task: 'นักศึกษานำเสนอผลวิเคราะห์ข้อสอบ 10 ข้อต่อ “คณะกรรมการวิชาการของโรงเรียน” พร้อมข้อเสนอปรับปรุง ภายใน 7 นาที', crit: [
    { name: 'ความถูกต้องของการวิเคราะห์', pts: 30, d: ['คำนวณ p, r และตารางตัวลวงถูกต้องทุกข้อ และระบุข้อจำกัดของขนาดตัวอย่าง', 'คำนวณถูกเกือบทุกข้อ คลาดเคลื่อน 1–2 ค่าที่ไม่กระทบข้อสรุป', 'คำนวณคลาดเคลื่อนหลายค่า จนข้อสรุปบางข้อไม่ถูกต้อง', 'คำนวณผิดส่วนใหญ่หรือไม่แสดงวิธีคำนวณ'] },
    { name: 'การวินิจฉัยและตัดสินใจ', pts: 40, d: ['เชื่อมตัวเลขกับเนื้อหาข้อสอบ ระบุสาเหตุที่เป็นไปได้ และเสนอวิธีแก้เฉพาะเจาะจงทุกข้อที่มีปัญหา', 'ระบุสาเหตุและวิธีแก้ได้เกือบทุกข้อ บางข้อยังกว้าง', 'ระบุข้อที่มีปัญหาได้ แต่ไม่อธิบายสาเหตุหรือวิธีแก้', 'ตัดสินใจโดยไม่อ้างหลักฐาน'] },
    { name: 'การสื่อสารกับผู้ฟัง', pts: 30, d: ['ลำดับ ปัญหา → หลักฐาน → ข้อเสนอ ชัดเจน ใช้ภาษาที่กรรมการเข้าใจ และตอบคำถามโดยอ้างข้อมูล', 'ลำดับชัด ใช้ศัพท์เทคนิคบางจุดโดยไม่อธิบาย', 'ลำดับไม่ชัด ผู้ฟังต้องถามซ้ำเพื่อเข้าใจข้อเสนอ', 'ไม่สามารถสื่อข้อค้นพบหลักได้'] }
  ], score: {} };
  const LVN = ['4 ดีมาก', '3 ดี', '2 พอใช้', '1 ปรับปรุง'];
  T.rubric = el => {
    const st = store('rubric', () => clone(RB_EX));
    const lint = t => { t = (t || '').trim(); if (!t) return 'ว่าง'; if (/^(ดีมาก|ดี|พอใช้|ปรับปรุง|เหมาะสม|น้อย|มาก)$/.test(t)) return 'คลุมเครือ'; if (/^มี\s*\d+/.test(t) && t.length < 25) return 'นับจำนวนอย่างเดียว'; if (t.length < 15) return 'สั้นเกิน'; return ''; };
    const draw = () => {
      const total = st.crit.reduce((a, c) => a + (+c.pts || 0), 0);
      const got = st.crit.reduce((a, c, i) => a + (st.score[i] ? (5 - st.score[i]) / 4 * c.pts : 0), 0);
      const scored = Object.keys(st.score).length;
      const issues = st.crit.flatMap(c => c.d.map(lint)).filter(Boolean).length;
      el.innerHTML = `<div class="stack">${st.example ? '<div class="fb warn row" style="justify-content:space-between"><span>ตัวอย่าง Analytic Rubric — แก้ไขได้ทันที</span><button class="btn sm" data-clear>เริ่ม Rubric ของฉัน</button></div>' : ''}
        <div class="grid g2"><label class="f">ชื่อ Rubric<input type="text" id="rb-title" data-t="title" value="${E(st.title)}"></label><label class="f">ภาระงาน (Task)<input type="text" id="rb-task" data-t="task" value="${E(st.task)}"></label></div>
        <div class="tbl-wrap"><table class="t rb"><thead><tr><th>เกณฑ์</th><th class="num">คะแนน</th>${LVN.map(l => `<th>${l}</th>`).join('')}<th></th></tr></thead><tbody>
        ${st.crit.map((c, i) => `<tr><td><textarea data-c="${i}" data-f="name" style="min-height:56px">${E(c.name)}</textarea></td><td><input class="cell-in" type="number" min="0" data-c="${i}" data-f="pts" value="${c.pts}" aria-label="คะแนนเกณฑ์"></td>${c.d.map((d, j) => { const w = lint(d); return `<td><textarea data-c="${i}" data-d="${j}" aria-label="${E(c.name)} ระดับ ${4 - j}">${E(d)}</textarea>${w ? `<span class="pill warn">${w}</span>` : ''}</td>`; }).join('')}<td><button class="btn ghost sm" data-del="${i}" aria-label="ลบเกณฑ์">✕</button></td></tr>`).join('')}
        </tbody></table></div>
        <div class="row"><button class="btn sm" data-add>+ เพิ่มเกณฑ์</button><button class="btn sm" data-copy>คัดลอก Rubric</button>${pill(total === 100 ? 'good' : 'data', `คะแนนเต็ม ${total}`)}${issues ? pill('warn', `คำอธิบายที่ควรปรับ ${issues} ช่อง`) : pill('good', 'คำอธิบายผ่านการตรวจเบื้องต้น')}</div>
        <div class="card flat stack"><div class="section-head"><h3>ทดลองให้คะแนนผลงาน 1 ชิ้น</h3><span class="mono">${scored ? `${Math.round(got * 10) / 10} / ${total}` : '–'}</span></div>
          ${st.crit.map((c, i) => `<div class="stack" style="gap:4px"><span class="small"><b>${E(c.name)}</b> (${c.pts})</span><div class="lvl" data-sc="${i}">${[1, 2, 3, 4].map(j => `<button data-j="${j}" aria-pressed="${st.score[i] === j}">${5 - j}</button>`).join('')}</div>${st.score[i] ? `<span class="small muted">Feedback: ${E(c.d[st.score[i] - 1])}</span>` : ''}</div>`).join('')}
          <p class="small muted">คะแนนเกณฑ์ = ระดับ ÷ 4 × คะแนนเต็มของเกณฑ์ · ลองให้เพื่อนให้คะแนนชิ้นเดียวกันอย่างอิสระ แล้วเทียบกัน</p></div></div>`;
    };
    const touch = () => { st.example = false; U().saveSoon(); };
    on(el, 'input', '[data-t]', t => { st[t.dataset.t] = t.value; touch(); });
    on(el, 'input', '[data-c]', t => { const c = st.crit[+t.dataset.c]; if (t.dataset.d != null) c.d[+t.dataset.d] = t.value; else c[t.dataset.f] = t.dataset.f === 'pts' ? (+t.value || 0) : t.value; touch(); });
    on(el, 'change', '[data-c]', () => draw());
    on(el, 'click', '[data-add]', () => { st.crit.push({ name: 'เกณฑ์ใหม่', pts: 10, d: ['', '', '', ''] }); touch(); draw(); });
    on(el, 'click', '[data-del]', b => { st.crit.splice(+b.dataset.del, 1); st.score = {}; touch(); draw(); });
    on(el, 'click', '[data-clear]', () => { Object.assign(st, { example: false, title: '', task: '', crit: [{ name: '', pts: 10, d: ['', '', '', ''] }], score: {} }); U().save(); draw(); });
    on(el, 'click', '.lvl[data-sc] button', b => { st.score[+b.closest('[data-sc]').dataset.sc] = +b.dataset.j; U().save(); draw(); });
    on(el, 'click', '[data-copy]', () => U().copy(`${st.title}\nภาระงาน: ${st.task}\nเกณฑ์\tคะแนน\t${LVN.join('\t')}\n` + st.crit.map(c => [c.name, c.pts, ...c.d].map(x => String(x).replace(/\n/g, ' ')).join('\t')).join('\n')));
    draw();
  };

  /* ─── M9 : Technology Risk Explorer ──────────────── */
  const TF = [['p', 'หลักการ'], ['s', 'จุดเด่น'], ['l', 'ข้อจำกัด'], ['f', 'ความเหมาะสม'], ['risk', 'ความเสี่ยง'], ['priv', 'ความเป็นส่วนตัว'], ['acc', 'ความถูกต้อง'], ['tr', 'ความโปร่งใส'], ['ho', 'Human Oversight']];
  T.techmatrix = el => {
    const tech = window.MODULES.find(m => m.id === 9).tech;
    const st = store('techmatrix', { sel: 6, note: {} });
    const draw = () => {
      const t = tech[st.sel];
      el.innerHTML = `<div class="stack"><div class="row" style="gap:6px">${tech.map((x, i) => `<button class="btn sm ${i === st.sel ? 'primary' : ''}" data-i="${i}">${i + 1}. ${E(x.n)}</button>`).join('')}</div>
        <div class="card flat stack"><h3>${st.sel + 1}. ${E(t.n)}</h3><div class="tbl-wrap"><table class="t"><tbody>${TF.map(([k, l]) => `<tr><th style="width:150px">${l}</th><td>${E(t[k])}</td></tr>`).join('')}</tbody></table></div>
        <label class="f">ถ้าจะใช้ในบริบทโรงเรียน/ชั้นเรียนของฉัน ต้องเตรียมหรือระวังอะไร<textarea id="tm-note-${st.sel}" data-note-i="${st.sel}">${E(st.note[st.sel] || '')}</textarea></label></div></div>`;
    };
    on(el, 'click', 'button[data-i]', b => { st.sel = +b.dataset.i; U().save(); draw(); });
    on(el, 'input', '[data-note-i]', t => { st.note[t.dataset.noteI] = t.value; U().saveSoon(); });
    draw();
  };

  /* ─── M9 : D-A-T-A Canvas ────────────────────────── */
  T.datacanvas = el => {
    const st = store('datacanvas', {});
    el.innerHTML = `<div class="canvas4">${window.COURSE.data.map((d, i) => `<div class="col"><span class="k">${d.k}</span><b>${d.name}</b><span class="small muted">${d.th}</span><ul class="small" style="margin:0;padding-left:1.1rem">${d.q.map(q => `<li>${E(q)}</li>`).join('')}</ul><textarea id="dc-${i}" data-c="c${i}" style="min-height:130px" aria-label="${d.name}">${E(st['c' + i] || '')}</textarea><span class="pill" style="align-self:flex-start">ผลลัพธ์: ${E(d.out)}</span></div>`).join('')}</div>`;
    on(el, 'input', '[data-c]', t => { st[t.dataset.c] = t.value; U().saveSoon(); });
  };

  window.TOOLS = T;
})();

</script>
<script>
/* ---- js/app.js ---- */
/* ห้องเรียนวัดผลดิจิทัล — แอปหลัก (routing, progress, pages, interactive widgets) */
/* เริ่มแอปหลังจากระบบสมาชิก (auth.js) ตรวจสอบผู้ใช้แล้ว — opts: { storageKey, onSave, initialState }
   เรียกซ้ำได้ (เช่น ออกจากระบบแล้วเข้าใหม่ / session หมดอายุ) : ครั้งถัดไปจะสลับผู้ใช้และข้อมูลโดยไม่ผูก event ซ้ำ */
window.LMA_start = function (opts) {
  if (window.LMA_restart) return window.LMA_restart(opts);
  opts = opts || {};
  const C = window.COURSE, D = window.DATASETS;
  const MODS = window.MODULES.sort((a, b) => a.id - b.id);
  /* แบบทดสอบเชิงสถานการณ์ 30 ข้อ (ก–จ) : ใช้ชุดเดียวกันทั้งก่อนเรียนและหลังเรียน */
  MODS.forEach(m => { const b = window.QUIZ_BANK && window.QUIZ_BANK[m.id]; if (b) { m.quiz = b; m.pretest = b; } });
  let KEY = opts.storageKey || 'lma.v1';
  const FLOW = C.moduleFlow;
  const SUM = id => (window.SUMMARIES || {})[id] || { sections: [], refs: [], key: [] };

  /* ── state ─────────────────────────────────────────── */
  const blank = () => ({ steps: {}, quiz: {}, notes: {}, tools: {}, submit: {}, improve: {}, time: {}, days: [], wrong: {}, view: {} });
  /* ใช้ข้อมูลจากเซิร์ฟเวอร์ที่ส่งมาโดยตรงเมื่อใหม่กว่า — จำเป็นสำหรับเบราว์เซอร์ที่ปิด localStorage (เช่น Safari ในหน้าฝังของ Apps Script) */
  const loadState = () => {
    let s = null; try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    const init = opts.initialState; if (init && (!s || (init.savedAt || 0) > (s.savedAt || 0))) s = init;
    return Object.assign(blank(), s || {});
  };
  let S = loadState();
  const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} if (opts.onSave) opts.onSave(); };
  let saveTimer; const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); };

  /* ── utils ─────────────────────────────────────────── */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const f2 = (x, d = 2) => (x == null || isNaN(x) ? '–' : Number(x).toFixed(d));
  const pct = x => Math.round(x * 100);
  function toast(msg) { const t = $('#live'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200); }
  function copy(text) {
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
      toast(ok ? 'คัดลอกแล้ว' : 'คัดลอกไม่สำเร็จ — เลือกข้อความในกล่องแล้วกด Ctrl+C');
    };
    try { navigator.clipboard.writeText(text).then(() => toast('คัดลอกแล้ว'), fallback); } catch (e) { fallback(); }
  }
  function seeded(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(arr, seed) { const r = seeded(seed), a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  /* SVG bar chart : series of {name, values, cls}; values on one shared scale */
  function bars({ labels, series, max, height = 200, suffix = '', yTicks }) {
    const W = 640, H = height, L = 36, R = 8, T = 18, B = 34;
    const n = labels.length, k = series.length;
    const mx = max ?? Math.max(1, ...series.flatMap(s => s.values.filter(v => v != null)));
    const ticks = yTicks || [0, mx / 2, mx].map(v => Math.round(v * 10) / 10);
    const y = v => T + (H - T - B) * (1 - v / mx);
    const gw = (W - L - R) / n, bw = Math.min(26, (gw - 10) / k);
    let g = ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}${suffix}</text>`).join('');
    g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
    labels.forEach((lb, i) => {
      const x0 = L + gw * i + (gw - bw * k - 2 * (k - 1)) / 2;
      series.forEach((s, j) => {
        const v = s.values[i]; if (v == null) return;
        const x = x0 + j * (bw + 2), yy = y(Math.max(0, v)), h = Math.max(0, y(0) - yy);
        g += `<rect x="${x}" y="${yy}" width="${bw}" height="${h}" rx="2" style="fill:${s.color}"><title>${esc(s.name)} · ${esc(lb)}: ${v}${suffix}</title></rect>`;
        if (k <= 2) g += `<text x="${x + bw / 2}" y="${yy - 4}" text-anchor="middle" style="font-size:10px">${Math.round(v * 10) / 10}</text>`;
      });
      g += `<text x="${L + gw * i + gw / 2}" y="${H - B + 16}" text-anchor="middle">${esc(lb)}</text>`;
    });
    const legend = k > 1 ? `<div class="row small muted" style="gap:14px">${series.map(s => `<span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
    return `<div class="stack" style="gap:6px">${legend}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="แผนภูมิแท่ง">${g}</svg></div>`;
  }
  const COL = { a: 'var(--accent)', d: 'var(--data)', g: 'var(--ink-3)', good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)' };

  /* ── progress model ────────────────────────────────── */
  const stepsOf = id => (S.steps['m' + id] ||= Array(12).fill(false));
  const modDone = id => stepsOf(id).filter(Boolean).length;
  const courseProgress = () => MODS.reduce((a, m) => a + modDone(m.id), 0) / (MODS.length * 12);
  const status = id => { const d = modDone(id); return d === 12 ? 'done' : d > 0 ? 'now' : 'todo'; };
  function currentModule() { const m = MODS.find(m => status(m.id) === 'now') || MODS.find(m => status(m.id) === 'todo'); return m || MODS[MODS.length - 1]; }
  function nextActivity() { const m = currentModule(); const i = stepsOf(m.id).findIndex(x => !x); return { m, i: i < 0 ? 11 : i }; }
  function markStep(id, i, v = true) { stepsOf(id)[i] = v; save(); }
  const hasActivity = () => MODS.some(m => modDone(m.id) > 0) || Object.values(S.quiz).some(q => Object.keys(q.ans || {}).length > 0);

  /* time & day tracking (Learning Analytics ของผู้เรียนในเครื่องนี้) */
  (function track() {
    const today = new Date().toISOString().slice(0, 10);
    if (!S.days.includes(today)) { S.days.push(today); save(); }
    setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      const r = parseRoute(); const k = r.page === 'module' ? 'm' + r.id : 'other';
      S.time[k] = (S.time[k] || 0) + 20; saveSoon();
    }, 20000);
  })();

  /* ── icons ─────────────────────────────────────────── */
  const ICO = {
    home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', book: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7',
    quiz: 'M4 4h16v16H4zM8 12l3 3 5-6', chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2', folder: 'M3 6h6l2 2h10v11H3z',
    rocket: 'M5 15c-1 2-1 4-1 4s2 0 4-1M9 15l-3-3c2-6 7-9 13-9 0 6-3 11-9 13zM15 9a1 1 0 1 1 0 .1', trend: 'M3 17l6-6 4 4 8-8M15 7h6v6',
    chat: 'M4 5h16v11H9l-5 4z', lib: 'M4 4v16M9 4v16M14 4l5 16', map: 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14',
    clip: 'M9 3h6v3H9zM6 5h12v16H6zM9 11h6M9 15h4', palette: 'M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.6 0-1.4-1.2-1.6-1.2-2.8 0-.9.7-1.6 1.7-1.6H16a5 5 0 0 0 5-5c0-3.9-4-7-9-7zM7.5 11.5h.01M10 7.5h.01M15 7.5h.01', users: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 0 0 0-6M22 21c0-3-2-5-4-5.5'
  };
  const icon = k => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICO[k]}"/></svg>`;

  /* ── routing ───────────────────────────────────────── */
  function parseRoute() {
    const h = (location.hash || '').replace(/^#/, '');
    let m = h.match(/^m([1-9])(?:-(\d{1,2}))?$/);
    if (m) { const id = +m[1]; const st = m[2] ? Math.min(12, Math.max(1, +m[2])) : (S.view['m' + id] || 1); return { page: 'module', id, step: st }; }
    m = h.match(/^(account|admin)(?:-([a-z]+))?$/); if (m) return { page: m[1], sub: m[2] || '' };
    m = h.match(/^lab(?:-([a-z]+))?$/); if (m) return { page: 'lab', sub: m[1] || 'itemlab' };
    const pages = ['home', 'quiz', 'portfolio', 'project', 'progress', 'reflection', 'resources', 'blueprint', 'assign', 'analytics', 'settings', 'account'];
    return { page: pages.includes(h) ? h : 'home' };
  }
  function renderNav(r) {
    const cur = r.page === 'module' ? 'm' + r.id : r.page;
    const a = (href, label, ic, on) => `<a href="#${href}" ${on ? 'aria-current="page"' : ''}>${ic ? icon(ic) : ''}<span>${label}</span></a>`;
    const sub = MODS.map(m => `<a href="#m${m.id}" ${cur === 'm' + m.id ? 'aria-current="page"' : ''}><span class="bub ${status(m.id) === 'done' ? 'done' : status(m.id) === 'now' ? 'now' : ''}" style="--s:18px">${m.id}</span><span>Module ${m.id}</span></a>`).join('');
    $('#nav').innerHTML =
      (window.PROFILE ? PROFILE.navItem(cur === 'account') : '') + a('home', 'หน้าแรก', 'home', cur === 'home') +
      a('m' + currentModule().id, 'บทเรียน', 'book', r.page === 'module') + `<div class="nav-sub">${sub}</div>` +
      a('quiz', 'แบบทดสอบ', 'quiz', cur === 'quiz') + a('lab', 'วิเคราะห์ผล', 'chart', cur === 'lab') +
      a('portfolio', 'ผลงานของฉัน', 'folder', cur === 'portfolio') + a('project', 'Innovation Project', 'rocket', cur === 'project') +
      a('progress', 'Progress', 'trend', cur === 'progress') + a('reflection', 'Reflection', 'chat', cur === 'reflection') +
      a('resources', 'Resources', 'lib', cur === 'resources') +
      `<div class="nav-label">โครงสร้างรายวิชา</div>` +
      a('blueprint', 'คู่มือรายวิชา (Blueprint)', 'map', cur === 'blueprint') + a('assign', 'งานมอบหมาย & Rubrics', 'clip', cur === 'assign') +
      a('analytics', 'Learning Analytics (ผู้สอน)', 'chart', cur === 'analytics') + (window.PROFILE ? PROFILE.navAdmin(cur, a) : '') +
      `<div class="nav-label">การแสดงผล</div>` + a('settings', 'ตั้งค่าธีม (Theme)', 'palette', cur === 'settings');
  }
  const TITLES = { home: 'หน้าแรก', quiz: 'แบบทดสอบ', lab: 'วิเคราะห์ผล', portfolio: 'ผลงานของฉัน', project: 'Innovation Project', progress: 'Progress', reflection: 'Reflection', resources: 'Resources', blueprint: 'คู่มือรายวิชา', assign: 'งานมอบหมาย & Rubrics', analytics: 'Learning Analytics', settings: 'ตั้งค่าธีม', account: 'โปรไฟล์ของฉัน', admin: 'ผู้ดูแลระบบ' };
  function render() {
    const r = parseRoute();
    renderNav(r);
    const main = $('#main');
    const P = { home: pageHome, module: () => pageModule(r.id, r.step), quiz: pageQuiz, lab: () => pageLab(r.sub), portfolio: pagePortfolio, project: pageProject, progress: pageProgress, reflection: pageReflection, resources: pageResources, blueprint: pageBlueprint, assign: pageAssign, analytics: pageAnalytics, settings: pageSettings, account: () => PROFILE.accountPage(r.sub), admin: () => PROFILE.adminPage(r.sub) };
    main.innerHTML = `<div class="page">${P[r.page]()}</div>`;
    $('#topTitle').textContent = r.page === 'module' ? `Module ${r.id} · ${FLOW[r.step - 1][0]}` : TITLES[r.page] || '';
    mountAll(main);
    document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); $('#main').focus({ preventScroll: true }); });
  $('#menuBtn').addEventListener('click', () => { const o = document.body.classList.toggle('nav-open'); $('#menuBtn').setAttribute('aria-expanded', String(o)); });
  $('#scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));

  /* ── widgets ───────────────────────────────────────── */
  function getRef(ref) { const [mid, part, idx] = ref.split('.'); const m = MODS.find(x => 'm' + x.id === mid); let o = m[part]; if (idx != null) o = o[+idx]; return o; }
  function mountAll(root) {
    $$('[data-w]', root).forEach(el => {
      const w = el.dataset.w;
      if (w === 'quiz') mountQuiz(el);
      else if (w === 'classify') mountClassify(el);
      else if (w === 'match') mountMatch(el);
      else if (w === 'scenario') mountScenario(el);
      else if (w === 'tool') { const fn = window.TOOLS && window.TOOLS[el.dataset.tool]; if (fn) fn(el); else el.innerHTML = '<p class="muted">ไม่พบเครื่องมือ</p>'; }
    });
    $$('textarea[data-note]', root).forEach(t => { t.value = S.notes[t.dataset.note] || ''; t.addEventListener('input', () => { S.notes[t.dataset.note] = t.value; saveSoon(); }); });
  }
  function widget(item, ref) {
    if (!item) return '';
    if (item.type === 'tool') return `<div class="card lift stack"><div class="section-head"><h3>${esc(item.title)}</h3><span class="pill data">เครื่องมือ</span></div><div data-w="tool" data-tool="${item.tool}"></div></div>`;
    const tag = { classify: 'Drag & Drop', match: 'Matching', scenario: 'Decision Making' }[item.type];
    return `<div class="card lift stack"><div class="section-head"><h3>${esc(item.title)}</h3><span class="pill data">${tag}</span></div>${item.prompt ? `<p class="muted small">${esc(item.prompt)}</p>` : ''}<div data-w="${item.type}" data-ref="${ref}"></div></div>`;
  }

  /* Quiz — แบบทดสอบเชิงสถานการณ์ 30 ข้อ ตัวเลือก ก–จ · แสดงทีละข้อพร้อมกระดาษคำตอบ (answer sheet)
     - pre  : แบบทดสอบก่อนเรียน (ชุดเดียวกับหลังเรียน สลับลำดับข้อ) ไม่เฉลยระหว่างทำ กดส่งเมื่อครบ
     - quiz : แบบทดสอบหลังเรียน ให้ Feedback ทันทีทุกข้อ */
  const LET = 'กขคงจ';
  function mountQuiz(el) {
    const m = MODS.find(x => x.id == el.dataset.mod), kind = el.dataset.kind, key = `m${m.id}-${kind}`, pre = kind === 'pre';
    const qs = pre ? m.pretest : m.quiz, n = qs.length;
    let st = S.quiz[key];
    if (!st || st.v !== 2 || st.n !== n) st = S.quiz[key] = { v: 2, n, ans: {}, cur: 0 };
    const order = pre ? shuffle(qs.map((_, i) => i), 97 + m.id) : qs.map((_, i) => i);
    const score = () => qs.filter((q, i) => st.ans[i] === q.a).length;
    const finish = () => {
      const sc = pct(score() / n); st.last = sc; st.best = Math.max(st.best ?? 0, sc); st.done = true;
      markStep(m.id, pre ? 2 : 8); toast(`บันทึกผล${pre ? 'แบบทดสอบก่อนเรียน' : 'แบบทดสอบหลังเรียน'}: ${sc}%`);
    };
    const draw = () => {
      const pos = Math.min(st.cur || 0, n - 1), i = order[pos], q = qs[i], a = st.ans[i];
      const answered = Object.keys(st.ans).length, reveal = !pre && a != null, locked = pre ? !!st.done : a != null;
      const sheet = order.map((qi, p) => { const v = st.ans[qi]; const cls = v == null ? '' : pre ? (st.done ? (v === qs[qi].a ? 'ok' : 'no') : 'done') : (v === qs[qi].a ? 'ok' : 'no'); return `<button class="qb ${cls} ${p === pos ? 'now' : ''}" data-go="${p}" aria-label="ข้อ ${p + 1}${v != null ? ' ตอบแล้ว' : ''}" ${p === pos ? 'aria-current="true"' : ''}>${p + 1}</button>`; }).join('');
      const opts = q.o.map((o, j) => { const cls = reveal ? (j === q.a ? 'right' : j === a ? 'wrong' : '') : (a === j ? 'picked' : ''); return `<button class="opt ${cls}" data-o="${j}" ${locked ? 'disabled' : ''} aria-pressed="${a === j}"><span class="bub">${LET[j]}</span><span>${esc(o)}</span></button>`; }).join('');
      const fb = reveal ? `<div class="fb ${a === q.a ? 'ok' : 'no'}" role="status"><b>${a === q.a ? 'ถูกต้อง' : `ยังไม่ถูก — คำตอบคือ ${LET[q.a]}. ${esc(q.o[q.a])}`}</b><br>${esc(q.e)}</div>` : '';
      const done = pre ? st.done : answered === n;
      const summary = done ? `<div class="qsum"><span class="big">${score()}/${n}</span><span class="small">${pre ? `คะแนนก่อนเรียน ${st.last}% · เฉลยและคำอธิบายดูได้ในแบบทดสอบหลังเรียน (ขั้นที่ 9) เพื่อไม่ให้ผลก่อน–หลังเรียนคลาดเคลื่อน` : `คะแนนครั้งนี้ ${pct(score() / n)}% · สูงสุด ${st.best ?? pct(score() / n)}%${S.quiz[`m${m.id}-pre`]?.done ? ` · ก่อนเรียน ${S.quiz[`m${m.id}-pre`].last}%` : ''}`}</span><button class="btn sm" data-reset>ทำใหม่</button></div>` : '';
      el.innerHTML = `<div class="quizbox">
        <div class="qhead"><span class="pill ${pre ? '' : 'acc'}">${pre ? 'แบบทดสอบก่อนเรียน' : 'แบบทดสอบหลังเรียน'} · เชิงสถานการณ์</span><span class="small muted">ตอบแล้ว ${answered}/${n}</span></div>
        <div class="bar"><i style="width:${answered / n * 100}%"></i></div>
        <details class="sheetbox" ${pre || n <= 30 ? 'open' : ''}><summary class="small muted">กระดาษคำตอบ (คลิกเลขข้อเพื่อไปยังข้อนั้น)</summary><div class="qsheet">${sheet}</div></details>
        <div class="q" style="border:none"><div class="stem"><span class="qno">ข้อ ${pos + 1}</span>${esc(q.q)}</div><div class="opts">${opts}</div>${fb}</div>
        <div class="qnav"><button class="btn sm" data-step="-1" ${pos === 0 ? 'disabled' : ''}>← ข้อก่อนหน้า</button>
          ${pre && !st.done ? `<button class="btn sm primary" data-submit ${answered < n ? 'disabled' : ''}>${answered < n ? `ส่งคำตอบ (เหลือ ${n - answered} ข้อ)` : 'ส่งคำตอบ'}</button>` : ''}
          <button class="btn sm" data-step="1" ${pos === n - 1 ? 'disabled' : ''}>ข้อถัดไป →</button></div>${summary}</div>`;
    };
    const go = p => { st.cur = Math.max(0, Math.min(n - 1, p)); save(); draw(); };
    el.addEventListener('click', e => {
      const g = e.target.closest('[data-go]'); if (g) return go(+g.dataset.go);
      const s = e.target.closest('[data-step]'); if (s && !s.disabled) return go((st.cur || 0) + +s.dataset.step);
      const b = e.target.closest('.opt'); if (b && !b.disabled) {
        const i = order[Math.min(st.cur || 0, n - 1)], j = +b.dataset.o; st.ans[i] = j;
        if (!pre) { const wk = `${key}-${i}`; if (j !== qs[i].a) S.wrong[wk] = { mod: m.id, kind, i }; else delete S.wrong[wk]; if (Object.keys(st.ans).length === n) finish(); save(); return draw(); }
        save(); draw();
        const next = order.findIndex((qi, p) => p > (st.cur || 0) && st.ans[qi] == null);
        if (next >= 0) setTimeout(() => go(next), 220);
        return;
      }
      if (e.target.closest('[data-submit]')) { finish(); save(); return draw(); }
      if (e.target.closest('[data-reset]')) { st.ans = {}; st.cur = 0; st.done = false; if (!pre) Object.keys(S.wrong).filter(k => k.startsWith(key + '-')).forEach(k => delete S.wrong[k]); save(); draw(); }
    });
    draw();
  }

  /* Classify — drag & drop + tap buttons, immediate feedback */
  function mountClassify(el) {
    const ref = el.dataset.ref, it = getRef(ref), k = 'cls:' + ref;
    const st = (S.tools[k] ||= { placed: {} });
    const order = shuffle(it.items.map((_, i) => i), ref.length * 31 + it.items.length);
    const place = (i, c) => { st.placed[i] = c; save(); draw(); const ok = it.items[i][1] === c; toast(ok ? 'ถูกต้อง' : 'ยังไม่ถูก ลองอ่านคำอธิบาย'); };
    const draw = () => {
      const done = Object.keys(st.placed).length, right = Object.entries(st.placed).filter(([i, c]) => it.items[i][1] === c).length;
      const bucket = c => `<div class="bucket" data-c="${c}"><h4>${esc(it.cats[c])}</h4>${Object.entries(st.placed).filter(([, cc]) => cc === c).map(([i]) => {
        const ok = it.items[i][1] === c;
        return `<div class="chip placed ${ok ? 'ok' : 'no'}"><span>${esc(it.items[i][0])}</span><span class="small">${ok ? '✓ ' : '✗ ควรเป็น “' + esc(it.cats[it.items[i][1]]) + '” — '}${esc(it.items[i][2])}</span></div>`;
      }).join('')}</div>`;
      const left = order.filter(i => st.placed[i] == null).map(i => `<div class="chip" draggable="true" data-i="${i}"><span>${esc(it.items[i][0])}</span><div class="choices">${it.cats.map((c, ci) => `<button class="btn sm" data-i="${i}" data-c="${ci}">${esc(c)}</button>`).join('')}</div></div>`).join('');
      el.innerHTML = `<div class="stack"><div class="chips">${left || '<div class="fb info">จัดครบทุกการ์ดแล้ว</div>'}</div><div class="buckets">${it.cats.map((_, c) => bucket(c)).join('')}</div><div class="row small"><span class="pill ${done && right === done ? 'good' : 'data'}">ถูก ${right}/${it.items.length}</span>${done ? '<button class="btn sm" data-reset>เริ่มใหม่</button>' : ''}</div></div>`;
    };
    el.addEventListener('click', e => { const b = e.target.closest('button[data-c]'); if (b) return place(+b.dataset.i, +b.dataset.c); if (e.target.closest('[data-reset]')) { st.placed = {}; save(); draw(); } });
    el.addEventListener('dragstart', e => { const c = e.target.closest('.chip[data-i]'); if (c) e.dataTransfer.setData('text/plain', c.dataset.i); });
    el.addEventListener('dragover', e => { const b = e.target.closest('.bucket'); if (b) { e.preventDefault(); b.classList.add('over'); } });
    el.addEventListener('dragleave', e => { const b = e.target.closest('.bucket'); if (b) b.classList.remove('over'); });
    el.addEventListener('drop', e => { const b = e.target.closest('.bucket'); if (!b) return; e.preventDefault(); const i = e.dataTransfer.getData('text/plain'); if (i !== '') place(+i, +b.dataset.c); });
    draw();
  }

  /* Matching */
  function mountMatch(el) {
    const ref = el.dataset.ref, it = getRef(ref), k = 'mat:' + ref;
    const st = (S.tools[k] ||= { sel: {}, checked: false });
    const defs = shuffle(it.pairs.map((p, i) => i), 7 + it.pairs.length);
    const draw = () => {
      const right = it.pairs.filter((p, i) => +st.sel[i] === i).length;
      el.innerHTML = `<div class="stack">${it.pairs.map((p, i) => {
        const v = st.sel[i]; const ok = st.checked && v != null && +v === i;
        return `<div class="grid" style="grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:10px;align-items:center"><b class="small">${esc(p[0])}</b><div class="stack" style="gap:4px"><select data-i="${i}" aria-label="คำอธิบายของ ${esc(p[0])}"><option value="">— เลือกคำอธิบาย —</option>${defs.map(d => `<option value="${d}" ${+v === d && v !== '' && v != null ? 'selected' : ''}>${esc(it.pairs[d][1])}</option>`).join('')}</select>${st.checked ? `<span class="small" style="color:var(--${ok ? 'good' : 'bad'})">${ok ? '✓ ถูกต้อง' : '✗ คำตอบคือ: ' + esc(p[1])}</span>` : ''}</div></div>`;
      }).join('')}<div class="row"><button class="btn primary sm" data-check>ตรวจคำตอบ</button>${st.checked ? `<span class="pill ${right === it.pairs.length ? 'good' : 'warn'}">ถูก ${right}/${it.pairs.length}</span><button class="btn sm" data-reset>เริ่มใหม่</button>` : ''}</div></div>`;
    };
    el.addEventListener('change', e => { const s = e.target.closest('select[data-i]'); if (s) { st.sel[s.dataset.i] = s.value; st.checked = false; save(); draw(); } });
    el.addEventListener('click', e => { if (e.target.closest('[data-check]')) { st.checked = true; save(); draw(); } if (e.target.closest('[data-reset]')) { st.sel = {}; st.checked = false; save(); draw(); } });
    draw();
  }

  /* Scenario / Decision making */
  function mountScenario(el) {
    const ref = el.dataset.ref, it = getRef(ref), k = 'scn:' + ref;
    const st = (S.tools[k] ||= { ch: [] });
    const draw = () => {
      let html = '';
      for (let s = 0; s < it.steps.length; s++) {
        const step = it.steps[s], c = st.ch[s];
        html += `<div class="q"><div class="stem"><span class="pill acc">สถานการณ์ ${s + 1}/${it.steps.length}</span> ${esc(step.q)}</div><div class="opts">${step.opts.map((o, j) => {
          const cls = c == null ? '' : j === c ? (o[2] ? 'right' : 'wrong') : '';
          return `<button class="opt ${cls}" data-s="${s}" data-j="${j}" ${c != null ? 'disabled' : ''}><span class="bub">${'กขค'[j]}</span><span>${esc(o[0])}</span></button>`;
        }).join('')}</div>${c != null ? `<div class="fb ${step.opts[c][2] ? 'ok' : 'no'}">${esc(step.opts[c][1])}</div>` : ''}</div>`;
        if (c == null) break;
      }
      const good = st.ch.filter((c, s) => it.steps[s].opts[c][2]).length;
      if (st.ch.length === it.steps.length) html += `<div class="row" style="padding-top:10px"><span class="pill ${good === it.steps.length ? 'good' : 'warn'}">ตัดสินใจเหมาะสม ${good}/${it.steps.length}</span><button class="btn sm" data-reset>ลองอีกครั้ง</button></div>`;
      el.innerHTML = html;
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (b && !b.disabled) { st.ch[+b.dataset.s] = +b.dataset.j; save(); draw(); return; }
      if (e.target.closest('[data-reset]')) { st.ch = []; save(); draw(); }
    });
    draw();
  }

  /* ── pages ─────────────────────────────────────────── */
  function head(eyebrow, title, lead, extra = '') {
    return `<header class="stack" style="gap:6px"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1>${lead ? `<p class="muted" style="max-width:72ch">${lead}</p>` : ''}${extra}</header>`;
  }

  function progressSheet() {
    const rows = MODS.map(m => `<span>M${m.id}</span>${Array.from({ length: 12 }, (_, i) => `<span class="bub ${stepsOf(m.id)[i] ? 'done' : ''}" style="--s:11px;border-width:1.2px" title="${esc(FLOW[i][0])}"></span>`).join('')}`).join('');
    return `<div class="card stack" style="gap:10px"><div class="section-head"><span class="eyebrow">กระดาษคำตอบความก้าวหน้า</span><span class="mono small">${pct(courseProgress())}%</span></div>
      <div style="display:grid;grid-template-columns:auto repeat(12,1fr);gap:6px 5px;align-items:center;font:500 .7rem var(--font-mono);color:var(--ink-3)">${rows}</div>
      <p class="small muted">แต่ละแถวคือ 1 Module · วงกลม 12 วงคือ 12 ขั้นของบทเรียน (Welcome → Improve)</p></div>`;
  }

  function pageHome() {
    const na = nextActivity();
    const heroCta = `<div class="row" style="margin-top:18px"><a class="btn primary" href="#m${na.m.id}-${na.i + 1}">${hasActivity() ? 'เรียนต่อ' : 'เริ่มเรียน'}: Module ${na.m.id} · ${FLOW[na.i][0]}</a><a class="btn" href="#blueprint">ดูคู่มือรายวิชา</a></div>`;
    const cards = MODS.map(m => { const d = modDone(m.id); return `<a class="mcard" href="#m${m.id}"><div class="meta"><span class="bub ${status(m.id) === 'done' ? 'done' : status(m.id) === 'now' ? 'now' : ''}">${m.id}</span><span class="small muted">${m.time.split(' (')[0]}</span></div><h3>${esc(m.title)}</h3><span class="small muted mono">${esc(m.en)}</span><div class="bar"><i style="width:${d / 12 * 100}%"></i></div><span class="small muted">${d}/12 ขั้น</span></a>`; }).join('');
    const journey = C.journey.map(([t, mid], i) => `<a class="jn" href="#m${mid}" style="text-decoration:none;color:inherit"><span class="bub ${status(mid) === 'done' ? 'done' : status(mid) === 'now' ? 'now' : ''}" style="--s:26px">${i + 1}</span><span>${esc(t)}</span><span class="pill">M${mid}</span></a>`).join('');
    return `
    <section class="hero"><div class="hero-grid"><div class="stack" style="gap:10px">
      <span class="eyebrow">${esc(C.level)}</span><h1>${esc(C.th)}</h1><span class="en">${esc(C.en)}</span>
      <p class="muted" style="max-width:60ch">${esc(C.description)}</p><p class="small">ผู้สอน <b>${esc(C.instructor)}</b> · กลุ่มเป้าหมาย: ${esc(C.audience)}</p>
      <div class="loop">${C.concept.map(x => `<span>${x}</span>`).join('')}</div>${heroCta}</div>${progressSheet()}</div></section>

    <section class="card stack"><span class="eyebrow">Final Learning Outcome ของรายวิชา</span><p style="font-family:var(--font-display);font-size:1.12rem;line-height:1.7">${esc(C.finalLO)}</p>
      <div class="grid g3">${C.stages.map((s, i) => `<div class="stack" style="gap:4px;padding:12px;border-radius:8px;background:var(--surface-2)"><span class="mono small muted">ขั้นที่ ${i + 1} · ${s[1]}</span><b>${esc(s[0])}</b><span class="small muted">${esc(s[2])}</span></div>`).join('')}</div></section>

    <section class="grid g2" style="align-items:start">
      <div class="card stack"><div class="section-head"><h2>Learning Journey</h2><span class="small muted">คลิกเพื่อไปยัง Module</span></div><div class="journey">${journey}</div></div>
      <div class="card stack"><h2>สถานการณ์หลักของรายวิชา</h2><p>${esc(C.anchorCase.text)} <span class="tag-sim">ตัวอย่างสำหรับการออกแบบบทเรียน</span></p>
        <p class="small muted">คิดแบบนักวัดผล: ตอบคำถาม 6 ข้อ แล้วเปิดแนวคิดเทียบ — กลับมาทบทวนอีกครั้งเมื่อเรียนจบ Module 9</p>
        <ol class="small" style="margin:0;padding-left:1.2rem">${C.anchorCase.qs.map(q => `<li>${esc(q)}</li>`).join('')}</ol>
        <textarea data-note="anchor-case" aria-label="คำตอบของฉันต่อสถานการณ์หลัก" placeholder="เขียนคำตอบของคุณก่อนเปิดแนวคิด..."></textarea>
        <details class="acc"><summary>เปิดแนวคิดประกอบ</summary><div><ol class="small" style="margin:0;padding-left:1.2rem">${C.anchorCase.guide.map(g => `<li>${esc(g)}</li>`).join('')}</ol></div></details></div>
    </section>

    <section class="stack"><div class="section-head"><h2>9 Modules</h2><span class="small muted">วงจรการเรียน: ${C.cycle.join(' → ')}</span></div><div class="grid g3">${cards}</div></section>`;
  }

  /* Module page — 12 steps */
  function pageModule(id, step) {
    const m = MODS.find(x => x.id === id); S.view['m' + id] = step; save();
    const st = stepsOf(id);
    const clo = C.cloMap[id].map((v, i) => v ? `<span class="pill ${v === 2 ? 'acc' : ''}">${C.clos[i].id}${v === 2 ? ' ●' : ''}</span>` : '').join('');
    const rail = FLOW.map((f, i) => `<a class="step" href="#m${id}-${i + 1}" ${i + 1 === step ? 'aria-current="step"' : ''} style="text-decoration:none"><span class="bub ${st[i] ? 'done' : i + 1 === step ? 'now' : ''}">${i + 1}</span>${f[0]}</a>`).join('');
    const body = stepBody(m, step);
    const isQuizStep = step === 3 || step === 9;
    const prev = step > 1 ? `<a class="btn" href="#m${id}-${step - 1}">← ${FLOW[step - 2][0]}</a>` : id > 1 ? `<a class="btn" href="#m${id - 1}-12">← Module ${id - 1}</a>` : '<span></span>';
    const nextHref = step < 12 ? `#m${id}-${step + 1}` : id < 9 ? `#m${id + 1}-1` : '#project';
    const nextLabel = step < 12 ? FLOW[step][0] : id < 9 ? `Module ${id + 1}` : 'Innovation Project';
    return `
    <div class="mhead"><div class="row" style="gap:8px"><span class="eyebrow">Module ${id} · ${esc(m.time)}</span>${clo}</div><h1>${esc(m.title)}</h1><span class="mono small muted">${esc(m.en)}</span><p class="muted" style="max-width:75ch">${esc(m.tagline)}</p>
      <div class="bar" style="max-width:420px"><i style="width:${modDone(id) / 12 * 100}%"></i></div></div>
    <nav class="steps" aria-label="ขั้นตอนของบทเรียน">${rail}</nav>
    <div class="step-body"><div class="section-head"><h2><span class="mono muted" style="font-size:.9rem">${String(step).padStart(2, '0')}</span> ${FLOW[step - 1][0]} <span class="muted" style="font-size:.95rem;font-family:var(--font-body);font-weight:400">— ${FLOW[step - 1][1]}</span></h2>
      ${st[step - 1] ? `<span class="pill good">เสร็จแล้ว</span>` : isQuizStep ? `<span class="pill">ทำแบบทดสอบให้ครบเพื่อบันทึก</span>` : ''}</div>${body}</div>
    <div class="step-foot">${prev}<div class="row">${!isQuizStep ? `<button class="btn ghost sm" id="toggleDone">${st[step - 1] ? 'ยกเลิกเครื่องหมายเสร็จ' : 'ทำเครื่องหมายว่าเสร็จ'}</button>` : ''}<a class="btn primary" id="nextBtn" href="${nextHref}">${isQuizStep || st[step - 1] ? '' : 'เสร็จขั้นนี้ · '}ไป ${nextLabel} →</a></div></div>
    ${bindLater(() => {
      const tg = $('#toggleDone'); if (tg) tg.onclick = () => { markStep(id, step - 1, !stepsOf(id)[step - 1]); render(); };
      $('#nextBtn').addEventListener('click', () => { if (!isQuizStep) markStep(id, step - 1, true); });
    })}`;
  }
  /* run a callback after the current render has been mounted */
  function bindLater(fn) { setTimeout(fn, 0); return ''; }

  function stepBody(m, step) {
    const id = m.id;
    switch (step) {
      case 1: return `<div class="card stack"><p style="font-size:1.05rem;max-width:72ch">${esc(m.welcome)}</p>
        <div class="grid g4">${[['เวลาเรียน', m.time], ['สรุปเนื้อหา', (SUM(id).sections.length) + ' หัวข้อ · ' + SUM(id).refs.length + ' เอกสารอ้างอิง'], ['กิจกรรม', (1 + m.practice.length) + ' กิจกรรมเชิงโต้ตอบ'], ['ผลผลิต', m.assignment.product]].map(([a, b]) => `<div class="stack" style="gap:2px"><span class="eyebrow">${a}</span><b class="small">${esc(b)}</b></div>`).join('')}</div>
        <div class="flow">${C.cycle.map(x => `<span>${x}</span>`).join('')}</div></div>${id === 1 ? `<div class="fb info">คำแนะนำ: ความก้าวหน้า คำตอบ และบันทึกทั้งหมดเก็บในเบราว์เซอร์เครื่องนี้ ส่งงานจริงผ่านระบบ LMS ของรายวิชาตามที่ผู้สอนกำหนด</div>` : ''}`;
      case 2: return `<div class="card stack"><p class="muted small">เมื่อจบ Module นี้ ผู้เรียนสามารถ</p><ol style="margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:6px">${m.outcomes.map(o => `<li>${esc(o)}</li>`).join('')}</ol></div>
        <div class="card stack"><h3>เชื่อมโยงกับ Course Learning Outcomes</h3>${C.clos.map((c, i) => C.cloMap[id][i] ? `<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="pill ${C.cloMap[id][i] === 2 ? 'acc' : ''}">${c.id}</span><span class="small">${esc(c.text)} <span class="muted">(${C.cloMap[id][i] === 2 ? 'เน้นหลัก' : 'เกี่ยวข้อง'})</span></span></div>` : '').join('')}</div>`;
      case 3: return `<div class="card stack"><p class="small muted">แบบทดสอบก่อนเรียนเชิงสถานการณ์ ${m.pretest.length} ข้อ ตัวเลือก ก–จ ไม่นับคะแนน (Diagnostic) — ใช้ชุดเดียวกับแบบทดสอบหลังเรียนแต่สลับลำดับข้อ เพื่อวัดพัฒนาการ (gain) · ระบบจะไม่เฉลยจนกว่าจะทำแบบทดสอบหลังเรียน · เปลี่ยนคำตอบได้จนกว่าจะกดส่ง</p><div data-w="quiz" data-mod="${id}" data-kind="pre"></div></div>`;
      case 4: return `<div class="card stack"><span class="eyebrow">สถานการณ์นำเข้า</span><h3>${esc(m.engage.title)}</h3><p>${esc(m.engage.text)}</p><ol style="margin:0;padding-left:1.3rem">${m.engage.qs.map(q => `<li>${esc(q)}</li>`).join('')}</ol>
        <label class="f">ความคิดเริ่มต้นของฉัน (บันทึกอัตโนมัติ — จะกลับมาเทียบใน Reflection)<textarea data-note="m${id}-engage"></textarea></label></div>`;
      case 5: return summaryStep(m);
      case 6: return widget(m.explore, `m${id}.explore`);
      case 7: return m.practice.map((p, i) => widget(p, `m${id}.practice.${i}`)).join('');
      case 8: return `<div class="card stack"><span class="eyebrow">Case Study</span><h3>${esc(m.caseStudy.title)}</h3><p>${m.caseStudy.text}</p><ol style="margin:0;padding-left:1.3rem">${m.caseStudy.qs.map(q => `<li>${esc(q)}</li>`).join('')}</ol>
        <label class="f">คำตอบของฉัน<textarea data-note="m${id}-case" style="min-height:130px"></textarea></label>
        <details class="acc"><summary>แนวคำตอบ (เปิดหลังจากเขียนคำตอบของตนเอง)</summary><div><ol class="small" style="margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px">${m.caseStudy.guide.map(g => `<li>${esc(g)}</li>`).join('')}</ol></div></details></div>`;
      case 9: return `<div class="card stack"><div class="section-head"><h3>แบบทดสอบหลังเรียนเชิงสถานการณ์</h3><span class="pill">${m.quiz.length} ข้อ · ก–จ</span></div><p class="small muted">อ่านสถานการณ์แล้วเลือกคำตอบที่เหมาะสมที่สุด ระบบให้ Feedback และคำอธิบายทันทีทุกข้อ · ใช้กระดาษคำตอบด้านบนเพื่อข้ามไปข้อใดก็ได้</p><div data-w="quiz" data-mod="${id}" data-kind="quiz"></div></div>${assignmentCard(m)}`;
      case 10: return feedbackStep(m);
      case 11: return `<div class="card stack"><h3>ประเมินตนเองตาม Learning Outcomes</h3><p class="small muted">1 = ยังทำไม่ได้ · 2 = ทำได้เมื่อมีตัวช่วย · 3 = ทำได้เอง · 4 = อธิบาย/สอนผู้อื่นได้</p>${m.outcomes.map((o, i) => { const v = S.notes[`m${id}-conf-${i}`]; return `<div class="stack" style="gap:4px"><span class="small">${esc(o)}</span><div class="lvl" data-conf="m${id}-conf-${i}">${[1, 2, 3, 4].map(n => `<button aria-pressed="${v == n}">${n}</button>`).join('')}</div></div>`; }).join('')}</div>
        <div class="card stack"><h3>Reflection</h3>${m.reflection.map((r, i) => `<label class="f">${esc(r)}<textarea data-note="m${id}-r${i}"></textarea></label>`).join('')}
        ${S.notes[`m${id}-engage`] ? `<div class="fb info"><b>ความคิดเริ่มต้นของคุณในขั้น Engage:</b> ${esc(S.notes[`m${id}-engage`])}<br>ตอนนี้คุณคิดต่างไปอย่างไร?</div>` : ''}</div>
        ${bindLater(() => $$('[data-conf]').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.notes[g.dataset.conf] = b.textContent; save(); $$('button', g).forEach(x => x.setAttribute('aria-pressed', String(x === b))); })))}`;
      case 12: { const chk = (S.improve['m' + id] ||= []); return `<div class="card stack"><h3>ปรับปรุงผลงาน</h3>${m.improve.map((t, i) => `<label class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><input type="checkbox" id="imp-${id}-${i}" data-imp="${i}" ${chk[i] ? 'checked' : ''} style="margin-top:6px"><span>${esc(t)}</span></label>`).join('')}</div>
        <div class="card stack"><div class="section-head"><h3>Summary Sheet</h3><button class="btn sm" id="copySum">คัดลอกสรุป</button></div><ul style="margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px">${m.summary.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
        ${bindLater(() => { $$('[data-imp]').forEach(c => c.onchange = () => { chk[+c.dataset.imp] = c.checked; save(); }); $('#copySum').onclick = () => copy(`Module ${id}: ${m.title}\n` + m.summary.map(s => '• ' + s).join('\n')); })}`; }
    }
    return '';
  }

  /* ขั้น 05 — สรุปเนื้อหาเชิงวิชาการพร้อมการอ้างอิง (data/summary-a.js, summary-b.js) */
  function summaryStep(m) {
    const S = (window.SUMMARIES || {})[m.id]; if (!S) return '<div class="card">ยังไม่มีสรุปเนื้อหา</div>';
    const no = i => `${m.id}.${i + 1}`;
    const body = x => x.tech ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>เทคโนโลยี</th><th>หลักการ</th><th>จุดเด่น</th><th>ข้อจำกัด</th><th>Human Oversight</th></tr></thead><tbody>${(m.tech || []).map((t, i) => `<tr><td><b>${i + 1}. ${esc(t.n)}</b></td><td>${esc(t.p)}</td><td>${esc(t.s)}</td><td>${esc(t.l)}</td><td>${esc(t.ho)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">รายละเอียดด้านความเหมาะสม ความเสี่ยง และความเป็นส่วนตัวของแต่ละเทคโนโลยี อยู่ใน Technology Risk Explorer ขั้น Practice</p>`
      : x.innov ? `<ol>${C.innovations.map(v => `<li><b>${esc(v[0])}</b> — ${esc(v[1])}</li>`).join('')}</ol>` : x.p;
    return `<div class="card stack"><span class="eyebrow">Content Summary · Module ${m.id}</span><h3>${esc(m.title)} <span class="muted" style="font-weight:400">(${esc(m.en)})</span></h3><p class="sum-abs">${S.abstract}</p>
        <nav class="sum-toc" aria-label="หัวข้อในบทนี้"><b class="small">หัวข้อในบทนี้</b><ol>${S.sections.map((x, i) => `<li><a href="#m${m.id}-5" data-jump="sum-${m.id}-${i}"><span class="mono">${no(i)}</span> ${esc(x.h)}</a></li>`).join('')}</ol></nav></div>
      <article class="card reading sum">${S.sections.map((x, i) => `<section id="sum-${m.id}-${i}"><h3><span class="mono muted">${no(i)}</span> ${esc(x.h)}</h3><div>${body(x)}</div></section>`).join('')}</article>
      <div class="card stack sum-key"><h3>สาระสำคัญ</h3><ul style="margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px">${S.key.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>
      <div class="card stack"><div class="section-head"><h3>เอกสารอ้างอิง</h3><button class="btn sm" id="copyRefs">คัดลอกรายการอ้างอิง</button></div><ul class="refs">${S.refs.map(r => `<li>${r}</li>`).join('')}</ul>
        <p class="small muted">อ้างอิงตามรูปแบบ APA (7th ed.) · ตัวเลขในตัวอย่างเป็นข้อมูลสมมุติเพื่ออธิบายหลักการ · เกณฑ์ตัวเลขเป็นแนวทางที่นิยมใช้ ไม่ใช่ข้อกำหนดตายตัว</p></div>
      ${bindLater(() => {
        $$('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        const b = $('#copyRefs'); if (b) b.onclick = () => { const d = document.createElement('div'); copy(S.refs.map(r => { d.innerHTML = r; return d.textContent; }).join('\n')); };
      })}`;

        <p class="small muted">ต้นแบบนี้เก็บข้อมูลในเบราว์เซอร์ของผู้เรียน หากใช้งานจริงทั้งชั้นเรียน ควรเชื่อมกับ LMS ของมหาวิทยาลัยเพื่อเก็บ Login, คะแนน และการส่งงานจากระบบกลาง</p></section>`;
  }

  /* งานมอบหมาย & Rubrics — PART 7–8 */
  function pageAssign() {
    return head('PART 7–8', 'งานมอบหมายและ Rubrics', 'Assignment ทุก Module (Level 3 — Application) ใช้ Rubric 10 คะแนน และ Final Project (Level 4 — Performance) ใช้ Rubric 100 คะแนน') +
      MODS.map(m => `<details class="acc"><summary><span>M${m.id} · ${esc(m.assignment.title)}</span><span class="pill">${esc(m.assignment.product)}</span></summary><div class="stack"><p>${esc(m.assignment.brief)}</p><ol style="margin:0;padding-left:1.3rem">${m.assignment.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>${rubricTable(m.assignment.criteria)}<a class="btn sm" href="#m${m.id}-9" style="align-self:flex-start">เปิดใน Module</a></div></details>`).join('') +
      `<div class="card stack"><h3>Rubric โครงงานนวัตกรรม (100 คะแนน)</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>เกณฑ์</th><th class="num">คะแนน</th><th>4</th><th>3</th><th>2</th><th>1</th></tr></thead><tbody>${C.project.rubric.map(r => `<tr><td><b>${esc(r.c)}</b></td><td class="num">${r.pts}</td><td>${esc(r.l4)}</td><td>${esc(r.l3)}</td><td>${esc(r.l2)}</td><td>${esc(r.l1)}</td></tr>`).join('')}<tr><td><b>รวม</b></td><td class="num">100</td><td colspan="4" class="small muted">${esc(C.project.rubricNote)}</td></tr></tbody></table></div></div>`;
  }

  /* Learning Analytics (ผู้สอน) — PART 11 — ข้อมูลจำลอง */
  let laFilter = 'all';
  function pageAnalytics() {
    const R = seeded(4242), g = () => { let u = 1 - R(), v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    const WEEK = 10, EXP_MOD = 5, EXP_ASG = 5;
    const topics = ['Formative vs Summative', 'ระดับ Bloom', 'คำนวณ Blueprint', 'IOC / CVI', 'เลือกดัชนีความเที่ยง', 'r ติดลบ', 'ตัวลวง'];
    const st = Array.from({ length: 36 }, (_, i) => {
      const e = g(), a = g();
      const mods = Math.max(0, Math.min(6, Math.round(EXP_MOD + 1.1 * e)));
      const quiz = Math.max(20, Math.min(100, Math.round(74 + 11 * a + 4 * e)));
      const asg = Math.max(0, Math.min(EXP_ASG, Math.round(EXP_ASG - 0.4 + 1.1 * e)));
      const idle = Math.max(0, Math.round(3 - 3 * e + 2 * R()));
      const hrs = Math.max(1, Math.round(22 + 7 * e));
      return { id: 'ST' + String(i + 1).padStart(2, '0'), mods, quiz, asg, idle, hrs, weak: topics[Math.floor(R() * topics.length)] };
    });
    st.forEach(s => { s.flags = []; if (s.mods < EXP_MOD - 1) s.flags.push(`เรียนช้ากว่าแผน (${s.mods}/${EXP_MOD} Module)`); if (s.quiz < 60) s.flags.push(`Quiz เฉลี่ย ${s.quiz}%`); if (EXP_ASG - s.asg >= 2) s.flags.push(`ค้างส่ง ${EXP_ASG - s.asg} งาน`); if (s.idle >= 7) s.flags.push(`ไม่เข้าระบบ ${s.idle} วัน`); s.level = s.flags.length >= 2 ? 2 : s.flags.length; });
    const n2 = st.filter(s => s.level === 2).length, n1 = st.filter(s => s.level === 1).length;
    const active = st.filter(s => s.idle < 7).length;
    const modCount = MODS.map(m => st.filter(s => s.mods >= m.id).length);
    const quizBins = [[0, 49], [50, 59], [60, 69], [70, 79], [80, 89], [90, 100]].map(([a, b]) => st.filter(s => s.quiz >= a && s.quiz <= b).length);
    const weakCount = topics.map(t => st.filter(s => s.weak === t).length);
    const lab = ['ตามแผน', 'เฝ้าติดตาม', 'ควรติดต่อพูดคุย'], cls = ['good', 'warn', 'bad'];
    const rows = st.filter(s => laFilter === 'all' || String(s.level) === laFilter).sort((a, b) => b.level - a.level || a.id.localeCompare(b.id));
    bindLater(() => { const f = $('#laF'); if (f) f.onchange = () => { laFilter = f.value; render(); }; });
    return head('PART 11 · สำหรับผู้สอน', 'Learning Analytics', 'ภาพรวมชั้นเรียนเพื่อวางแผนการช่วยเหลือ ใช้หลายตัวบ่งชี้ และให้ผู้สอนตรวจสอบก่อนดำเนินการทุกครั้ง') +
      (window.PROFILE ? PROFILE.analyticsLink() : '') + `<div class="fb warn"><b>ข้อมูลจำลองเพื่อสาธิตการออกแบบ</b> (ด้านล่าง) — นักศึกษา 36 คน ณ สัปดาห์ที่ ${WEEK} (แผนกำหนดให้เรียนจบ ${EXP_MOD} Module และส่งงาน ${EXP_ASG} ชิ้น) ระบบจริงต้องดึงข้อมูลจาก LMS</div>
      <div class="kpis"><div class="kpi"><span class="l">เข้าระบบภายใน 7 วัน</span><span class="v">${active}/36</span></div><div class="kpi"><span class="l">Module เฉลี่ยที่จบ</span><span class="v">${(st.reduce((a, s) => a + s.mods, 0) / 36).toFixed(1)}</span></div><div class="kpi"><span class="l">Quiz เฉลี่ย</span><span class="v">${Math.round(st.reduce((a, s) => a + s.quiz, 0) / 36)}%</span></div><div class="kpi"><span class="l">ควรติดต่อพูดคุย</span><span class="v" style="color:var(--bad)">${n2}</span></div><div class="kpi"><span class="l">เฝ้าติดตาม</span><span class="v" style="color:var(--warn)">${n1}</span></div></div>
      <div class="grid g2" style="align-items:start"><div class="card stack"><h3>จำนวนผู้เรียนที่จบแต่ละ Module</h3>${bars({ labels: MODS.map(m => 'M' + m.id), series: [{ name: 'คน', values: modCount, color: COL.d }], max: 36, yTicks: [0, 18, 36], height: 180 })}</div>
        <div class="card stack"><h3>การกระจายคะแนน Quiz เฉลี่ย</h3>${bars({ labels: ['<50', '50s', '60s', '70s', '80s', '90+'], series: [{ name: 'คน', values: quizBins, color: COL.a }], height: 180 })}</div></div>
      <div class="card stack"><h3>แนวคิดที่ผู้เรียนผิดบ่อยที่สุด (จากคำตอบ Quiz)</h3>${bars({ labels: topics.map(t => t.length > 12 ? t.slice(0, 11) + '…' : t), series: [{ name: 'คน', values: weakCount, color: COL.g }], height: 190 })}<p class="small muted">ใช้วางแผนสอนซ่อมเสริมรายกลุ่ม และปรับกิจกรรมใน Module ที่เกี่ยวข้อง</p></div>
      <div class="card stack"><div class="section-head"><h3>รายบุคคล</h3><label class="row small" style="gap:6px">แสดง <select id="laF" style="width:auto"><option value="all" ${laFilter === 'all' ? 'selected' : ''}>ทั้งหมด</option><option value="2" ${laFilter === '2' ? 'selected' : ''}>ควรติดต่อพูดคุย</option><option value="1" ${laFilter === '1' ? 'selected' : ''}>เฝ้าติดตาม</option><option value="0" ${laFilter === '0' ? 'selected' : ''}>ตามแผน</option></select></label></div>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>รหัส</th><th>สถานะ</th><th class="num">Module</th><th class="num">Quiz</th><th class="num">ส่งงาน</th><th class="num">ไม่เข้าระบบ (วัน)</th><th class="num">ชั่วโมงเรียน</th><th>ตัวบ่งชี้ที่พบ</th></tr></thead><tbody>${rows.map(s => `<tr><td class="mono">${s.id}</td><td><span class="pill ${cls[s.level]}">${lab[s.level]}</span></td><td class="num">${s.mods}</td><td class="num">${s.quiz}%</td><td class="num">${s.asg}/${EXP_ASG}</td><td class="num">${s.idle}</td><td class="num">${s.hrs}</td><td class="small">${s.flags.join(' · ') || '–'}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card stack"><h3>กติกาการแจ้งเตือนและจริยธรรม</h3><ul class="small" style="margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px">
        <li>ตัวบ่งชี้ 4 ตัว: เรียนช้ากว่าแผน ≥ 2 Module · Quiz เฉลี่ย &lt; 60% · ค้างส่ง ≥ 2 งาน · ไม่เข้าระบบ ≥ 7 วัน</li>
        <li>พบ 1 ตัว = <b>เฝ้าติดตาม</b> · พบ ≥ 2 ตัว = <b>ควรติดต่อพูดคุย</b> (เกณฑ์ตัวอย่าง ผู้สอนปรับได้)</li>
        <li>สถานะใช้เพื่อ <b>การช่วยเหลือ</b> ไม่ใช่การตีตราหรือสรุปความสามารถจากข้อมูลด้านเดียว — ครูต้องพูดคุยเพื่อเข้าใจสาเหตุก่อนเสมอ</li>
        <li>แสดงเฉพาะผู้สอน/ผู้เกี่ยวข้อง ไม่เปิดเผยต่อชั้นเรียน เก็บเท่าที่จำเป็นตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562</li>
        <li>ติดตามผลหลังการช่วยเหลือ และทบทวนว่ากติกาเตือนผิด (false alarm) หรือพลาด (miss) บ่อยเพียงใด</li></ul></div>`;
  }

  /* ตั้งค่าธีม (Theme Settings) */
  const MODE_LABEL = { light: '☀ สว่าง', dark: '☾ มืด', system: '◐ ตามระบบ' };
  function syncThemeButtons() {
    if (!window.THEME) return;
    const m = THEME.get().mode;
    $$('[data-theme-cycle]').forEach(b => { b.textContent = b.closest('.topbar') ? MODE_LABEL[m].split(' ')[0] : MODE_LABEL[m]; b.title = 'โหมดสี: ' + MODE_LABEL[m] + ' — คลิกเพื่อสลับ'; });
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-theme-cycle]') || !window.THEME) return;
    const order = ['light', 'dark', 'system'], m = THEME.get().mode;
    THEME.set({ mode: order[(order.indexOf(m) + 1) % 3] });
    toast('โหมดสี: ' + MODE_LABEL[THEME.get().mode]);
  });
  document.addEventListener('themechange', () => { syncThemeButtons(); if (parseRoute().page === 'settings') render(); });

  function pageSettings() {
    if (!window.THEME) return head('การแสดงผล', 'ตั้งค่าธีม', 'ไม่พบระบบธีมในหน้านี้');
    const t = THEME.get(), eff = THEME.effective();
    const opt = (key, val, inner, label) => `<button class="topt" data-set="${key}" data-val="${val}" aria-pressed="${t[key] === val}">${inner}<b class="small">${label}</b></button>`;
    const mini = (bg, sf, ink, ac) => `<div class="mini" style="background:${bg}"><i style="width:70%;background:${ink}"></i><i style="width:45%;background:${ac}"></i><i style="width:85%;background:${sf}"></i></div>`;
    const modes = [['light', mini('#F3F4F7', '#D8DDE6', '#1B2230', '#AE2550'), '☀ สว่าง'], ['dark', mini('#10131A', '#2B3140', '#E6E9EF', '#EC7497'), '☾ มืด'], ['system', `<div class="mini" style="background:linear-gradient(135deg,#F3F4F7 50%,#10131A 50%)"><i style="width:70%;background:#7A8396"></i></div>`, '◐ ตามระบบ/อุปกรณ์']];
    const acc = Object.entries(THEME.accents).map(([k, a]) => opt('accent', k, `<span class="sw"><i style="background:${a.l[0]}"></i><i style="background:${a.l[1]}"></i><i style="background:${a.d[0]}"></i><i style="background:${a.d[1]}"></i></span>`, a.th)).join('');
    const sizes = [['s', 'เล็ก', 13], ['m', 'ปกติ', 15], ['l', 'ใหญ่', 17], ['xl', 'ใหญ่มาก', 19]].map(([k, l, px]) => opt('size', k, `<span style="font-size:${px}px;line-height:1.2">กขค Aa</span>`, l)).join('');
    const fonts = [['serif', 'วิชาการ (หัวเรื่อง Serif)', '"Noto Serif Thai",serif', '"IBM Plex Sans Thai",sans-serif'], ['sans', 'โมเดิร์น (Sans ทั้งหน้า)', '"IBM Plex Sans Thai",sans-serif', '"IBM Plex Sans Thai",sans-serif'], ['sarabun', 'สารบรรณ (Sarabun)', '"Sarabun",sans-serif', '"Sarabun",sans-serif']]
      .map(([k, l, d, b]) => opt('font', k, `<span style="font-family:${d};font-weight:700;font-size:1.15rem;line-height:1.3">การวัดผล</span><span class="small" style="font-family:${b}">ความตรงและความเที่ยง</span>`, l)).join('');
    const widths = [['normal', 'ปกติ (อ่านง่าย)'], ['wide', 'กว้าง (ตาราง/ข้อมูล)']].map(([k, l]) => opt('width', k, `<div class="mini" style="align-items:center"><i style="width:${k === 'wide' ? 94 : 62}%;background:var(--ink-3)"></i><i style="width:${k === 'wide' ? 94 : 62}%;background:var(--line)"></i></div>`, l)).join('');
    bindLater(() => {
      $$('[data-set]').forEach(b => b.onclick = () => THEME.set({ [b.dataset.set]: b.dataset.val }));
      $('#themeReset').onclick = () => { THEME.reset(); toast('คืนค่าธีมเริ่มต้นแล้ว'); };
    });
    return head('การแสดงผล', 'ตั้งค่าธีม (Theme)', 'ปรับโหมดสี สีหลัก ขนาดตัวอักษร แบบอักษร และความกว้างของเนื้อหา — มีผลทันทีทุกหน้า และบันทึกไว้ในเบราว์เซอร์นี้ (แยกจากข้อมูลความก้าวหน้า)') +
      `<div class="card stack"><div class="section-head"><h3>โหมดสี</h3><span class="pill">กำลังแสดง: ${eff === 'dark' ? 'มืด' : 'สว่าง'}</span></div><div class="opt-grid">${modes.map(([k, m, l]) => opt('mode', k, m, l)).join('')}</div><p class="small muted">“ตามระบบ” จะเปลี่ยนตามการตั้งค่าของอุปกรณ์อัตโนมัติ · สลับเร็วได้จากปุ่มในแถบเมนู</p></div>
      <div class="card stack"><h3>สีหลัก (Accent)</h3><div class="opt-grid">${acc}</div><p class="small muted">แต่ละสีมีคู่สีสำหรับโหมดสว่าง (สองช่องซ้าย) และโหมดมืด (สองช่องขวา) ที่ปรับความคมชัดให้อ่านง่าย · สีสถานะ (ผ่าน/เตือน/ต้องปรับ) คงเดิมเพื่อไม่ให้สับสน</p></div>
      <div class="grid g2" style="align-items:start"><div class="card stack"><h3>ขนาดตัวอักษร</h3><div class="opt-grid">${sizes}</div></div><div class="card stack"><h3>ความกว้างเนื้อหา</h3><div class="opt-grid">${widths}</div></div></div>
      <div class="card stack"><h3>แบบอักษร</h3><div class="opt-grid">${fonts}</div></div>
      <div class="card stack"><div class="section-head"><h3>ตัวอย่างการแสดงผล</h3><span class="eyebrow">Preview</span></div>
        <div class="row"><button class="btn primary">ปุ่มหลัก</button><button class="btn">ปุ่มรอง</button><span class="pill acc">CLO4 ●</span><span class="pill good">ผ่าน</span><span class="pill warn">ควรปรับ</span><span class="pill bad">r ติดลบ</span></div>
        <div class="opts" style="max-width:520px"><button class="opt right" disabled><span class="bub">ข</span><span>p = R/N คือสัดส่วนผู้ตอบถูก</span></button><button class="opt" disabled><span class="bub">ค</span><span>ตัวเลือกที่ยังไม่ได้เลือก</span></button></div>
        ${bars({ labels: ['M1', 'M2', 'M3', 'M4'], series: [{ name: 'Pre-test', values: [50, 33, 67, 33], color: COL.g }, { name: 'Quiz', values: [83, 83, 100, 67], color: COL.a }], max: 100, suffix: '%', yTicks: [0, 50, 100], height: 150 })}
        <p class="small muted">ตัวเลขในแผนภูมินี้เป็นตัวอย่างเพื่อดูสีเท่านั้น</p></div>
      <div class="row"><button class="btn" id="themeReset">คืนค่าเริ่มต้น</button><span class="small muted">ค่าเริ่มต้น: ตามระบบ · แดงกระดาษคำตอบ · ปกติ · วิชาการ · ปกติ</span></div>`;
  }

  /* expose helpers for tools.js */
  /* สรุปผลสำหรับซิงก์ไปยัง Google Sheet */
  function summary() {
    const qz = MODS.map(m => S.quiz[`m${m.id}-quiz`]).filter(q => q && q.done);
    const pre = MODS.map(m => S.quiz[`m${m.id}-pre`]).filter(q => q && q.done);
    return {
      progressPct: pct(courseProgress()), modulesDone: MODS.filter(m => status(m.id) === 'done').length,
      preAvg: pre.length ? Math.round(pre.reduce((a, q) => a + q.last, 0) / pre.length) : null,
      quizAvg: qz.length ? Math.round(qz.reduce((a, q) => a + q.best, 0) / qz.length) : null,
      submitted: C.portfolio.filter(([k]) => S.submit[k === 'Final' ? 'final' : 'm' + k.slice(1)]).length,
      minutes: Math.round(Object.values(S.time).reduce((a, b) => a + b, 0) / 60), currentModule: currentModule().id
    };
  }
  window.U = { esc, $, $$, f2, pct, toast, copy, bars, COL, save, saveSoon, st: () => S, render, summary, head, bindLater };
  /* เรียก LMA_start ครั้งถัดไป: สลับผู้ใช้/ข้อมูลโดยใช้ event เดิม */
  window.LMA_restart = o => {
    opts = o || {}; KEY = opts.storageKey || 'lma.v1'; S = loadState();
    const today = new Date().toISOString().slice(0, 10); if (!S.days.includes(today)) S.days.push(today);
    render(); syncThemeButtons();
  };
  render();
  syncThemeButtons();
};

</script>
<script>
/* ---- js/profile.js ---- */
/* โปรไฟล์ผู้เรียน (โปรไฟล์ของฉัน) และคอนโซลผู้ดูแลระบบ (Admin Console)
   - ออนไลน์: ใช้ข้อมูลจริงจาก Google Sheets ผ่าน AUTH.call
   - ออฟไลน์ (เช่น พรีวิว): โปรไฟล์เก็บในเครื่อง และ Admin แสดงเป็น “โหมดสาธิต” ด้วยข้อมูลจำลอง */
(function () {
  const U = () => window.U;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  /* online() = เข้าสู่ระบบแล้ว (โหมดใดก็ได้) · server() = เชื่อม Google Sheets (ซิงก์ข้ามอุปกรณ์ + ข้อมูล Admin จริง) */
  const online = () => !!(window.AUTH && AUTH.user());
  const server = () => !!(window.AUTH && AUTH.mode && AUTH.mode() === 'server');
  const later = fn => U().bindLater(fn);

  function pSecurity(u) {
    if (!online()) return `<div class="card stack"><h3>ความปลอดภัย</h3><p>ตั้งรหัส PIN และเปลี่ยนรหัสผ่านได้เมื่อบทเรียนเชื่อมกับฐานข้อมูล Google Sheets (ผู้สอนติดตั้งตาม README-ติดตั้ง.md) — ในโหมดออฟไลน์ไม่มีการเข้าสู่ระบบ</p><div class="pin-compact" aria-hidden="true" style="opacity:.55;pointer-events:none">${AUTH.ui.keypadHTML('demoPad', 'ตัวอย่างแป้นตั้งรหัส PIN')}</div></div>`;

      });

        if (!r.ok) return warn(r.message);
        const had = u.hasPin; AUTH.setUser(r.user); P.msg = ['ok', had ? 'เปลี่ยนรหัส PIN เรียบร้อย' : 'ตั้งรหัส PIN เรียบร้อย — ครั้งหน้าเข้าสู่ระบบด้วย PIN ได้ทุกอุปกรณ์']; U().render();
      };
      const rm1 = $('#pinRemove1');
      if (rm1) {
        rm1.onclick = () => { rm1.hidden = true; $('#pinRemoveBox').hidden = false; $('#rmPw').focus(); };
        $('#pinRemove2').onclick = async e => { const b = e.currentTarget; ui.busy(b, true); const r = await AUTH.call('removePin', { password: $('#rmPw').value }); ui.busy(b, false, 'ยืนยันลบรหัส PIN'); if (!r.ok) { P.msg = ['no', r.message]; return U().render(); } AUTH.setUser(r.user); P.msg = ['ok', 'ลบรหัส PIN แล้ว — เข้าสู่ระบบด้วยรหัสผ่านเท่านั้น']; U().render(); };
      }
      const f = $('#fPw');
      f.onsubmit = async e => {
        e.preventDefault(); const b = f.querySelector('button[type=submit]'), mm = f.querySelector('[data-msg]');
        const out = (t, k) => { mm.hidden = !t; mm.className = 'fb ' + (k || 'no'); mm.textContent = t; };
        const p = ui.passwordProblem(f.pNew.value, u.studentId); if (p) return out(p);
        if (f.pNew.value !== f.pNew2.value) return out('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน');
        ui.busy(b, true); const r = await AUTH.call('changePassword', { oldPassword: f.pOld.value, newPassword: f.pNew.value }); ui.busy(b, false, 'เปลี่ยนรหัสผ่าน');
        if (!r.ok) return out(r.message);
        AUTH.setUser(r.user); f.reset(); out('เปลี่ยนรหัสผ่านเรียบร้อย และออกจากระบบในอุปกรณ์อื่นแล้ว', 'ok');
      };
    });
    return `<section class="card stack" id="security"><div class="stack" style="gap:2px"><span class="eyebrow">โปรไฟล์ของฉัน › ความปลอดภัย</span><h2>ความปลอดภัย</h2></div>
      <div class="grid g2" style="align-items:start">
        <div class="stack"><div class="row"><h3>รหัส PIN</h3>${u.hasPin ? '<span class="pill good">ตั้งแล้ว</span>' : '<span class="pill warn">ยังไม่ได้ตั้ง</span>'}</div>
          <p class="small muted">${u.hasPin ? 'กดรหัสใหม่ 6 หลักเพื่อเปลี่ยน PIN' : 'ตั้งรหัส PIN 6 หลัก เพื่อเข้าสู่ระบบด้วยแป้นตัวเลขได้เร็วขึ้นทุกอุปกรณ์'} · ห้ามเลขซ้ำทั้งหมดหรือเลขเรียง · อย่าใช้วันเกิด</p>
          <div class="pin-compact">${ui.keypadHTML('secPin', 'กรอกรหัส PIN ใหม่ 6 หลัก')}</div><div id="pinStep" hidden></div>
          <div id="pinConfirm" class="stack" hidden>${ui.pwInput('pinPw', 'ยืนยันด้วยรหัสผ่านปัจจุบัน', 'current-password')}<div class="row"><button type="button" class="btn primary" id="pinSave">บันทึกรหัส PIN</button><button type="button" class="btn ghost" id="pinRestart">เริ่มกรอกใหม่</button></div></div>
          ${u.hasPin ? `<button type="button" class="btn sm" id="pinRemove1" style="align-self:flex-start">ลบรหัส PIN</button><div id="pinRemoveBox" class="stack" hidden>${ui.pwInput('rmPw', 'ยืนยันด้วยรหัสผ่านปัจจุบัน', 'current-password')}<button type="button" class="btn sm" id="pinRemove2" style="align-self:flex-start;border-color:var(--bad);color:var(--bad)">ยืนยันลบรหัส PIN</button></div>` : ''}</div>
        <form id="fPw" class="stack" novalidate><h3>เปลี่ยนรหัสผ่าน</h3>${ui.pwInput('pOld', 'รหัสผ่านปัจจุบัน', 'current-password')}${ui.pwInput('pNew', 'รหัสผ่านใหม่', 'new-password')}${ui.pwInput('pNew2', 'ยืนยันรหัสผ่านใหม่', 'new-password')}
          <p class="small muted">อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข · เปลี่ยนแล้วอุปกรณ์อื่นจะออกจากระบบ</p><div data-msg hidden role="alert"></div><button type="submit" class="btn primary" style="align-self:flex-start">เปลี่ยนรหัสผ่าน</button></form></div>
      <ul class="small muted" style="margin:0;padding-left:1.2rem"><li>ใส่รหัส PIN ผิด 5 ครั้ง การเข้าด้วย PIN จะถูกล็อก 15 นาที (ยังเข้าด้วยรหัสผ่านได้) · รหัสผ่านผิด 5 ครั้ง บัญชีถูกล็อก 15 นาที</li><li>เข้าสู่ระบบล่าสุด: ${fmt(u.lastLogin)} ${methodTh(u.lastMethod)} — ถ้าไม่ใช่คุณ ให้เปลี่ยนรหัสผ่านทันทีและแจ้งผู้สอน</li><li>ใช้คอมพิวเตอร์ร่วมกับผู้อื่น ให้ “ออกจากระบบ” และ “ลืมชื่อผู้ใช้ที่จำไว้” ทุกครั้ง</li></ul></section>`;
  }

  /* ══════════════ ผู้ดูแลระบบ (Admin Console) ══════════════ */
  const A = { overview: null, users: null, log: null, settings: null, schema: null, files: null, loading: {}, sel: null, q: '', role: '', status: '', section: '', msg: null, temp: null, logQ: '', logAct: '' };

    if (A[key] || A.loading[key]) return;
    A.loading[key] = true;
    api(action, payload || {}).then(r => { A.loading[key] = false; A[key] = r; U().render(); });
  }
  const refresh = () => { ['overview', 'users', 'log', 'settings', 'schema', 'files'].forEach(k => (A[k] = null)); U().render(); };
  const errBox = r => r && !r.ok ? `<div class="fb no">${esc(r.message)}</div>` : '';

  function adminPage(sub) {
    if (!isStaff()) return U().head('ผู้ดูแลระบบ', 'ไม่มีสิทธิ์เข้าถึง', 'หน้านี้สำหรับผู้สอนและผู้ดูแลระบบเท่านั้น');
    const T = [['', 'ภาพรวม'], ['users', 'จัดการผู้ใช้'], ['progress', 'ความก้าวหน้า'], ['log', 'บันทึกกิจกรรม'], ['files', 'ไฟล์งาน'], ['settings', 'ตั้งค่าระบบ']];
    if (!T.some(t => t[0] === sub)) sub = '';
    const who = server() ? AUTH.user() : demoDB().users[0];
    later(() => { const b = $('#admRefresh'); if (b) b.onclick = refresh; });

    return `<section class="card prof-head adm">${avatar(who, 56)}<div class="stack" style="gap:4px;min-width:0"><span class="eyebrow">ผู้ดูแลระบบ · Admin Console</span><h1 style="font-size:1.5rem">จัดการระบบบทเรียน</h1><div class="row" style="gap:6px"><span class="small">${esc(who.name)}</span>${rolePill(who.role)}${server() ? '<span class="pill data">ข้อมูลจริง · Google Sheets</span>' : '<span class="pill warn">โหมดสาธิต · ข้อมูลจำลอง ไม่บันทึกจริง</span>'}</div></div>
      <div class="prof-actions"><button class="btn sm" id="admRefresh">โหลดข้อมูลใหม่</button></div></section>` + tabs('admin', T, sub) +
      (m ? `<div class="fb ${m[0]}" role="status">${m[1]}</div>` : '') + { '': aOverview, users: aUsers, progress: aProgress, log: aLog, files: aFiles, settings: aSettings }[sub]();

  function aOverview() {
    load('overview', 'adminOverview');
    const o = A.overview; if (!o) return '<p class="muted">กำลังโหลด…</p>'; if (!o.ok) return errBox(o);
    const d = s => new Date(s).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

  /* ผลงานของฉัน › แนบไฟล์งาน (ผู้เรียน) */
  const F = { list: null, loading: false, msg: null };

<script>

/* ระบบสมาชิก: เข้าสู่ระบบด้วยรหัส PIN (แป้นตัวเลข) หรือรหัสผ่าน · สมัครสมาชิก · โปรไฟล์ของฉัน › ความปลอดภัย
   · ซิงก์ความก้าวหน้ากับ Google Sheets ผ่าน Google Apps Script */
(function () {
  const CFG = window.LMA_CONFIG || {};
  const SKEY = 'lma.session', UKEY = 'lma.lastUser', AKEY = 'lma.lastAdmin';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  const hasGAS = () => typeof google !== 'undefined' && google.script && google.script.run;
  const online = () => !!(hasGAS() || CFG.apiUrl);
  /* ที่เก็บในเครื่อง + สำรองในหน่วยความจำ — บางเบราว์เซอร์ปิด localStorage ในหน้าฝัง (เช่น Safari/iOS ใน Apps Script) หรือโหมดส่วนตัว */
  const storageOK = (() => { try { const k = '__lma_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
  const mem = {};
  const ls = {
    get: k => { if (storageOK) { try { return localStorage.getItem(k); } catch (e) {} } return k in mem ? mem[k] : null; },
    set: (k, v) => { mem[k] = v; if (storageOK) { try { localStorage.setItem(k, v); } catch (e) {} } },
    del: k => { delete mem[k]; if (storageOK) { try { localStorage.removeItem(k); } catch (e) {} } }
  };
  /* แปลงเลขไทย ๐–๙ เป็นเลขอารบิก และตัดช่องว่าง (ชื่อผู้ใช้/รหัส) */
  /* ชื่ออุปกรณ์แบบย่อ (บันทึกในชีต Sessions.device เพื่อให้ผู้ใช้/ผู้สอนตรวจการเข้าใช้) */
  const deviceName = () => { const u = navigator.userAgent || ''; const os = /iPhone|iPad/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'macOS' : /Linux/.test(u) ? 'Linux' : 'อื่น ๆ'; const br = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Browser'; return br + ' · ' + os + (/Mobi/.test(u) ? ' (มือถือ)' : ''); };
  const normDigits = s => String(s || '').replace(/[๐-๙]/g, c => String(c.charCodeAt(0) - 0x0E50)).trim();

  let token = null, user = null, sessionExp = 0, storageKey = 'lma.v1', classCode = false, started = false, adminEntry = false;
  const sync = { state: 'idle', at: 0, msg: '', dirty: false };


  /* ── โหมด: 'server' = Google Sheets (ใช้ข้ามอุปกรณ์) · 'local' = บัญชีเก็บในเบราว์เซอร์นี้ (ยังไม่เชื่อมฐานข้อมูล) ── */
  const mode = () => (online() ? 'server' : 'local');

      let [a, bb, c, d, e, f, g, h] = H;
      for (let t = 0; t < 64; t++) {
