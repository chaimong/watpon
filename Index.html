  ['นักเรียนเสิร์ฟลูกได้แม่นยำและคล่องแคล่วโดยอัตโนมัติในการแข่งขันจริง โดยไม่ต้องคิดทีละขั้น พฤติกรรมนี้ตรงกับระดับใดตามแนวของ Dave', 'Naturalization', ['Imitation', 'Manipulation', 'Precision', 'Guided Response'], 'การปฏิบัติได้อย่างเป็นธรรมชาติและอัตโนมัติคือระดับสูงสุดในแนวของ Dave'],
  ['ครูต้องการเขียน LO ด้านจิตพิสัยเรื่อง “การทำงานเป็นทีม” ให้วัดได้ ข้อใดเหมาะสมที่สุด', 'อาสารับผิดชอบงานกลุ่มและช่วยเพื่อนโดยไม่ต้องสั่ง', ['มีจิตสำนึกที่ดีในการทำงานร่วมกับผู้อื่นเสมอ', 'ตระหนักถึงความสำคัญของการทำงานเป็นทีมอย่างยิ่ง', 'รู้สึกซาบซึ้งในคุณค่าของความสามัคคีในห้องเรียน', 'เข้าใจหลักการทำงานเป็นทีมอย่างลึกซึ้งถ่องแท้'], 'LO จิตพิสัยต้องระบุพฤติกรรมบ่งชี้ที่สังเกตได้'],
  ['ครูต้องจัด LO “นำเสนอข้อมูลด้วยแผนภูมิที่ถูกต้องและอ่านง่าย โดยสร้างด้วยโปรแกรมตามขั้นตอนอย่างคล่องแคล่ว” เข้าด้านหลักใดที่เหมาะสมที่สุด', 'ทักษะพิสัย ร่วมกับพุทธิพิสัย', ['จิตพิสัยเพียงด้านเดียว', 'พุทธิพิสัยเพียงด้านเดียว', 'ไม่จัดอยู่ในด้านใดเลย', 'จิตพิสัยร่วมกับอภิปัญญา'], 'การลงมือสร้างแผนภูมิอย่างคล่องแคล่วเป็นทักษะ และการเลือกแผนภูมิให้ถูกต้องต้องใช้ความรู้'],
  ['นักศึกษาวาง LO 6 ข้อของหน่วยการเรียนรู้ พบว่าทั้งหมดใช้คำว่า บอก ระบุ ทวน ข้อเสนอแนะใดสำคัญที่สุด', 'กระจายระดับพฤติกรรมให้ตรงเป้าหมาย', ['เพิ่มจำนวน LO ระดับจำให้มากกว่าเดิม', 'เปลี่ยนคำว่าบอกเป็นคำว่ารู้ทุกข้อ', 'ตัด LO ทั้งหมดแล้วใช้หัวข้อเนื้อหาแทน', 'เพิ่มเกณฑ์ร้อยละ 100 ให้ทุก LO'], 'LO ที่กระจุกระดับจำทำให้การสอนและการประเมินไม่ครอบคลุมการคิดระดับสูง'],
  ['LO “นักเรียนมีความรู้เรื่องระบบสุริยะ” ควรเขียนใหม่ข้อใดจึงเหมาะที่สุด', 'เรียงดาวเคราะห์ตามระยะห่างจากดวงอาทิตย์ได้', ['มีความรู้ความเข้าใจเรื่องระบบสุริยะอย่างครบถ้วน', 'ตระหนักถึงความยิ่งใหญ่ของระบบสุริยะในจักรวาล', 'รู้จักระบบสุริยะดีขึ้นกว่าก่อนเรียนอย่างชัดเจน', 'สนใจเรื่องระบบสุริยะมากขึ้นหลังเรียนจบหน่วย'], 'LO ที่ดีระบุพฤติกรรมที่สังเกตได้และบริบทเนื้อหาชัดเจน'],
  ['ใน Learning Outcome Matrix นักศึกษาต้องกรอกคอลัมน์ “หลักฐานการเรียนรู้” ของ LO “ออกแบบแผนการทดลอง” ข้อใดเหมาะสมที่สุด', 'แผนทดลองที่เขียนเองพร้อม Rubric', ['ข้อสอบถูก–ผิดเรื่องขั้นตอนการทดลอง', 'แบบสอบถามความพึงพอใจต่อการทดลอง', 'จำนวนครั้งที่เข้าห้องปฏิบัติการ', 'คะแนนสอบกลางภาควิชาวิทยาศาสตร์'], 'LO ระดับ Create ต้องมีผลงานที่ผู้เรียนสร้างเป็นหลักฐาน'],
  ['หลักสูตรกำหนด CLO ว่า “ประเมินคุณภาพเครื่องมือวัดได้” แต่ LLO ทุกข้อในบทเรียนเป็นเรื่องการท่องนิยาม ปัญหาที่เกิดขึ้นคือข้อใด', 'LLO ไม่สนับสนุน CLO ที่ต้องการระดับสูงกว่า', ['LLO มีจำนวนมากเกินกว่าที่หลักสูตรกำหนด', 'CLO เขียนด้วยคำกริยาที่วัดไม่ได้เลย', 'บทเรียนใช้เวลาสอนน้อยเกินไปเล็กน้อย', 'ไม่มีปัญหา เพราะนิยามเป็นพื้นฐานที่ดี'], 'ผลลัพธ์ระดับบทเรียนต้องพาผู้เรียนไปสู่ระดับพฤติกรรมของ CLO'],
  ['ครูใช้ Revised Bloom’s Taxonomy แบบสองมิติ วาง LO “วิเคราะห์ค่าอำนาจจำแนกเพื่อระบุข้อสอบที่ต้องปรับ” ลงตาราง ตำแหน่งใดเหมาะสมที่สุด', 'Analyze × Procedural', ['Remember × Factual', 'Understand × Conceptual', 'Create × Metacognitive', 'Apply × Factual'], 'เป็นการวิเคราะห์ (กระบวนการ) โดยใช้ความรู้เชิงวิธีการคำนวณและอ่านค่า']
]);

/* ───────── MODULE 3 : การออกแบบการประเมินการเรียนรู้ ───────── */
QB(3, [
  ['รายวิชามี CLO “ออกแบบกิจกรรมการเรียนรู้เชิงรุก” แต่คะแนนร้อยละ 70 มาจากข้อสอบปรนัยถามนิยามศัพท์ ปัญหาหลักคือข้อใด', 'การประเมินไม่สอดคล้องกับ CLO', ['ข้อสอบปรนัยมีจำนวนข้อน้อยไป', 'CLO เขียนด้วยคำกริยาวัดไม่ได้', 'คะแนนรวมของรายวิชาไม่ครบร้อย', 'ข้อสอบปรนัยตรวจให้คะแนนยาก'], 'LO ระดับ “ออกแบบ” ต้องใช้หลักฐานเป็นผลงานการออกแบบ ไม่ใช่การจำนิยาม'],
  ['ครูพบว่า CLO ข้อหนึ่งไม่มีงานหรือข้อสอบใดประเมินเลยตลอดภาคเรียน ผลกระทบสำคัญที่สุดคือข้อใด', 'ไม่มีหลักฐานว่าผู้เรียนบรรลุ CLO นั้น', ['คะแนนรวมของรายวิชาจะเกินร้อยคะแนน', 'ข้อสอบปลายภาคจะยากเกินไปสำหรับผู้เรียน', 'ความเที่ยงของแบบทดสอบจะสูงเกินจริง', 'ผู้เรียนจะได้คะแนนสูงกว่าที่ควรได้รับ'], 'Constructive Alignment กำหนดให้ทุก CLO ต้องมีหลักฐานการประเมิน'],
  ['ตามแนวคิด Constructive Alignment ของ Biggs (1996) องค์ประกอบใดบ้างที่ต้องสอดคล้องกัน', 'ผลลัพธ์การเรียนรู้ กิจกรรม และการประเมิน', ['ครูผู้สอน ผู้เรียน และผู้ปกครองของผู้เรียน', 'เวลาเรียน งบประมาณ และสถานที่จัดการเรียน', 'ข้อสอบ เฉลย และเกณฑ์ตัดเกรดของรายวิชา', 'หนังสือเรียน สื่อ และเทคโนโลยีการสอน'], 'ILO, Teaching–Learning Activities และ Assessment Tasks ต้องชี้ไปทางเดียวกัน'],
  ['LO “ใช้กล้องจุลทรรศน์ปรับภาพได้ถูกต้องตามขั้นตอน” ควรประเมินด้วยวิธีใดจึงได้หลักฐานตรงที่สุด', 'สังเกตการปฏิบัติจริงพร้อม Checklist', ['ข้อสอบถูก–ผิดเรื่องส่วนประกอบกล้อง', 'ข้อสอบจับคู่ชื่อและหน้าที่ของกล้อง', 'แบบสอบถามความพึงพอใจต่อการทดลอง', 'รายงานสรุปการทดลองแบบเขียนบรรยาย'], 'ทักษะการปฏิบัติต้องเห็นการกระทำจริง'],
  ['LO “ให้เหตุผลสนับสนุนข้อสรุปจากข้อมูลการทดลอง” ควรเลือกวิธีประเมินใดเป็นหลัก', 'ข้อเขียนให้เหตุผลพร้อม Rubric', ['ข้อสอบจับคู่คำศัพท์กับความหมาย', 'ข้อสอบถูก–ผิดเรื่องขั้นตอนทดลอง', 'การนับจำนวนครั้งที่ส่งการบ้าน', 'แบบสอบถามเจตคติต่อวิทยาศาสตร์'], 'การให้เหตุผลต้องเห็นกระบวนการคิดที่ผู้เรียนเขียนอธิบาย'],
  ['LO “ระบุส่วนประกอบของเซลล์พืชได้” และต้องประเมินนักเรียน 200 คนอย่างมีประสิทธิภาพ วิธีใดเหมาะสมที่สุด', 'ข้อสอบเลือกตอบหรือจับคู่', ['โครงงานกลุ่มระยะยาวสี่สัปดาห์', 'การสัมภาษณ์รายบุคคลทุกคน', 'แฟ้มสะสมผลงานตลอดภาคเรียน', 'การสังเกตพฤติกรรมในห้องทดลอง'], 'ความรู้ข้อเท็จจริงวัดได้อย่างมีประสิทธิภาพด้วยข้อสอบแบบเลือกตอบ'],
  ['ครูต้องการหลักฐานพัฒนาการเขียนเรียงความของนักเรียนตลอดภาคเรียน วิธีใดเหมาะสมที่สุด', 'Portfolio พร้อมการสะท้อนคิดและ Rubric', ['สอบเขียนเรียงความครั้งเดียวปลายภาค', 'ข้อสอบเลือกตอบเรื่องหลักการเขียน', 'แบบสอบถามความชอบการเขียนของนักเรียน', 'การนับจำนวนคำในเรียงความแต่ละชิ้น'], 'พัฒนาการต้องมีหลักฐานหลายชิ้นตามเวลา'],
  ['ในการสร้าง Test Blueprint ครูควรกำหนดน้ำหนักของแต่ละเนื้อหาจากข้อใดเป็นหลัก', 'ความสำคัญตาม LO และเวลาที่ใช้สอน', ['ความง่ายในการออกข้อสอบของเนื้อหา', 'จำนวนหน้าในหนังสือเรียนเพียงอย่างเดียว', 'ความชอบส่วนตัวของครูผู้ออกข้อสอบ', 'จำนวนข้อสอบเก่าที่มีอยู่ในคลัง'], 'น้ำหนักควรสะท้อนความสำคัญของเป้าหมายและเวลาเรียน'],
  ['เนื้อหา A มีน้ำหนักร้อยละ 30 พฤติกรรมระดับ Apply มีน้ำหนักร้อยละ 40 และข้อสอบทั้งฉบับมี 50 ข้อ ช่อง A × Apply ควรมีกี่ข้อ', '6 ข้อ', ['12 ข้อ', '15 ข้อ', '20 ข้อ', '8 ข้อ'], '0.30 × 0.40 × 50 = 6 ข้อ'],
  ['ข้อสอบ 40 ข้อ เนื้อหา B มีน้ำหนักร้อยละ 25 จะต้องมีข้อสอบของเนื้อหา B รวมทุกระดับพฤติกรรมกี่ข้อ', '10 ข้อ', ['25 ข้อ', '8 ข้อ', '15 ข้อ', '12 ข้อ'], '0.25 × 40 = 10 ข้อ'],
  ['ครูคำนวณ Blueprint แล้วได้ผลรวมหลังปัดเศษเป็น 31 ข้อ ทั้งที่ต้องการ 30 ข้อ วิธีปรับที่เหมาะสมที่สุดคือข้อใด', 'ลดช่องที่ปัดขึ้นจากเศษน้อยที่สุดลงหนึ่งข้อ', ['เพิ่มจำนวนข้อสอบทั้งฉบับเป็น 31 ข้อ', 'ตัดเนื้อหาที่มีน้ำหนักน้อยที่สุดออกทั้งหมด', 'ลดข้อสอบระดับ Create ลงทุกช่องที่มีอยู่', 'สุ่มตัดข้อสอบออกหนึ่งข้อจากช่องใดก็ได้'], 'การปรับเศษอย่างเป็นระบบทำให้สัดส่วนยังใกล้เคียงน้ำหนักที่กำหนดมากที่สุด'],
  ['ครูวิทยาศาสตร์ใช้เวลาสอนเรื่องการแยกสารร้อยละ 40 แต่ข้อสอบ 30 ข้อมีเรื่องการแยกสารเพียง 3 ข้อ ปัญหานี้กระทบคุณภาพด้านใดมากที่สุด', 'ความตรงเชิงเนื้อหา', ['ความเที่ยงระหว่างผู้ตรวจ', 'ค่าความยากของข้อสอบ', 'ความเป็นปรนัยของการตรวจ', 'ความสะดวกในการจัดสอบ'], 'ข้อสอบไม่เป็นตัวแทนเนื้อหาที่สอน จึงกระทบความตรงเชิงเนื้อหา'],
  ['ข้อสอบ 30 ข้อของครูมี 25 ข้อวัดระดับจำ ทั้งที่ LO ของหน่วยเน้นการประยุกต์และวิเคราะห์ ครูควรแก้ไขอย่างไร', 'ปรับ Blueprint ตาม LO และเขียนใหม่', ['ตัดข้อสอบระดับจำออกทั้งหมดทันที', 'เพิ่มเวลาสอบให้มากขึ้นเป็นสองเท่าของเดิม', 'เปลี่ยนเกณฑ์ผ่านให้สูงขึ้นกว่าเดิม', 'ใช้ข้อสอบเดิมแต่เพิ่มคะแนนข้อยาก'], 'สัดส่วนระดับพฤติกรรมในข้อสอบต้องสอดคล้องกับ LO'],
  ['ครูกำหนดคะแนนสอบปลายภาคร้อยละ 80 ในรายวิชาที่เน้นทักษะปฏิบัติ ความเสี่ยงสำคัญของการออกแบบนี้คือข้อใด', 'ไม่สอดคล้อง LO และพึ่งหลักฐานชิ้นเดียวมากเกิน', ['ผู้เรียนจะได้คะแนนสูงกว่าความสามารถจริงมากเกินไป', 'ข้อสอบปลายภาคจะง่ายเกินไปสำหรับผู้เรียน', 'ครูไม่ต้องสร้าง Rubric สำหรับงานปฏิบัติ', 'คะแนนรวมของรายวิชาจะไม่ครบร้อยคะแนน'], 'ทั้งปัญหาความสอดคล้องและความเสี่ยงจากความคลาดเคลื่อนของการวัดครั้งเดียว'],

  ['ข้อสอบจับคู่ของครูมีคอลัมน์หนึ่งปนกันทั้งชื่อบุคคล ปี พ.ศ. และชื่อสถานที่ นักเรียนเดาถูกง่าย ครูควรปรับอย่างไร', 'ให้รายการแต่ละชุดเป็นเรื่องเดียวกัน', ['เพิ่มจำนวนคู่ให้มากกว่ายี่สิบคู่', 'เรียงตัวเลือกตามความยาวของข้อความ', 'แยกข้อสอบไปไว้คนละหน้ากระดาษ', 'ให้คะแนนข้อจับคู่มากกว่าข้ออื่น'], 'รายการที่เป็นเนื้อเดียวกัน (homogeneous) ลดการเดาจากประเภทคำ'],
  ['ครูออกข้อสอบจับคู่ 6 คำถามกับ 6 คำตอบใช้ครั้งเดียว นักเรียนตอบข้อสุดท้ายถูกได้จากการตัดทิ้ง ครูควรปรับอย่างไร', 'ให้ตัวเลือกมากกว่าคำถามหรือใช้ซ้ำได้', ['ลดคำถามเหลือสามข้อเพื่อความง่าย', 'เพิ่มคะแนนข้อสุดท้ายเป็นสองเท่า', 'เรียงคำตอบให้ตรงกับลำดับคำถาม', 'ให้นักเรียนทำข้อนี้เป็นข้อแรก'], 'จำนวนตัวเลือกที่มากกว่าคำถามลดการตอบจากการตัดทิ้ง'],
  ['ครูเขียนข้อสอบเติมคำว่า “___ เป็นดัชนีที่ ___ ใช้ตรวจ ___” นักเรียนตอบกระจายมากจนตรวจไม่ได้ ข้อบกพร่องหลักคือข้อใด', 'เว้นช่องว่างมากจนไม่มีคำตอบที่ชัดเจน', ['ใช้คำถามที่สั้นเกินไปสำหรับระดับชั้น', 'ไม่ได้ระบุคะแนนของแต่ละช่องว่าง', 'ใช้ศัพท์เฉพาะทางที่ยังไม่ได้สอน', 'วางช่องว่างไว้ท้ายประโยคทุกช่อง'], 'ข้อสอบเติมคำควรมีช่องว่างน้อยและคำตอบที่ถูกชัดเจน'],
  ['ครูกำลังเตรียมข้อสอบอัตนัย แนวปฏิบัติใดช่วยให้การให้คะแนนมีความคงที่มากที่สุด', 'เตรียมเกณฑ์ก่อน ตรวจทีละข้อ และปิดชื่อ', ['อ่านทั้งฉบับของแต่ละคนก่อนให้คะแนน', 'ให้คะแนนตามความประทับใจภาพรวม', 'ให้คะแนนตามความยาวของคำตอบ', 'ตรวจฉบับของนักเรียนเก่งเป็นอันดับแรก'], 'เกณฑ์ล่วงหน้า การตรวจทีละข้อ และการปิดชื่อช่วยลดอคติและ halo effect'],
  ['ครูให้นักเรียนเลือกทำข้อสอบอัตนัย 3 ข้อจาก 6 ข้อ ปัญหาสำคัญที่สุดในการแปลผลคือข้อใด', 'นักเรียนทำข้อต่างกันจึงเทียบคะแนนได้ยาก', ['นักเรียนต้องใช้เวลาสอบนานกว่าเดิมมาก', 'ครูต้องออกข้อสอบจำนวนมากขึ้นเท่านั้น', 'ข้อสอบอัตนัยไม่ควรมีมากกว่าสามข้อ', 'นักเรียนจะได้คะแนนต่ำกว่าปกติทุกคน'], 'ข้อสอบคนละชุดมีความยากต่างกัน ทำให้คะแนนเปรียบเทียบกันไม่ได้โดยตรง'],
  ['ครูต้องการใช้ข้อสอบเลือกตอบวัดการคิดวิเคราะห์ วิธีใดเหมาะสมที่สุด', 'ให้สถานการณ์หรือข้อมูลใหม่แล้วถามการตัดสินใจ', ['ถามนิยามศัพท์ที่อยู่ในหนังสือเรียนตรงตัว', 'เพิ่มจำนวนตัวเลือกเป็นสิบตัวเลือกต่อข้อ', 'ใช้ตัวเลือก “ถูกทุกข้อ” ในทุกข้อสอบ', 'เขียนตัวคำถามให้ยาวกว่าสามบรรทัดเสมอทุกข้อ'], 'ข้อสอบแบบสถานการณ์หรือชุดข้อมูลช่วยวัดการคิดระดับสูงได้'],
  ['ครูต้องบันทึกว่านักเรียนทำครบ 6 ขั้นตอนความปลอดภัยในห้องปฏิบัติการหรือไม่ เครื่องมือใดเหมาะสมที่สุด', 'Checklist', ['Rating Scale', 'Questionnaire', 'Essay Test', 'Portfolio'], 'Checklist ใช้บันทึกการปรากฏหรือไม่ปรากฏของพฤติกรรม'],
  ['ครูต้องการบันทึกว่านักเรียนมีส่วนร่วมในการอภิปราย “มาก ปานกลาง น้อย” ในแต่ละคาบ เครื่องมือใดเหมาะสมที่สุด', 'Rating Scale', ['Checklist', 'Matching Test', 'True–False', 'Short Answer'], 'Rating Scale ใช้บันทึกระดับหรือความถี่ของพฤติกรรม'],

  ['แบบสอบถามมีข้อความว่า “ครูสอนสนุกและให้การบ้านเหมาะสม” ผู้ตอบบางคนเห็นด้วยเพียงครึ่งเดียว ข้อบกพร่องนี้คือข้อใด', 'ถามสองประเด็นในข้อเดียว', ['ใช้ภาษาที่เป็นทางการเกินไป', 'ใช้มาตรประมาณค่าห้าระดับ', 'ข้อความสั้นเกินกว่าที่ควร', 'ไม่มีข้อความทางลบในชุดนี้'], 'ข้อความ double-barreled ทำให้ตีความคำตอบไม่ได้'],
  ['แบบสอบถามถามว่า “ท่านเห็นด้วยหรือไม่ว่ากิจกรรมที่ยอดเยี่ยมนี้ช่วยพัฒนานักเรียน” ผลเฉลี่ยสูงมาก ครูควรตีความอย่างไร', 'ระวัง ข้อความเป็นคำถามนำ ผลอาจสูงเกินจริง', ['เชื่อได้ทันที เพราะค่าเฉลี่ยสูงทุกข้อ', 'แสดงว่ากิจกรรมมีคุณภาพดีเยี่ยมจริง', 'แสดงว่าแบบสอบถามมีความเที่ยงและความตรงสูง', 'ต้องเพิ่มจำนวนผู้ตอบให้มากขึ้นเท่านั้น'], 'คำนำอย่าง “ยอดเยี่ยม” ชี้นำคำตอบ ทำให้ผลสูงกว่าความเป็นจริง'],
  ['ครูต้องการทราบเหตุผลเบื้องหลังการตัดสินใจเลือกวิธีแก้โจทย์ของนักเรียนแต่ละคนอย่างลึกซึ้ง เครื่องมือใดเหมาะสมที่สุด', 'สัมภาษณ์ด้วยแนวคำถามกึ่งโครงสร้าง', ['แบบทดสอบเลือกตอบสี่ตัวเลือก', 'แบบตรวจสอบรายการทำหรือไม่ทำ', 'แบบสอบถามมาตรประมาณค่าห้าระดับ', 'ข้อสอบจับคู่คำศัพท์กับความหมาย'], 'การสัมภาษณ์ช่วยเข้าถึงความคิดและเหตุผลของผู้เรียน'],
  ['ครูสังเกตพฤติกรรม “การทำงานร่วมกัน” โดยไม่กำหนดล่วงหน้าว่าจะดูอะไร ผลบันทึกของครูสองคนจึงต่างกันมาก ควรแก้ไขอย่างไร', 'กำหนดพฤติกรรมบ่งชี้และวิธีบันทึกล่วงหน้า', ['ให้ครูคนเดียวสังเกตนักเรียนทุกคน', 'เพิ่มเวลาสังเกตเป็นสองเท่าของเดิมทุกคาบ', 'ให้นักเรียนสังเกตตนเองแทนครู', 'เปลี่ยนเป็นข้อสอบเลือกตอบแทน'], 'การสังเกตที่มีคุณภาพต้องมีพฤติกรรมบ่งชี้และวิธีบันทึกที่ชัดเจน'],
  ['ครูมอบงาน “ออกแบบแผนประหยัดพลังงานในบ้าน” พร้อมเงื่อนไขและเกณฑ์การประเมิน องค์ประกอบใดที่ทำให้งานนี้เป็น Performance Assessment', 'ภาระงานให้ลงมือทำพร้อมเกณฑ์ชัดเจน', ['ใช้คำถามแบบเลือกตอบในการวัด', 'ให้คะแนนตามความยาวของรายงาน', 'ประเมินจากความพึงพอใจของผู้ปกครอง', 'ทำเสร็จภายในห้านาทีในห้องเรียน'], 'Performance Assessment ประกอบด้วยภาระงานที่ต้องปฏิบัติและเกณฑ์ประเมิน'],
  ['ครูให้นักเรียนเก็บงานทุกชิ้นลงแฟ้มโดยไม่มีเกณฑ์คัดเลือกและไม่มีการสะท้อนคิด ข้อวิจารณ์ใดถูกต้องที่สุด', 'ยังไม่ใช่ Portfolio ที่สมบูรณ์', ['เป็น Portfolio ที่สมบูรณ์เพราะงานครบ', 'เป็น Checklist รูปแบบหนึ่งอยู่แล้ว', 'เป็น Rating Scale แบบใหม่ที่ดีกว่า', 'เป็นการประเมินอิงกลุ่มที่เหมาะสม'], 'Portfolio ต้องมีจุดประสงค์ เกณฑ์คัดเลือกชิ้นงาน และการสะท้อนคิด'],
  ['ครูเขียนข้อสอบภาษาอังกฤษว่า “An ___ is a tool for scoring” ตัวเลือกมี rubric, checklist, test, scale ข้อบกพร่องคือข้อใด', 'คำว่า an บอกใบ้ตัวเลือกขึ้นต้นสระ', ['ตัวเลือกทั้งหมดเป็นคำนามภาษาอังกฤษ', 'ตัวคำถามสั้นเกินกว่าที่ควรจะเป็น', 'ใช้ภาษาอังกฤษแทนภาษาไทยในข้อสอบ', 'ไม่มีตัวเลือกไม่มีข้อใดถูกให้เลือก'], 'คำใบ้ทางไวยากรณ์ทำให้ตัดตัวเลือกได้โดยไม่ต้องรู้เนื้อหา'],
  ['ครูพบว่าข้อสอบ 20 ข้อมีเฉลยเป็นตัวเลือก ค ถึง 12 ข้อ ข้อเสนอแนะใดเหมาะสมที่สุด', 'กระจายตำแหน่งเฉลยให้สมดุลทุกตัวเลือก', ['เพิ่มเฉลย ค ให้ครบทุกข้อเพื่อความง่าย', 'ตัดตัวเลือก ค ออกจากทุกข้อสอบ', 'ให้คะแนนข้อที่เฉลย ค น้อยกว่าข้ออื่น', 'ไม่ต้องแก้ เพราะไม่มีผลต่อคะแนน'], 'ตำแหน่งเฉลยที่ไม่สมดุลทำให้ผู้สอบเดารูปแบบได้'],
  ['ครูใช้ตัวเลือก “ถูกทุกข้อ” ในข้อสอบหลายข้อ นักเรียนที่รู้ว่าตัวเลือกสองตัวถูกก็เลือกได้ทันที ข้อสรุปใดถูกต้อง', 'ควรหลีกเลี่ยง เพราะเดาได้จากความรู้บางส่วน', ['ควรใช้ทุกข้อ เพราะช่วยวัดความรู้ได้ครบถ้วนขึ้น', 'ควรใช้เฉพาะข้อยากเพื่อเพิ่มอำนาจจำแนก', 'ไม่มีผลใดต่อคุณภาพของข้อสอบทั้งฉบับ', 'ควรใช้แทนตัวลวงที่คิดไม่ออกทุกครั้ง'], 'แนวปฏิบัติการเขียนข้อสอบแนะนำให้หลีกเลี่ยง “ถูกทุกข้อ”'],
  ['ครูเขียนแบบวัดเจตคติ 10 ข้อเป็นข้อความทางบวกทั้งหมด นักเรียนบางคนตอบ “เห็นด้วยอย่างยิ่ง” ทุกข้อโดยไม่อ่าน ครูควรปรับอย่างไร', 'เพิ่มข้อความทางลบบางข้อแล้วกลับคะแนน', ['ตัดตัวเลือกเห็นด้วยอย่างยิ่งออกทั้งหมด', 'เพิ่มจำนวนข้อเป็นห้าสิบข้อให้ยาวขึ้น', 'ให้นักเรียนตอบแบบสอบถามพร้อมกันทุกคน', 'เปลี่ยนเป็นข้อสอบถูก–ผิดทั้งหมดแทน'], 'ข้อความทางลบช่วยลดการตอบแบบเดียวกันทั้งชุด แต่ต้องกลับคะแนนก่อนวิเคราะห์'],
  ['ครูสร้างเครื่องมือวัด 1 ชุดเสร็จ ก่อนนำไปใช้จริงควรทำขั้นตอนใดเป็นอันดับแรก', 'ตรวจกับ LO และให้เพื่อนครูทบทวน', ['นำไปใช้กับนักเรียนทุกห้องทันที', 'คำนวณค่าความเที่ยงจากความคิดของครู', 'ตัดสินเกรดนักเรียนจากเครื่องมือทันที', 'เพิ่มจำนวนข้อให้มากที่สุดเท่าที่ทำได้'], 'การตรวจทานโดยผู้อื่นและตรวจความสอดคล้องกับ LO เป็นขั้นแรกของการประกันคุณภาพ'],
  ['LO คือ “ใช้กล้องถ่ายภาพจัดองค์ประกอบภาพตามหลักสามส่วนได้” ครูเลือกใช้ข้อสอบเลือกตอบเพียงอย่างเดียว ข้อวิจารณ์ใดถูกต้องที่สุด', 'ควรใช้ชิ้นงานภาพถ่ายประเมินด้วย Rubric', ['เหมาะสม เพราะตรวจง่ายและรวดเร็วกว่าวิธีอื่น', 'เหมาะสม ถ้าเพิ่มข้อสอบเป็นร้อยข้อ', 'ควรใช้แบบสอบถามความชอบถ่ายภาพ', 'ควรใช้ข้อสอบจับคู่ศัพท์การถ่ายภาพ'], 'LO ด้านทักษะและผลงานต้องประเมินจากผลงานจริง'],
  ['ครูเขียนคำตอบอัตนัยที่คาดหวังว่า “อธิบายได้ 3 ประเด็น: สาเหตุ ผลกระทบ แนวทางแก้” พร้อมคะแนนประเด็นละ 2 คะแนน สิ่งที่ครูทำคือข้อใด', 'สร้างเกณฑ์ให้คะแนนแยกองค์ประกอบ', ['สร้างข้อสอบเลือกตอบจากข้อเขียน', 'สร้างแบบตรวจสอบรายการพฤติกรรม', 'สร้างแบบสอบถามปลายเปิดทั่วไป', 'สร้างผังการออกข้อสอบทั้งฉบับ'], 'การกำหนดองค์ประกอบคำตอบและคะแนนล่วงหน้าคือเกณฑ์การให้คะแนนแบบวิเคราะห์'],
  ['เพื่อนครูทบทวนข้อสอบของคุณและพบคำถามที่มีคำตอบถูกได้สองตัวเลือก คุณควรทำอย่างไร', 'แก้ถ้อยคำให้มีคำตอบถูกเพียงตัวเดียว', ['ให้คะแนนทั้งสองตัวเลือกไว้ล่วงหน้า', 'ตัดตัวเลือกที่สองออกโดยไม่แก้อะไร', 'เพิ่มตัวเลือกที่ถูกเป็นสามตัวเลือก', 'ใช้ข้อนี้ต่อเพราะเพิ่มความยากได้'], 'ข้อสอบเลือกตอบต้องมีคำตอบถูกที่ชัดเจนเพียงหนึ่งเดียว (หรือถูกที่สุดตามผู้เชี่ยวชาญ)']
]);

/* ───────── MODULE 5 : การตรวจสอบคุณภาพเครื่องมือ ───────── */
QB(5, [
  ['ตาชั่งในห้องพยาบาลชั่งนักเรียนคนเดิมได้ 42.0, 42.1 และ 42.0 กิโลกรัม แต่ตาชั่งมาตรฐานได้ 45 กิโลกรัม ข้อสรุปใดถูกต้อง', 'เที่ยง แต่ไม่ตรง', ['ตรง แต่ไม่เที่ยง', 'ทั้งตรงและเที่ยง', 'ไม่ตรงและไม่เที่ยง', 'ตรงเฉพาะครั้งแรก'], 'ผลคงที่ (เที่ยง) แต่คลาดจากค่าจริงอย่างเป็นระบบ (ไม่ตรง)'],
  ['ครูแนะแนวพบว่าแบบวัด 40 ข้อได้ α = .95 จึงสรุปว่า “แบบวัดมีความตรงสูงมาก” ข้อวิจารณ์ใดถูกต้องที่สุด', 'α เป็นหลักฐานความเที่ยง ไม่ใช่ความตรง', ['ถูกต้อง เพราะ α สูงแปลว่าตรงเสมอ', 'ถูกต้อง ถ้าจำนวนข้อมากกว่าสามสิบ', 'ผิด เพราะ α ควรต่ำกว่า .70 เสมอ', 'ผิด เพราะ α ใช้กับข้อมูล 0/1 เท่านั้น'], 'ความเที่ยงเป็นเงื่อนไขจำเป็นแต่ไม่เพียงพอสำหรับความตรง'],
  ['ตาม Standards for Educational and Psychological Testing (2014) ความตรง (Validity) หมายถึงข้อใดเมื่อครูใช้คะแนนตัดสินผู้เรียน', 'หลักฐานรองรับการตีความและใช้คะแนน', ['ความคงที่ของคะแนนเมื่อสอบซ้ำหลายครั้ง', 'ความยากที่เหมาะสมของข้อสอบทั้งฉบับ', 'จำนวนผู้เชี่ยวชาญที่ตรวจข้อสอบ', 'สัดส่วนผู้สอบที่ผ่านเกณฑ์ขั้นต่ำ'], 'ความตรงเป็นเรื่องของการตีความและการใช้คะแนนตามจุดประสงค์'],
  ['ผู้เชี่ยวชาญ 5 คนพิจารณาข้อคำถามข้อหนึ่งได้ +1, +1, 0, +1, −1 ค่า IOC เท่ากับเท่าใด และควรตัดสินอย่างไร', '0.40 ต่ำกว่าเกณฑ์ ควรปรับ', ['0.60 ผ่านเกณฑ์ ใช้ได้ทันที', '0.80 ผ่านเกณฑ์ ใช้ได้ดีมาก', '0.40 ผ่านเกณฑ์ ใช้ได้ทันที', '1.00 ผ่านเกณฑ์ ไม่ต้องแก้'], '(1+1+0+1−1)/5 = 0.40 < .50'],
  ['ข้อคำถามได้ IOC = .40 และผู้เชี่ยวชาญสองคนเขียนว่า “ภาษากำกวม ตีความได้สองทาง” การตัดสินใจใดเหมาะสมที่สุด', 'ปรับภาษาตามข้อเสนอแนะแล้วส่งตรวจซ้ำ', ['ตัดข้อทิ้งทันทีโดยไม่อ่านข้อเสนอแนะ', 'ใช้ต่อเพราะค่าใกล้เคียงเกณฑ์มากแล้ว', 'เพิ่มผู้เชี่ยวชาญจนกว่าค่าจะผ่านเกณฑ์', 'เปลี่ยนเกณฑ์เป็น .40 เพื่อให้ข้อผ่าน'], 'ใช้ทั้งตัวเลขและข้อเสนอแนะเชิงคุณภาพประกอบการตัดสินใจ'],
  ['ผู้เชี่ยวชาญ 6 คนให้คะแนนความเกี่ยวข้อง 1–4 มี 5 คนให้ 3 หรือ 4 ค่า I-CVI เท่าใด และผ่านเกณฑ์ .78 หรือไม่', '0.83 ผ่านเกณฑ์', ['0.83 ไม่ผ่านเกณฑ์', '0.50 ไม่ผ่านเกณฑ์', '0.67 ไม่ผ่านเกณฑ์', '1.00 ผ่านเกณฑ์'], '5/6 = 0.83 ≥ .78 (Polit & Beck, 2006)'],
  ['แบบวัด 6 ข้อมี I-CVI เป็น 1, .83, .50, 1, .83 และ .50 ค่า S-CVI/Ave เท่าใด และตีความอย่างไร', '0.78 ยังต่ำกว่าเกณฑ์ .90', ['0.83 ผ่านเกณฑ์ .80 แล้ว', '0.90 ผ่านเกณฑ์พอดี', '0.33 ต่ำมากต้องทำใหม่', '1.00 ผ่านเกณฑ์ทุกข้อ'], 'ค่าเฉลี่ย = 4.67/6 = 0.78 ต่ำกว่า .90 ที่ Polit & Beck เสนอ'],
  ['มีผู้เชี่ยวชาญตรวจเครื่องมือเพียง 4 คน ตามข้อเสนอของ Lynn (1986) ข้อคำถามควรมีค่า I-CVI เท่าใดจึงยอมรับได้', '1.00 คือทุกคนเห็นว่าเกี่ยวข้อง', ['อย่างน้อย .50 จากทุกคน', 'อย่างน้อย .78 จากทุกคน', 'อย่างน้อย .70 จากทุกคน', 'ไม่ต้องคำนวณเมื่อน้อยกว่าห้าคน'], 'เมื่อผู้เชี่ยวชาญ 3–5 คน Lynn เสนอให้ I-CVI เท่ากับ 1.00'],
  ['ครูพัฒนาแบบวัดความวิตกกังวลในการสอบ และใช้การวิเคราะห์องค์ประกอบตรวจว่าข้อคำถามรวมกลุ่มตามทฤษฎีหรือไม่ หลักฐานนี้เป็นความตรงประเภทใด', 'ความตรงเชิงโครงสร้าง', ['ความตรงเชิงเนื้อหา', 'ความตรงเชิงพยากรณ์', 'ความตรงตามสภาพ', 'ความเที่ยงภายใน'], 'การตรวจโครงสร้างภายในตามทฤษฎีเป็นหลักฐานความตรงเชิงโครงสร้าง'],
  ['มหาวิทยาลัยพบว่าคะแนนสอบเข้ามีความสัมพันธ์กับผลการเรียนปีแรกอย่างมีนัยสำคัญ หลักฐานนี้เป็นความตรงประเภทใด', 'ความตรงเชิงพยากรณ์', ['ความตรงตามสภาพ', 'ความตรงเชิงเนื้อหา', 'ความตรงเชิงโครงสร้าง', 'ความเที่ยงแบบสอบซ้ำ'], 'เกณฑ์ (ผลการเรียน) เกิดภายหลังการวัด จึงเป็นความตรงเชิงพยากรณ์'],
  ['ครูให้นักเรียนทำแบบวัดใหม่และแบบวัดมาตรฐานที่ยอมรับแล้วในสัปดาห์เดียวกัน แล้วหาสหสัมพันธ์ หลักฐานนี้คือข้อใด', 'ความตรงตามสภาพ', ['ความตรงเชิงพยากรณ์', 'ความตรงเชิงเนื้อหา', 'ความเที่ยงระหว่างผู้ตรวจ', 'ความเที่ยงแบบคู่ขนาน'], 'เกณฑ์เก็บพร้อมกันกับการวัด จึงเป็น Concurrent Validity'],
  ['ครูพัฒนาแบบวัดการคิดวิเคราะห์ แล้วพบว่ากลุ่มนักเรียนโครงการพิเศษได้คะแนนสูงกว่ากลุ่มทั่วไปตามที่ทฤษฎีคาดไว้ วิธีนี้เรียกว่าอะไร', 'เทคนิคกลุ่มรู้ชัด (Known-groups)', ['การหาค่า IOC จากผู้เชี่ยวชาญหลายคน', 'การหาความเที่ยงแบบสอบซ้ำ', 'การหาค่า KR-20 ทั้งฉบับ', 'การหาค่า Cohen’s Kappa'], 'การเปรียบเทียบกลุ่มที่ทราบลักษณะชัดเจนเป็นหลักฐานความตรงเชิงโครงสร้าง'],
  ['ครูมีข้อสอบปรนัยที่ให้คะแนนถูก 1 ผิด 0 ต้องการหาความสอดคล้องภายในทั้งฉบับ ควรใช้ดัชนีใด', 'KR-20', ['Cohen’s Kappa', 'IOC', 'ICC', 'CVI'], 'KR-20 ออกแบบสำหรับข้อมูลทวิภาค (0/1)'],
  ['ครูมีแบบสอบถามมาตรประมาณค่า 5 ระดับ 12 ข้อ ต้องการหาความสอดคล้องภายใน ควรใช้ดัชนีใด', 'Cronbach’s α', ['KR-20', 'IOC', 'Cohen’s Kappa', 'I-CVI'], 'α ใช้กับข้อมูลที่ให้คะแนนหลายระดับ'],
  ['ครูใช้ JASP คำนวณ Cronbach’s α จากข้อมูล 0/1 ได้ .74 แล้วคำนวณ KR-20 ด้วยมือได้ .74 เช่นกัน ข้อสรุปใดถูกต้อง', 'สำหรับข้อมูล 0/1 ทั้งสองค่าเท่ากัน', ['คำนวณผิด เพราะสองค่าต้องต่างกันเสมอ', 'JASP ใช้สูตร KR-21 แทน Cronbach’s α', 'ต้องใช้ ICC แทนทั้งสองค่าในกรณีนี้', 'ข้อมูลนี้ต้องใช้ Cohen’s Kappa เท่านั้น'], 'เมื่อข้อมูลเป็น 0/1 α ลดรูปเป็น KR-20'],
  ['แบบสอบถาม 6 ข้อได้ α = .61 และข้อ 4 ซึ่งเป็นข้อความทางลบมี item-rest correlation ติดลบ ขั้นแรกครูควรตรวจอะไร', 'ตรวจว่ากลับคะแนนข้อ 4 แล้วหรือยัง', ['เพิ่มจำนวนผู้ตอบให้ได้สองเท่า', 'ตัดข้อ 4 ออกทันทีโดยไม่ตรวจ', 'เปลี่ยนเป็นมาตรประมาณค่าเจ็ดระดับ', 'สรุปว่าแบบสอบถามใช้ไม่ได้ทั้งชุด'], 'ข้อความทางลบที่ไม่กลับคะแนนทำให้สหสัมพันธ์ติดลบและ α ต่ำ'],
  ['ในมาตรประมาณค่า 1–5 นักเรียนตอบข้อความทางลบว่า 2 เมื่อกลับคะแนนแล้วจะได้เท่าใด', '4', ['2', '3', '−2', '5'], 'คะแนนใหม่ = 6 − คะแนนเดิม = 6 − 2 = 4'],
  ['ครูต้องการทราบว่าแบบทดสอบให้ผลคงที่เมื่อสอบกลุ่มเดิมห่างกัน 2 สัปดาห์หรือไม่ ควรหาความเที่ยงแบบใด', 'แบบสอบซ้ำ (Test–retest)', ['แบบความสอดคล้องภายในฉบับ', 'แบบระหว่างผู้ประเมิน', 'แบบความตรงเชิงเนื้อหา', 'แบบความตรงตามสภาพ'], 'การวัดซ้ำกลุ่มเดิมแล้วหาสหสัมพันธ์คือ Test–retest reliability'],
  ['ครู 2 คนให้คะแนนระดับ Rubric (1–4) กับเรียงความ 20 ชิ้นอย่างอิสระ และต้องการดูความสอดคล้องแบบหักความบังเอิญ ควรใช้ดัชนีใด', 'Cohen’s Kappa', ['Fleiss’ Kappa', 'KR-20', 'IOC', 'I-CVI'], 'ผู้ประเมินสองคน ข้อมูลกลุ่ม ใช้ Cohen’s Kappa'],
  ['ครู 3 คนจัดระดับผลงาน 30 ชิ้นเป็น ผ่าน / ปรับปรุง / ไม่ผ่าน ต้องการหาความสอดคล้องระหว่างผู้ประเมิน ควรใช้ดัชนีใด', 'Fleiss’ Kappa', ['Cohen’s Kappa', 'KR-20', 'Cronbach’s α', 'IOC'], 'ผู้ประเมินมากกว่าสองคนกับข้อมูลกลุ่มใช้ Fleiss’ Kappa'],
  ['ผู้ประเมินสองคนให้ระดับตรงกัน 75% แต่ Cohen’s κ = .66 ครูสงสัยว่าคำนวณผิด คำอธิบายใดถูกต้อง', 'κ หักส่วนที่อาจตรงกันโดยบังเอิญออก', ['κ ต้องเท่ากับร้อยละความตรงกันเสมอ', 'ผู้ประเมินคนหนึ่งให้คะแนนลำเอียงแน่นอน', 'ข้อมูลน้อยเกินไปจึงคำนวณไม่ได้เลย', 'κ ใช้ได้เฉพาะผู้ประเมินสามคนขึ้นไป'], 'ร้อยละความตรงกันรวมความบังเอิญไว้ κ จึงต่ำกว่า'],
  ['ได้ Cohen’s κ = .58 เมื่อตีความตามเกณฑ์ของ Landis และ Koch (1977) ความสอดคล้องอยู่ในระดับใด', 'Moderate', ['Slight', 'Fair', 'Substantial', 'Almost perfect'], '.41–.60 คือ Moderate'],
  ['ครูให้คะแนนงานปฏิบัติแบบต่อเนื่อง 0–20 คะแนน โดยผู้ประเมิน 3 คน และต้องการรายงานความสอดคล้อง ควรใช้ดัชนีใด', 'ICC', ['Cohen’s Kappa', 'KR-20', 'IOC', 'I-CVI'], 'คะแนนต่อเนื่องจากหลายผู้ประเมินเหมาะกับ ICC'],
  ['ได้ ICC = .82 เมื่อตีความตามแนวทางของ Koo และ Li (2016) ความเที่ยงระหว่างผู้ประเมินอยู่ในระดับใด', 'Good', ['Poor', 'Moderate', 'Excellent', 'Slight'], '.75–.90 คือ Good'],
  ['ครูคนเดิมให้คะแนนเรียงความชุดเดิมซ้ำหลังผ่านไป 3 สัปดาห์ แล้วเทียบผลสองครั้ง ครูกำลังตรวจสอบความเที่ยงประเภทใด', 'Intra-rater reliability', ['Inter-rater reliability', 'Internal consistency', 'Parallel forms', 'Content validity'], 'ผู้ประเมินคนเดิมประเมินซ้ำคือความเที่ยงภายในผู้ประเมิน'],

  ['ครูพบว่าแบบทดสอบ 10 ข้อมี KR-20 = .57 และต้องการเพิ่มความเที่ยงสำหรับการสอบครั้งต่อไป วิธีใดเหมาะสมที่สุด', 'เพิ่มข้อสอบคุณภาพดีที่วัดเรื่องเดียวกัน', ['ลดจำนวนข้อสอบลงเหลือห้าข้อ', 'ใช้ผู้สอบที่มีความสามารถใกล้เคียงกัน', 'เพิ่มตัวลวงที่ไม่มีใครเลือกเลย', 'เปลี่ยนเป็นข้อสอบถูก–ผิดทุกข้อ'], 'ความยาวแบบทดสอบที่มากขึ้นด้วยข้อคุณภาพดีมักเพิ่มความเที่ยง'],

  ['ระหว่างสังเกตการสอนของนักศึกษาฝึกสอน ผู้นิเทศมีความประทับใจจากการแต่งกายจนให้คะแนนทุกด้านสูง อคตินี้เรียกว่าอะไร', 'Halo effect', ['Central tendency', 'Leniency error', 'Recency effect', 'Contrast effect'], 'Halo effect คือความประทับใจด้านหนึ่งส่งผลต่อการประเมินด้านอื่น'],

  ['ผลรายมาตรฐานพบว่า S3 “แปลความหมายและสรุปผล” เฉลี่ย 2.2 จาก 5 ขณะที่มาตรฐานอื่น 3.3–3.8 การตัดสินใจใดเหมาะสมที่สุด', 'ปรับกิจกรรมการสอน S3 แล้วประเมินซ้ำ', ['ไม่ต้องทำอะไรเพราะค่าเฉลี่ยรวมผ่าน', 'ตัดมาตรฐาน S3 ออกจากหน่วยการเรียน', 'ให้คะแนนพิเศษเฉพาะมาตรฐาน S3', 'เพิ่มข้อสอบ S3 ให้ง่ายลงในครั้งหน้า'], 'ใช้ข้อมูลเพื่อปรับการสอนตรงจุดแล้วติดตามผล'],
  ['คะแนนสอบของห้องเป็น 3, 4, 4, 5, 5, 6 และ 19 ครูต้องการรายงาน “คะแนนโดยทั่วไป” ของห้อง ค่ากลางใดเหมาะสมที่สุด', 'มัธยฐาน เพราะไม่ถูกดึงด้วยค่าสุดโต่ง', ['ค่าเฉลี่ย เพราะใช้ข้อมูลทุกตัว', 'ฐานนิยม เพราะเป็นค่าที่พบบ่อย', 'พิสัย เพราะบอกการกระจายได้', 'ค่าสูงสุด เพราะแสดงศักยภาพของห้องเรียนได้'], 'ค่าสุดโต่ง (19) ดึงค่าเฉลี่ยขึ้น มัธยฐานสะท้อนค่ากลางได้ดีกว่า'],
  ['สองห้องมีค่าเฉลี่ย 12 เท่ากัน ห้อง A มี SD 1.5 ห้อง B มี SD 5.0 ข้อสรุปใดถูกต้องที่สุด', 'ห้อง B มีความแตกต่างระหว่างผู้เรียนมากกว่า', ['ห้อง A เรียนเก่งกว่าห้อง B อย่างชัดเจนมาก', 'ทั้งสองห้องมีผลการเรียนเหมือนกันทุกด้าน', 'ห้อง B มีคะแนนเฉลี่ยสูงกว่าห้อง A', 'ข้อสอบของห้อง A ยากกว่าห้อง B มาก'], 'SD ที่มากแสดงว่าคะแนนกระจาย ครูอาจต้องจัดการเรียนรู้แบบแยกกลุ่ม'],
  ['ครูรายงานว่า “นักเรียนบรรลุมาตรฐาน S1 และ S2 แต่ยังไม่บรรลุ S3 ตามเกณฑ์ 3 จาก 5” เป็นการแปลผลแบบใด', 'อิงเกณฑ์', ['อิงกลุ่ม', 'อิงเปอร์เซ็นไทล์', 'คะแนนมาตรฐาน T', 'จัดอันดับในห้อง'], 'เทียบกับเกณฑ์ที่กำหนด ไม่ได้เทียบกับผู้อื่น'],
  ['คะแนนนักเรียนเพิ่มจาก 11 เป็น 12 และ SEM ของแบบทดสอบเท่ากับ 1.5 ครูควรสรุปอย่างไร', 'อยู่ในช่วงคลาดเคลื่อน ยังสรุปไม่ได้', ['นักเรียนพัฒนาขึ้นอย่างชัดเจนแน่นอน', 'นักเรียนถดถอยลงอย่างมีนัยสำคัญ', 'แบบทดสอบไม่มีความเที่ยงเลยสักนิด', 'ต้องให้นักเรียนสอบซ้ำทันทีทุกคน'], 'ความต่างที่น้อยกว่า SEM อาจเกิดจากความคลาดเคลื่อนของการวัด'],
  ['Feedback ข้อใดช่วยการเรียนรู้มากที่สุดตามกรอบของ Hattie และ Timperley (2007)', 'ข้อสรุปยังไม่อ้างข้อมูล ลองระบุตัวเลขที่สนับสนุน', ['เก่งมาก ครูภูมิใจในตัวเธอเป็นอย่างมากเลยนะ', 'ได้ 7 จาก 10 คะแนน พยายามให้มากกว่านี้อีก', 'ยังไม่ดีพอ ต้องตั้งใจเรียนให้มากกว่านี้นะ', 'งานเรียบร้อยดี ลายมือสวยและส่งตรงเวลามาก'], 'Feedback ที่ดีบอกช่องว่างและขั้นต่อไปอย่างเฉพาะเจาะจง'],
  ['ครูเขียน Feedback ว่า “ลองวาดตารางความถี่ก่อนคำนวณ จะช่วยไม่ให้ลืมข้อมูลบางตัว” Feedback นี้อยู่ในระดับใด', 'Process (กระบวนการ)', ['Task (งาน)', 'Self (บุคคล)', 'Self-regulation', 'Norm (อิงกลุ่ม)'], 'เป็นการแนะนำกลยุทธ์/กระบวนการทำงาน'],
  ['ครูเขียน Feedback ว่า “ก่อนส่งงาน ลองตรวจกับเกณฑ์ข้อ 2 เองว่าข้อสรุปอ้างข้อมูลแล้วหรือยัง” Feedback นี้อยู่ในระดับใด', 'Self-regulation', ['Task (งาน)', 'Process (กระบวนการ)', 'Self (บุคคล)', 'Placement'], 'ส่งเสริมให้ผู้เรียนตรวจสอบและกำกับตนเอง'],
  ['ครูเขียน Feedback ว่า “เธอเป็นเด็กฉลาดมาก” ตามงานของ Hattie และ Timperley ข้อสรุปใดถูกต้อง', 'เป็นระดับตัวบุคคล มีผลต่อการเรียนรู้น้อย', ['เป็นระดับกระบวนการ ช่วยการเรียนรู้สูงสุด', 'เป็นระดับกำกับตนเอง ช่วยการเรียนรู้มาก', 'เป็นระดับงาน บอกความถูกต้องได้ชัดเจน', 'เป็น Feedback ที่ดีที่สุดสำหรับทุกคน'], 'คำชมบุคคลไม่ได้บอกว่าต้องทำอะไรต่อ จึงช่วยการเรียนรู้น้อย'],
  ['ครูต้องการ Feedback ที่ตอบคำถาม “Where to next?” ข้อความใดเหมาะสมที่สุด', 'ครั้งต่อไปให้เปรียบเทียบค่ากลางสองค่าก่อนเลือกใช้', ['เป้าหมายของหน่วยนี้คือการแปลความหมายของข้อมูล', 'ตอนนี้เธอคำนวณค่าเฉลี่ยได้ถูกต้องทุกข้อแล้ว', 'เธอได้คะแนนสูงกว่าค่าเฉลี่ยของห้องเรียนนี้', 'งานชิ้นนี้ทำได้ดีกว่างานชิ้นที่แล้วเล็กน้อย'], '“Where to next” คือการบอกขั้นต่อไปที่ผู้เรียนควรทำ'],
  ['ระบบเตือนผู้เรียนกลุ่มเสี่ยงของโรงเรียนใช้ “คะแนนสอบย่อยครั้งล่าสุดต่ำกว่า 50%” เพียงตัวเดียว ข้อวิจารณ์ใดเหมาะสมที่สุด', 'ควรใช้หลายตัวบ่งชี้และให้ครูตรวจสอบก่อน', ['เหมาะสม เพราะคะแนนสอบแม่นยำที่สุด', 'เหมาะสม ถ้าแจ้งผลให้ทั้งห้องทราบ', 'ควรใช้เฉพาะจำนวนวันที่ขาดเรียนแทน', 'ควรให้ระบบตัดสินใจช่วยเหลือเองทั้งหมด'], 'ตัวบ่งชี้เดียวมีความคลาดเคลื่อนและไม่บอกสาเหตุ'],
  ['โรงเรียนแสดงรายชื่อนักเรียนที่ได้ “สีแดง” บนจอหน้าห้องเพื่อกระตุ้น นักเรียนบางคนเริ่มขาดเรียน ปัญหาหลักด้านจริยธรรมคือข้อใด', 'เปิดเผยข้อมูลส่วนบุคคลและตีตราผู้เรียน', ['การใช้สีแดงทำให้อ่านข้อมูลยากเกินไป', 'จอหน้าห้องมีขนาดเล็กเกินกว่าที่ควร', 'ข้อมูลอัปเดตช้าเกินไปสำหรับครู', 'ไม่ได้แสดงคะแนนของนักเรียนทุกคน'], 'ข้อมูลผู้เรียนต้องใช้เพื่อช่วยเหลือ จำกัดผู้เห็น และไม่ตีตรา'],
  ['ตามนิยามที่ใช้แพร่หลาย (LAK 2011) Learning Analytics มีจุดมุ่งหมายหลักข้อใด', 'เข้าใจและพัฒนาการเรียนรู้ของผู้เรียน', ['จัดอันดับผู้เรียนเพื่อคัดเลือกเข้าศึกษา', 'ลดจำนวนครูที่ต้องใช้ในการสอน', 'ตรวจจับการทุจริตในการสอบออนไลน์', 'ทำนายรายได้ของผู้เรียนในอนาคต'], 'Learning Analytics มุ่งเข้าใจและเพิ่มประสิทธิภาพของการเรียนรู้'],
  ['ครูใช้ข้อมูลร่วมกับการพูดคุยและบริบทของผู้เรียนก่อนตัดสินใจ แทนการทำตามตัวเลขอย่างเดียว แนวคิดนี้เรียกว่าอะไร', 'Data-informed decision making', ['Data-driven only decision rule', 'Norm-referenced reporting', 'Automated grading system', 'Placement testing policy'], 'ข้อมูลเป็นหลักฐานประกอบ ครูใช้วิจารณญาณวิชาชีพในการตัดสินใจ'],
  ['นักเรียนคนหนึ่งเข้าระบบเรียนออนไลน์น้อยมาก แต่คะแนนสอบดี เมื่อพูดคุยพบว่าใช้เครื่องร่วมกับพี่น้อง ข้อสรุปใดเหมาะสมที่สุด', 'ตัวบ่งชี้การเข้าระบบอาจไม่สะท้อนการเรียนรู้', ['นักเรียนคนนี้ทุจริตในการสอบแน่นอน', 'ควรลดคะแนนเพราะเข้าระบบน้อยเกินไป', 'ระบบ Learning Analytics ใช้ไม่ได้เลย', 'ควรบังคับให้เข้าระบบทุกวันโดยไม่มีข้อยกเว้น'], 'ตัวบ่งชี้ร่องรอยการใช้งานเป็นตัวแทนการเรียนรู้ที่ไม่สมบูรณ์'],
  ['ครูต้องเขียนรายงานผลการประเมินให้ผู้ปกครอง รูปแบบใดเหมาะสมที่สุด', 'ภาษาเข้าใจง่าย บอกจุดแข็ง จุดพัฒนา และวิธีช่วย', ['ตารางสถิติครบทุกค่าพร้อมสูตรการคำนวณ', 'คะแนนรวมเพียงตัวเลขเดียวโดยไม่มีคำอธิบายใด', 'เปรียบเทียบกับนักเรียนคนอื่นเป็นรายชื่อ', 'ศัพท์เทคนิคการวัดผลเพื่อความน่าเชื่อถือ'], 'การสื่อสารผลต้องเหมาะกับผู้อ่านและนำไปใช้ได้'],
  ['ครูรายงานผลต่อผู้บริหารเพื่อขอทรัพยากรสอนเสริม ข้อมูลใดสำคัญที่สุดที่ควรนำเสนอ', 'ผลรายมาตรฐาน กลุ่มที่ต้องช่วย และแผน', ['ชื่อนักเรียนที่ได้คะแนนต่ำสุดทุกคนในห้อง', 'คะแนนดิบของนักเรียนทุกคนในทุกข้อสอบ', 'ความรู้สึกของครูต่อผลการสอบครั้งนี้', 'รายละเอียดสูตรคำนวณสถิติทุกตัวที่ใช้'], 'ผู้บริหารต้องการข้อมูลเชิงสรุปที่ใช้ตัดสินใจและติดตามผลได้'],
  ['ครูจัดกลุ่มสอนเสริมจากผลรายมาตรฐาน แล้วสอบซ้ำหลัง 2 สัปดาห์ ขั้นตอนการสอบซ้ำนี้มีจุดประสงค์หลักข้อใด', 'ติดตามผลว่าการตัดสินใจช่วยได้จริงหรือไม่', ['เพิ่มจำนวนคะแนนเก็บของรายวิชา', 'หาผู้เรียนที่ได้คะแนนสูงสุดของห้อง', 'ลดภาระการตรวจงานของครูในภาคเรียนนี้ลง', 'ทำให้คะแนนเฉลี่ยของห้องสูงขึ้นเสมอ'], 'วงจรการใช้ข้อมูลต้องจบด้วยการติดตามผลของการตัดสินใจ'],
  ['ข้อมูลผู้เรียนในระบบของโรงเรียนประกอบด้วยชื่อ คะแนน และพฤติกรรมการเรียน ครูควรปฏิบัติข้อใดตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562', 'เก็บเท่าที่จำเป็น แจ้งวัตถุประสงค์ และจำกัดผู้เข้าถึง', ['ส่งข้อมูลให้บริษัทภายนอกวิเคราะห์ได้โดยอิสระทันที', 'เผยแพร่ข้อมูลในสื่อสังคมเพื่อความโปร่งใส', 'เก็บข้อมูลทุกอย่างเท่าที่ระบบเก็บได้ตลอดไป', 'ให้นักเรียนทุกคนเข้าดูข้อมูลของเพื่อนได้'], 'หลักการเก็บเท่าที่จำเป็น แจ้งวัตถุประสงค์ และจำกัดการเข้าถึง'],
  ['ครูใช้คำว่า “เด็กอ่อน” ในรายงานกลุ่มผู้เรียนที่ต้องสอนเสริม ข้อเสนอแนะใดเหมาะสมที่สุด', 'ใช้คำว่า “กลุ่มที่ต้องการสนับสนุน”', ['ใช้คำว่า “กลุ่มที่เรียนไม่ได้” แทน', 'ไม่ต้องเปลี่ยน เพราะเป็นความจริงแล้ว', 'ใช้รหัสสีแดงแทนคำเรียกทั้งหมด', 'ระบุชื่อเต็มของนักเรียนแทนคำเรียก'], 'ภาษาที่ไม่ตีตราช่วยรักษาแรงจูงใจและศักดิ์ศรีของผู้เรียน'],
  ['ครูพบว่าผู้เรียนกลุ่มหนึ่งมีคะแนนหลังเรียนต่ำ ส่งงานน้อย และเข้าระบบน้อย ก่อนดำเนินการช่วยเหลือ ครูควรทำสิ่งใดก่อน', 'พูดคุยเพื่อเข้าใจสาเหตุรายบุคคล', ['ส่งรายชื่อให้ผู้บริหารลงโทษทันที', 'ลดคะแนนเก็บของกลุ่มนี้ทั้งหมด', 'ย้ายกลุ่มนี้ไปเรียนห้องอื่นทันที', 'แจ้งผู้ปกครองว่าบุตรหลานไม่ตั้งใจ'], 'ข้อมูลบอก “อะไร” แต่การพูดคุยช่วยให้รู้ “ทำไม” เพื่อช่วยเหลือได้ตรงจุด'],
  ['นักเรียนได้ T = 60 ในแบบทดสอบของห้อง ครูอธิบายความหมายให้นักเรียนฟังอย่างไรจึงถูกต้อง', 'สูงกว่าค่าเฉลี่ยของห้องประมาณ 1 SD', ['ได้คะแนนร้อยละ 60 ของคะแนนเต็ม', 'ผ่านเกณฑ์ขั้นต่ำร้อยละ 60 พอดี', 'อยู่อันดับที่ 60 ของห้องเรียนนี้', 'ต่ำกว่าค่าเฉลี่ยของห้องเล็กน้อย'], 'T = 60 → z = 1.0 คือสูงกว่าค่าเฉลี่ย 1 ส่วนเบี่ยงเบนมาตรฐาน'],
  ['Dashboard ของครูแสดงกราฟแท่งที่แกน y เริ่มจาก 60 ทำให้ความต่างของห้องดูมากเกินจริง ครูควรปรับอย่างไร', 'เริ่มแกนที่ศูนย์หรือบอกสเกลชัด', ['เปลี่ยนสีแท่งให้สดใสกว่าเดิมมาก', 'ตัดห้องที่คะแนนต่ำออกจากกราฟ', 'ใช้กราฟวงกลมแทนทุกกรณี', 'ไม่ต้องแก้ เพราะเห็นความต่างชัด'], 'การตัดแกนทำให้ผู้อ่านเข้าใจขนาดของความต่างผิด'],
  ['ครูต้องเลือกข้อมูลสำหรับวางแผนสอนซ่อมเสริมรายกลุ่ม ข้อมูลใดมีประโยชน์ที่สุด', 'ผลรายมาตรฐานและข้อผิดพลาดที่พบบ่อย', ['คะแนนรวมทั้งภาคของนักเรียนแต่ละคน', 'อันดับของนักเรียนในห้องทั้งหมด', 'จำนวนครั้งที่นักเรียนยกมือถาม', 'เกรดเฉลี่ยสะสมของภาคเรียนที่แล้ว'], 'ข้อมูลรายมาตรฐานและรูปแบบข้อผิดบอกว่าต้องสอนอะไรเพิ่ม'],
  ['หลังใช้ผลประเมินปรับการสอน ห้องเรียนมีค่าเฉลี่ย S3 เพิ่มจาก 2.2 เป็น 3.4 จาก 5 ครูควรสรุปและดำเนินการอย่างไร', 'บันทึกสิ่งที่ได้ผล และติดตามผู้ที่ยังไม่ผ่านต่อ', ['หยุดติดตามทุกคนเพราะค่าเฉลี่ยผ่านเกณฑ์แล้ว', 'ลดเวลาสอน S3 ในปีถัดไปให้เหลือครึ่งหนึ่ง', 'ประกาศว่าการสอนใหม่ดีกว่าทุกวิธีที่มีอยู่', 'ย้อนกลับไปใช้วิธีสอนเดิมเพื่อเปรียบเทียบ'], 'ค่าเฉลี่ยที่ดีขึ้นอาจยังมีผู้เรียนบางคนที่ต้องได้รับการช่วยเหลือต่อ']
]);

/* ───────── MODULE 9 : นวัตกรรมการวัดและประเมินผลในยุคดิจิทัล ───────── */
QB(9, [
  ['นักศึกษาฝึกสอนเสนอ “นวัตกรรม” คือย้ายข้อสอบกระดาษ 20 ข้อไปไว้ใน Google Forms ที่ตรวจอัตโนมัติ อาจารย์นิเทศควรให้ความเห็นอย่างไร', 'เป็นการใช้เครื่องมือ ยังไม่เปลี่ยนการใช้ผล', ['เป็นนวัตกรรมสมบูรณ์เพราะใช้เทคโนโลยี', 'เป็นนวัตกรรมเพราะตรวจคะแนนได้รวดเร็ว', 'ไม่ใช่ทั้งเครื่องมือและนวัตกรรมใดเลย', 'เป็นนวัตกรรมถ้าใช้กับนักเรียนหลายห้อง'], 'Tool ≠ Innovation นวัตกรรมต้องสร้างวงจรใช้ข้อมูลพัฒนาการเรียนรู้'],
  ['ระบบใดมีลักษณะเป็น “นวัตกรรมการประเมิน” มากที่สุด', 'วิเคราะห์ตัวลวง ส่ง Feedback เฉพาะจุด และวัดซ้ำ', ['บันทึกคะแนนลงสเปรดชีตออนไลน์แทนสมุดคะแนน', 'สแกนกระดาษคำตอบเป็นไฟล์ PDF เก็บไว้ในคลาวด์', 'ทำเกียรติบัตรออนไลน์ให้ผู้ที่ได้คะแนนสูงสุด', 'พิมพ์ข้อสอบด้วยคอมพิวเตอร์แทนการเขียนมือ'], 'นวัตกรรมมีวงจร เก็บข้อมูล → วิเคราะห์ → Feedback → ติดตาม'],
  ['ครูออกแบบระบบตามลำดับ “เก็บคำตอบ → วิเคราะห์ผล → จำแนกจุดอ่อน → สร้าง Feedback → แนะนำกิจกรรม → ติดตามพัฒนาการ” ขั้นใดทำให้ระบบต่างจากการใช้เครื่องมือทั่วไปมากที่สุด', 'การนำผลย้อนกลับไปพัฒนาและติดตามผู้เรียน', ['การใช้แบบฟอร์มออนไลน์เก็บคำตอบของผู้เรียน', 'การพิมพ์ผลคะแนนออกมาเป็นเอกสารรายงาน', 'การตั้งเวลาปิดรับคำตอบอัตโนมัติของระบบ', 'การเลือกสีและธีมของแบบฟอร์มให้สวยงาม'], 'คุณค่าใหม่เกิดจากวงจรที่ข้อมูลย้อนกลับไปพัฒนาการเรียนรู้'],
  ['ในการพัฒนานวัตกรรมด้วย D-A-T-A Model นักศึกษาเริ่มออกแบบแอปทันทีโดยยังไม่รู้ว่าผู้ใช้มีปัญหาอะไร ข้ามขั้นใดไป', 'D — Diagnose', ['A — Assess', 'T — Technology Design', 'A — Analyze & Improve', 'P — Prototype'], 'ต้องเริ่มจากวิเคราะห์ปัญหาและความต้องการของผู้ใช้'],
  ['ขั้นใดของ D-A-T-A Model ที่ “กำหนด LO หลักฐานการเรียนรู้ วิธีวัด และเกณฑ์”', 'A — Assess', ['D — Diagnose', 'T — Technology Design', 'A — Analyze & Improve', 'R — Reflect'], 'Assess คือกำหนดสิ่งที่ต้องการวัดและหลักฐานการเรียนรู้'],
  ['นักศึกษาทดลองใช้ต้นแบบกับนักเรียน 12 คน เก็บข้อมูลคุณภาพ แล้วปรับปรุงรอบที่สอง กิจกรรมนี้อยู่ในขั้นใดของ D-A-T-A', 'A — Analyze & Improve', ['D — Diagnose', 'A — Assess', 'T — Technology Design', 'I — Implement Only'], 'การวิเคราะห์ผลการทดลองใช้และปรับปรุงคือขั้นสุดท้ายของโมเดล'],
  ['นักศึกษาวาดแผนภาพระบบ ระบุเทคโนโลยี และระบุจุดที่ครูต้องตัดสินใจเอง กิจกรรมนี้อยู่ในขั้นใดของ D-A-T-A', 'T — Technology Design', ['D — Diagnose', 'A — Assess', 'A — Analyze & Improve', 'E — Evaluate Only'], 'การออกแบบนวัตกรรม Blueprint และ Human Oversight อยู่ในขั้น Technology Design'],
  ['เปรียบเทียบการประเมินแบบดั้งเดิมกับดิจิทัล ข้อใดแสดง “Continuous Assessment” ได้ชัดเจนที่สุด', 'เก็บหลักฐานหลายครั้งและใช้ปรับการเรียน', ['สอบปลายภาคครั้งเดียวด้วยระบบคอมพิวเตอร์', 'สอบกลางภาคและปลายภาคด้วยกระดาษคำตอบ', 'สอบเข้าหนึ่งครั้งก่อนเริ่มภาคการศึกษา', 'ตรวจข้อสอบด้วยเครื่องสแกนหลังสอบเสร็จ'], 'ต่อเนื่องและใช้ผลระหว่างทาง ไม่ใช่เพียงเปลี่ยนสื่อ'],
  ['โรงเรียนต้องการใช้ Adaptive Assessment ที่ปรับข้อถัดไปตามคำตอบ ข้อจำกัดสำคัญที่ต้องเตรียมคือข้อใด', 'คลังข้อสอบขนาดใหญ่ที่สอบเทียบค่าสถิติแล้ว', ['ข้อสอบชุดเดียวที่ทุกคนได้เหมือนกันทุกข้อ', 'กระดาษคำตอบที่ออกแบบเฉพาะสำหรับระบบนี้', 'ผู้คุมสอบจำนวนมากกว่าการสอบปกติสองเท่า', 'ข้อสอบอัตนัยจำนวนมากสำหรับทุกระดับชั้น'], 'Adaptive testing ต้องใช้คลังข้อสอบที่ทราบค่าสถิติ (มักใช้ IRT)'],
  ['ครูภาษาไทยมีเรียงความ 300 ชิ้น เพื่อนเสนอให้ “ใช้ AI ตัดสินคะแนนเลย เพราะไม่มีอคติ” ข้อวิจารณ์ใดถูกต้องที่สุด', 'AI อาจมีอคติและผิดพลาด ครูต้องตรวจสอบและตัดสิน', ['ถูกต้อง เพราะ AI ไม่มีอคติใด ๆ ในการให้คะแนนเลย', 'ถูกต้อง ถ้าใช้ AI หลายตัวแล้วหาค่าเฉลี่ย', 'ไม่ควรใช้ AI ในงานการศึกษาทุกกรณีเลย', 'ควรให้นักเรียนเลือก AI ที่ตรวจงานตนเอง'], 'ระบบ AI อาจมีอคติจากข้อมูลที่ใช้ฝึก การตัดสินที่มีผลต่อผู้เรียนต้องมี Human Oversight'],
  ['ครูใช้ AI ร่าง Feedback ให้เรียงความ ขั้นตอนใดสำคัญที่สุดเพื่อให้เกิด Human Oversight', 'ครูตรวจทาน แก้ไข และรับผิดชอบก่อนส่งผู้เรียน', ['ส่ง Feedback จาก AI ให้ผู้เรียนทันทีทุกชิ้น', 'ให้ AI ตัวที่สองตรวจ Feedback ของ AI ตัวแรก', 'ให้ผู้เรียนตัดสินเองว่า Feedback ถูกหรือไม่', 'เก็บ Feedback ไว้โดยไม่ต้องส่งให้ผู้เรียน'], 'มนุษย์ต้องตรวจสอบ กำกับ และรับผิดชอบการตัดสินใจสำคัญ'],
  ['ก่อนใช้ AI ช่วยให้คะแนนงานที่มีผลต่อเกรด ครูควรเก็บหลักฐานคุณภาพใด', 'ความสอดคล้องของคะแนนครูกับ AI (κ/ICC)', ['จำนวนงานที่ AI ตรวจได้ภายในหนึ่งนาที', 'ความพึงพอใจของครูต่อหน้าตาโปรแกรม AI', 'ราคาค่าบริการ AI ต่อเดือนของโรงเรียน', 'จำนวนภาษาที่ AI สามารถรองรับได้ทั้งหมด'], 'ต้องมีหลักฐานว่าคะแนนจาก AI สอดคล้องกับผู้เชี่ยวชาญก่อนนำไปใช้'],
  ['ครูต้องการใช้บริการ AI ภายนอกตรวจงานนักเรียน ข้อควรระวังด้านความเป็นส่วนตัวที่สำคัญที่สุดคือข้อใด', 'ไม่ส่งข้อมูลระบุตัวตนโดยไม่จำเป็น และตรวจนโยบายข้อมูล', ['ส่งชื่อและเลขประจำตัวให้ AI จะได้ตรวจแม่นยำขึ้น', 'ใช้บริการฟรีเสมอเพราะไม่มีความเสี่ยงด้านข้อมูล', 'ไม่ต้องแจ้งผู้เรียนเพราะเป็นเรื่องของครูเท่านั้น', 'เก็บข้อมูลไว้ในบริการภายนอกตลอดไปเพื่อความสะดวกของครู'], 'ปฏิบัติตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล และลดการส่งข้อมูลที่ระบุตัวตน'],
  ['Learning Analytics Dashboard ของโรงเรียนแสดงอันดับคะแนนนักเรียนทุกคนให้ทั้งห้องเห็น ปัญหาหลักคือข้อใด', 'ละเมิดความเป็นส่วนตัวและตีตราผู้เรียน', ['สีของกราฟไม่สวยงามพอสำหรับนักเรียน', 'ข้อมูลน้อยเกินไปสำหรับการตัดสินใจ', 'ใช้เวลาโหลดหน้านานเกินกว่าที่ควร', 'ไม่แสดงคะแนนของครูผู้สอนด้วย'], 'Dashboard ต้องจำกัดผู้ดูตามบทบาทและเน้นข้อมูลเพื่อการพัฒนา'],
  ['โรงเรียนในพื้นที่ห่างไกลต้องการใช้ Online Assessment แต่นักเรียนบางคนไม่มีอุปกรณ์และอินเทอร์เน็ต ครูควรออกแบบอย่างไร', 'ให้ใช้เครื่องของโรงเรียนเป็นทางเลือก', ['ให้นักเรียนที่ไม่มีอุปกรณ์ได้คะแนนศูนย์', 'ยกเว้นการประเมินให้นักเรียนกลุ่มนี้ทั้งหมด', 'ใช้ Online เฉพาะคนที่มีอุปกรณ์เท่านั้น', 'ให้ผู้ปกครองซื้ออุปกรณ์ก่อนสอบทุกคน'], 'ความเป็นธรรมต้องคำนึงถึงความเหลื่อมล้ำทางดิจิทัล'],

<script>
/* ---- js/stats.js ---- */
/* สถิติสำหรับการวัดและประเมินผล — ทุกฟังก์ชันคำนวณในเบราว์เซอร์ ไม่ส่งข้อมูลออกนอกหน้า */
(function (g) {
  const sum = a => a.reduce((x, y) => x + y, 0);
  const mean = a => (a.length ? sum(a) / a.length : 0);
  const varP = a => { const m = mean(a); return mean(a.map(x => (x - m) ** 2)); };
  const varS = a => { const m = mean(a); return a.length > 1 ? sum(a.map(x => (x - m) ** 2)) / (a.length - 1) : 0; };
  const sdS = a => Math.sqrt(varS(a));
  const corr = (a, b) => {
    const ma = mean(a), mb = mean(b); let sab = 0, sa = 0, sb = 0;
    for (let i = 0; i < a.length; i++) { sab += (a[i] - ma) * (b[i] - mb); sa += (a[i] - ma) ** 2; sb += (b[i] - mb) ** 2; }
    return sa && sb ? sab / Math.sqrt(sa * sb) : 0;
  };
  const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };

  /* การวิเคราะห์ข้อสอบแบบดั้งเดิม (Classical Item Analysis)
     rows: คำตอบรายคน (ตัวอักษร) , key: เฉลย , ใช้กลุ่มสูง–ต่ำ 27% */
  function itemAnalysis(rows, key, options = ['A', 'B', 'C', 'D'], frac = 0.27) {
    const N = rows.length, k = key.length;
    const sc = rows.map(r => r.map((x, j) => +(x === key[j])));
    const tot = sc.map(sum);
    const order = [...Array(N).keys()].sort((a, b) => tot[b] - tot[a] || a - b);
    const n = Math.max(1, Math.round(frac * N));
    const up = order.slice(0, n), lo = order.slice(N - n);
    const items = key.map((kj, j) => {
      const col = sc.map(r => r[j]);
      const p = mean(col);
      const ru = sum(up.map(i => sc[i][j])), rl = sum(lo.map(i => sc[i][j]));
      const rest = tot.map((t, i) => t - col[i]);
      const dist = options.map(o => ({
        opt: o, key: o === kj,
        all: rows.filter(r => r[j] === o).length,
        up: up.filter(i => rows[i][j] === o).length,
        lo: lo.filter(i => rows[i][j] === o).length
      }));
      return { item: j + 1, key: kj, p, r: (ru - rl) / n, pU: ru / n, pL: rl / n, rpbis: corr(col, rest), dist };
    });
    const pq = sum(items.map(it => it.p * (1 - it.p)));
    const vt = varP(tot);
    const kr20 = vt ? (k / (k - 1)) * (1 - pq / vt) : 0;
    const mp = mean(items.map(i => i.p));
    const kr21 = vt ? (k / (k - 1)) * (1 - (k * mp * (1 - mp)) / vt) : 0;
    return { N, k, n, items, totals: tot, mean: mean(tot), sd: Math.sqrt(vt), kr20, kr21, sem: Math.sqrt(vt) * Math.sqrt(Math.max(0, 1 - kr20)) };
  }

  /* Cronbach's alpha พร้อมค่า alpha เมื่อตัดข้อ และ corrected item-total correlation */
  function alpha(M) {
    const k = M[0].length;
    const col = j => M.map(r => r[j]);
    const a = X => {
      const kk = X[0].length; if (kk < 2) return NaN;
      const tot = X.map(sum);
      const s = sum([...Array(kk).keys()].map(j => varS(X.map(r => r[j]))));
      return (kk / (kk - 1)) * (1 - s / varS(tot));
    };
    const tot = M.map(sum);
    const items = [...Array(k).keys()].map(j => ({
      item: j + 1,
      mean: mean(col(j)),
      sd: sdS(col(j)),
      itemRest: corr(col(j), tot.map((t, i) => t - M[i][j])),
      alphaIfDeleted: a(M.map(r => r.filter((_, jj) => jj !== j)))
    }));
    return { alpha: a(M), items, k, n: M.length };
  }

  /* IOC: ค่าเฉลี่ยของคะแนนผู้เชี่ยวชาญ (+1, 0, −1) */
  const ioc = ratings => ratings.map(r => mean(r));

  /* CVI: ผู้เชี่ยวชาญให้คะแนน 1–4 ; ความเกี่ยวข้อง = 3 หรือ 4 */
  function cvi(ratings) {
    const icvi = ratings.map(r => r.filter(x => x >= 3).length / r.length);
    return { icvi, scviAve: mean(icvi), scviUA: icvi.filter(x => x === 1).length / icvi.length };
  }

  /* Cohen's kappa สำหรับผู้ประเมิน 2 คน */
  function cohenKappa(a, b) {
    const cats = [...new Set([...a, ...b])].sort();
    const n = a.length;
    const po = a.filter((x, i) => x === b[i]).length / n;
    const pe = sum(cats.map(c => (a.filter(x => x === c).length / n) * (b.filter(x => x === c).length / n)));
    const table = cats.map(r => cats.map(c => a.filter((x, i) => x === r && b[i] === c).length));
    return { po, pe, kappa: pe === 1 ? 1 : (po - pe) / (1 - pe), cats, table };
  }

  /* Fleiss' kappa : ratings = [[ผู้ประเมินคนที่1, คนที่2, ...] ต่อ 1 ชิ้นงาน] */
  function fleissKappa(ratings) {
    const cats = [...new Set(ratings.flat())].sort();
    const N = ratings.length, m = ratings[0].length;
    const nij = ratings.map(r => cats.map(c => r.filter(x => x === c).length));
    const pj = cats.map((_, j) => sum(nij.map(r => r[j])) / (N * m));
    const Pi = nij.map(r => (sum(r.map(x => x * x)) - m) / (m * (m - 1)));
    const Pbar = mean(Pi), Pe = sum(pj.map(x => x * x));
    return { kappa: (Pbar - Pe) / (1 - Pe), Pbar, Pe, cats };
  }

  /* ICC จาก two-way ANOVA (Shrout & Fleiss, 1979) : X = [ชิ้นงาน][ผู้ประเมิน] */
  function icc(X) {
    const n = X.length, k = X[0].length;
    const gm = mean(X.flat());
    const rm = X.map(mean), cm = [...Array(k).keys()].map(j => mean(X.map(r => r[j])));
    const SSR = k * sum(rm.map(m => (m - gm) ** 2));
    const SSC = n * sum(cm.map(m => (m - gm) ** 2));
    const SST = sum(X.flat().map(x => (x - gm) ** 2));
    const SSE = SST - SSR - SSC;
    const MSR = SSR / (n - 1), MSC = SSC / (k - 1), MSE = SSE / ((n - 1) * (k - 1));
    return {
      icc21: (MSR - MSE) / (MSR + (k - 1) * MSE + (k * (MSC - MSE)) / n), /* absolute agreement, single rater */
      icc31: (MSR - MSE) / (MSR + (k - 1) * MSE),                          /* consistency, single rater */
      icc2k: (MSR - MSE) / (MSR + (MSC - MSE) / n),                        /* absolute agreement, average of k */
      MSR, MSC, MSE
    };
  }

  g.Stats = { sum, mean, varP, varS, sdS, corr, median, itemAnalysis, alpha, ioc, cvi, cohenKappa, fleissKappa, icc };
})(window);

(function () {
  const T = {};
  const U = () => window.U;
  const E = s => U().esc(s);
  const store = (name, init) => { const S = U().st(); if (!S.tools[name]) S.tools[name] = typeof init === 'function' ? init() : init; return S.tools[name]; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const pill = (cls, t) => `<span class="pill ${cls}">${t}</span>`;
  const on = (el, ev, sel, fn) => el.addEventListener(ev, e => { const t = e.target.closest(sel); if (t && el.contains(t)) fn(t, e); });
  const kappaLabel = k => k < 0 ? 'Poor' : k <= .20 ? 'Slight' : k <= .40 ? 'Fair' : k <= .60 ? 'Moderate' : k <= .80 ? 'Substantial' : 'Almost perfect';
  const iccLabel = v => v < .5 ? 'Poor' : v < .75 ? 'Moderate' : v < .9 ? 'Good' : 'Excellent';

  /* ─── M2 : LO Clinic ─────────────────────────────── */
  const PROBS = ['ใช้คำกริยาที่สังเกตไม่ได้', 'เขียนจากมุมของครู', 'มีหลายพฤติกรรมใน LO เดียว', 'จิตพิสัยไม่มีพฤติกรรมบ่งชี้', 'ขาดเงื่อนไข/เกณฑ์ที่ชัดเจน'];
  const BAD = [
    ['นักเรียนเข้าใจเรื่องการวัดและประเมินผล', 0, ['นักเรียนเข้าใจการวัดและประเมินผลอย่างลึกซึ้ง', 'นักเรียนอธิบายความแตกต่างระหว่างการวัดกับการประเมินพร้อมยกตัวอย่างในชั้นเรียนได้', 'นักเรียนรู้จักการวัดและประเมินผลทุกประเภท'], 1],
    ['ครูสอนวิธีคำนวณค่า IOC', 1, ['นักศึกษาคำนวณค่า IOC จากผลการพิจารณาของผู้เชี่ยวชาญได้ถูกต้อง', 'ครูสาธิตการคำนวณค่า IOC ให้ชัดเจน', 'เพื่อให้นักศึกษามีความรู้เรื่อง IOC'], 0],
    ['นักศึกษาวิเคราะห์และออกแบบแบบทดสอบได้', 2, ['นักศึกษาวิเคราะห์และออกแบบแบบทดสอบได้ดีมาก', 'นักศึกษาเข้าใจการออกแบบแบบทดสอบ', 'แยกเป็น 2 LO: (1) วิเคราะห์คุณภาพข้อสอบจากค่า p และ r ได้ (2) ออกแบบแบบทดสอบตาม Blueprint ได้'], 2],
    ['นักศึกษาซาบซึ้งในคุณค่าของการประเมินที่เป็นธรรม', 3, ['นักศึกษาตระหนักถึงความเป็นธรรมในการประเมิน', 'นักศึกษาเสนอวิธีปรับการประเมินให้เป็นธรรมต่อผู้เรียนที่มีความต้องการพิเศษพร้อมให้เหตุผลได้', 'นักศึกษาชื่นชมการประเมินที่เป็นธรรม'], 1],
    ['นักศึกษาเขียนข้อสอบได้', 4, ['นักศึกษาเขียนข้อสอบได้ดี', 'นักศึกษาเขียนข้อสอบหลายแบบได้', 'เมื่อกำหนด LO และ Blueprint นักศึกษาเขียนข้อสอบเลือกตอบ 4 ตัวเลือกได้ 5 ข้อ โดยผ่านรายการตรวจคุณภาพทุกข้อ'], 2]
  ];
  T.lofix = el => {
    const st = store('lofix', { p: {}, b: {}, own: {} });
    const draw = () => {
      el.innerHTML = `<div class="stack">${BAD.map((b, i) => {
        const p = st.p[i], r = st.b[i];
        return `<div class="card flat stack" style="padding:14px"><div class="row" style="justify-content:space-between"><b>“${E(b[0])}”</b>${p === b[1] && r === b[3] ? pill('good', 'แก้แล้ว') : ''}</div>
          <label class="f">1) ปัญหาหลักคืออะไร<select data-p="${i}"><option value="">— เลือก —</option>${PROBS.map((t, j) => `<option value="${j}" ${p === j ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
          ${p != null ? `<div class="fb ${p === b[1] ? 'ok' : 'no'}">${p === b[1] ? 'ถูกต้อง' : 'ยังไม่ใช่ปัญหาหลัก — ปัญหาคือ “' + PROBS[b[1]] + '”'}</div>` : ''}
          <span class="small muted">2) LO ใดเขียนใหม่ได้ดีที่สุด</span><div class="opts">${b[2].map((o, j) => `<button class="opt ${r == null ? '' : j === b[3] ? 'right' : j === r ? 'wrong' : ''}" data-b="${i}" data-j="${j}" ${r != null ? 'disabled' : ''}><span class="bub">${'กขค'[j]}</span><span>${E(o)}</span></button>`).join('')}</div>
          <label class="f">3) เขียนใหม่ในแบบของฉัน<input type="text" id="lofix-own-${i}" data-own="${i}" value="${E(st.own[i] || '')}"></label></div>`;
      }).join('')}<button class="btn sm" data-reset style="align-self:flex-start">เริ่มใหม่</button></div>`;
    };
    on(el, 'change', 'select[data-p]', s => { st.p[s.dataset.p] = s.value === '' ? undefined : +s.value; U().save(); draw(); });
    on(el, 'click', 'button[data-b]', b => { if (b.disabled) return; st.b[b.dataset.b] = +b.dataset.j; U().save(); draw(); });
    on(el, 'input', 'input[data-own]', t => { st.own[t.dataset.own] = t.value; U().saveSoon(); });
    on(el, 'click', '[data-reset]', () => { st.p = {}; st.b = {}; U().save(); draw(); });
    draw();
  };

  /* ─── M2 : Learning Outcome Matrix ───────────────── */
  const LV = { 'พุทธิพิสัย': ['Remember', 'Understand', 'Apply', 'Analyze', 'Evaluate', 'Create'], 'จิตพิสัย': ['Receiving', 'Responding', 'Valuing', 'Organization', 'Characterization'], 'ทักษะพิสัย': ['Imitation', 'Manipulation', 'Precision', 'Articulation', 'Naturalization'] };
  const KD = ['—', 'Factual', 'Conceptual', 'Procedural', 'Metacognitive'];
  const VAGUE = ['เข้าใจ', 'ตระหนัก', 'ซาบซึ้ง', 'ทราบ', 'มีความรู้', 'รู้จัก', 'เห็นความสำคัญ', 'เห็นคุณค่า'];
  const LOM_EX = { unit: 'สถิติเบื้องต้น ชั้น ม.2 (ตัวอย่าง)', example: true, rows: [
    { lo: 'เมื่อกำหนดข้อมูลในตาราง นักเรียนคำนวณค่าเฉลี่ยเลขคณิตได้ถูกต้องอย่างน้อย 4 ใน 5 ข้อ', dom: 'พุทธิพิสัย', lvl: 'Apply', kd: 'Procedural', ev: 'แบบทดสอบเติมคำตอบ 5 ข้อ' },
    { lo: 'นักเรียนแปลความหมายค่ากลางและสรุปลักษณะของข้อมูลพร้อมให้เหตุผลได้', dom: 'พุทธิพิสัย', lvl: 'Analyze', kd: 'Conceptual', ev: 'ข้อสอบสถานการณ์ + อัตนัยสั้น ให้คะแนนด้วย Rubric' },
    { lo: 'นักเรียนนำเสนอข้อมูลด้วยแผนภูมิที่เหมาะสมกับชนิดข้อมูลได้ถูกต้องและอ่านง่าย', dom: 'ทักษะพิสัย', lvl: 'Precision', kd: '—', ev: 'ชิ้นงานแผนภูมิ + Rubric' },
    { lo: 'นักเรียนรับฟังและตอบสนองต่อความคิดเห็นของเพื่อนระหว่างอภิปรายผลข้อมูล', dom: 'จิตพิสัย', lvl: 'Responding', kd: '—', ev: 'แบบสังเกตพฤติกรรม (Checklist)' }
  ] };
  T.lomatrix = el => {
    const st = store('lomatrix', () => clone(LOM_EX));
    const checks = r => {
      const w = [];
      if (!r.lo.trim()) return w;
      const v = VAGUE.filter(x => r.lo.includes(x)); if (v.length) w.push(['bad', `คำกริยาสังเกตไม่ได้: ${v.join(', ')}`]);
      if (/^\s*(ครู|เพื่อให้)/.test(r.lo)) w.push(['bad', 'เขียนจากมุมครู/เป็นจุดประสงค์การสอน']);
      if (/และ/.test(r.lo)) w.push(['warn', 'มี “และ” — ตรวจว่ามีหลายพฤติกรรมหรือไม่']);
      if (!r.ev.trim()) w.push(['warn', 'ยังไม่ระบุหลักฐาน']);
      if (!w.length) w.push(['good', 'ผ่านการตรวจเบื้องต้น']);
      return w;
    };
    const draw = () => {
      const cnt = LV['พุทธิพิสัย'].map(l => st.rows.filter(r => r.lvl === l).length);
      el.innerHTML = `<div class="stack">${st.example ? `<div class="fb warn row" style="justify-content:space-between"><span>กำลังแสดง <b>ตัวอย่าง</b> — แก้ไขได้เลย หรือเริ่มหน่วยการเรียนรู้ของคุณเอง</span><button class="btn sm" data-clear>เริ่มของฉัน</button></div>` : ''}
        <label class="f">หน่วยการเรียนรู้ / ระดับชั้น<input type="text" id="lom-unit" data-unit value="${E(st.unit)}"></label>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th style="min-width:260px">Learning Outcome</th><th>Domain</th><th>ระดับ</th><th>มิติความรู้</th><th style="min-width:180px">หลักฐานการเรียนรู้</th><th>ตรวจ</th><th></th></tr></thead><tbody>
        ${st.rows.map((r, i) => `<tr><td class="num">${i + 1}</td><td><textarea data-f="lo" data-i="${i}" style="min-height:60px">${E(r.lo)}</textarea></td>
          <td><select data-f="dom" data-i="${i}">${Object.keys(LV).map(d => `<option ${r.dom === d ? 'selected' : ''}>${d}</option>`).join('')}</select></td>
          <td><select data-f="lvl" data-i="${i}">${LV[r.dom].map(l => `<option ${r.lvl === l ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
          <td><select data-f="kd" data-i="${i}" ${r.dom !== 'พุทธิพิสัย' ? 'disabled' : ''}>${KD.map(k => `<option ${r.kd === k ? 'selected' : ''}>${k}</option>`).join('')}</select></td>
          <td><textarea data-f="ev" data-i="${i}" style="min-height:60px">${E(r.ev)}</textarea></td>
          <td class="stack" style="gap:4px">${checks(r).map(([c, t]) => pill(c, t)).join('')}</td><td><button class="btn ghost sm" data-del="${i}" aria-label="ลบแถว">✕</button></td></tr>`).join('')}
        </tbody></table></div>
        <div class="row"><button class="btn sm" data-add>+ เพิ่ม LO</button><button class="btn sm" data-copy>คัดลอกเป็นตาราง</button><span class="small muted">วางในสเปรดชีต/Word ได้ทันที</span></div>
        <div class="stack" style="gap:4px"><span class="eyebrow">การกระจายระดับพุทธิพิสัย</span>${U().bars({ labels: LV['พุทธิพิสัย'], series: [{ name: 'จำนวน LO', values: cnt, color: U().COL.d }], height: 150, max: Math.max(2, ...cnt), yTicks: [0, Math.max(2, ...cnt)] })}</div></div>`;
    };
    on(el, 'input', '[data-f]', t => { const r = st.rows[+t.dataset.i]; r[t.dataset.f] = t.value; if (t.dataset.f === 'dom') { r.lvl = LV[t.value][0]; if (t.value !== 'พุทธิพิสัย') r.kd = '—'; draw(); } else if (t.tagName === 'SELECT') draw(); U().saveSoon(); });
    on(el, 'change', 'textarea[data-f]', () => draw());
    on(el, 'input', '[data-unit]', t => { st.unit = t.value; U().saveSoon(); });
    on(el, 'click', '[data-add]', () => { st.rows.push({ lo: '', dom: 'พุทธิพิสัย', lvl: 'Understand', kd: 'Conceptual', ev: '' }); U().save(); draw(); });
    on(el, 'click', '[data-del]', b => { st.rows.splice(+b.dataset.del, 1); U().save(); draw(); });
    on(el, 'click', '[data-clear]', () => { st.example = false; st.unit = ''; st.rows = [{ lo: '', dom: 'พุทธิพิสัย', lvl: 'Understand', kd: 'Conceptual', ev: '' }]; U().save(); draw(); });
    on(el, 'click', '[data-copy]', () => U().copy(`หน่วย: ${st.unit}\n#\tLearning Outcome\tDomain\tระดับ\tมิติความรู้\tหลักฐาน\n` + st.rows.map((r, i) => [i + 1, r.lo, r.dom, r.lvl, r.kd, r.ev].join('\t')).join('\n')));
    draw();
  };

  /* ─── M3 : Test Blueprint Builder ────────────────── */
  const BLOOM = ['Remember', 'Understand', 'Apply', 'Analyze', 'Evaluate', 'Create'];
  T.blueprint = el => {
    const st = store('blueprint', { topics: [['สถานะของสาร', 20], ['สมบัติของสาร', 25], ['การแยกสาร', 40], ['สารละลาย', 15]], lv: [15, 25, 30, 20, 10, 0], total: 30, example: true });
    const calc = () => {
      const cells = [];
      st.topics.forEach((t, i) => st.lv.forEach((l, j) => { const raw = (t[1] / 100) * (l / 100) * st.total; cells.push({ i, j, raw, n: Math.floor(raw) }); }));
      let left = st.total - cells.reduce((a, c) => a + c.n, 0);
      [...cells].sort((a, b) => (b.raw - b.n) - (a.raw - a.n)).forEach(c => { if (left > 0 && c.raw > 0) { c.n++; left--; } });
      const M = st.topics.map(() => st.lv.map(() => 0)); cells.forEach(c => (M[c.i][c.j] = c.n)); return M;
    };
    const draw = () => {
      const sw = st.topics.reduce((a, t) => a + (+t[1] || 0), 0), sl = st.lv.reduce((a, v) => a + (+v || 0), 0);
      const okW = sw === 100 && sl === 100;
      const M = okW ? calc() : null;
      el.innerHTML = `<div class="stack">${st.example ? '<div class="fb warn">ตัวอย่าง: หน่วย “สารและสมบัติของสาร” ม.1 จาก Case Study — ปรับเป็นหน่วยของคุณได้</div>' : ''}
        <div class="row"><label class="f" style="width:160px">จำนวนข้อสอบทั้งหมด<input type="number" id="bp-total" min="1" max="200" data-total value="${st.total}"></label>
          ${pill(sw === 100 ? 'good' : 'bad', `น้ำหนักเนื้อหารวม ${sw}%`)} ${pill(sl === 100 ? 'good' : 'bad', `น้ำหนักพฤติกรรมรวม ${sl}%`)}</div>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>เนื้อหา / LO</th><th class="num">น้ำหนัก %</th>${BLOOM.map((b, j) => `<th class="num">${b}<br><input class="cell-in" type="number" min="0" max="100" data-lv="${j}" value="${st.lv[j]}" aria-label="น้ำหนัก ${b}"></th>`).join('')}<th class="num">รวม</th><th></th></tr></thead><tbody>
        ${st.topics.map((t, i) => `<tr><td><input type="text" data-tn="${i}" value="${E(t[0])}" aria-label="ชื่อเนื้อหา"></td><td class="num"><input class="cell-in" type="number" min="0" max="100" data-tw="${i}" value="${t[1]}" aria-label="น้ำหนักเนื้อหา"></td>
          ${st.lv.map((_, j) => `<td class="num">${M ? (M[i][j] || '<span class="muted">0</span>') : '–'}</td>`).join('')}<td class="num"><b>${M ? M[i].reduce((a, b) => a + b, 0) : '–'}</b></td><td><button class="btn ghost sm" data-del="${i}" aria-label="ลบ">✕</button></td></tr>`).join('')}
        <tr><td><b>รวม</b></td><td class="num">${sw}</td>${st.lv.map((_, j) => `<td class="num"><b>${M ? M.reduce((a, r) => a + r[j], 0) : '–'}</b></td>`).join('')}<td class="num"><b>${M ? st.total : '–'}</b></td><td></td></tr></tbody></table></div>
        <div class="row"><button class="btn sm" data-add>+ เพิ่มเนื้อหา</button><button class="btn sm" data-copy ${M ? '' : 'disabled'}>คัดลอกตาราง</button></div>
        ${okW ? `<p class="small muted">คำนวณ: น้ำหนักเนื้อหา × น้ำหนักพฤติกรรม × จำนวนข้อ แล้วปัดเศษแบบเศษเหลือมากที่สุด (largest remainder) ให้ผลรวมเท่ากับ ${st.total} ข้อพอดี — ตรวจต่อว่าช่องที่ได้ 0 ข้อเป็นไปตามเจตนาหรือไม่</p>` : '<div class="fb no">ปรับน้ำหนักให้รวมเป็น 100% ทั้งสองมิติ ตารางจึงจะคำนวณ</div>'}</div>`;
    };
    const touch = () => { st.example = false; U().saveSoon(); };
    on(el, 'change', 'input', t => {
      if (t.dataset.total != null) st.total = Math.max(1, +t.value || 1);
      else if (t.dataset.lv != null) st.lv[+t.dataset.lv] = +t.value || 0;
      else if (t.dataset.tw != null) st.topics[+t.dataset.tw][1] = +t.value || 0;
      else if (t.dataset.tn != null) st.topics[+t.dataset.tn][0] = t.value;
      touch(); draw();
    });
    on(el, 'click', '[data-add]', () => { st.topics.push(['เนื้อหาใหม่', 0]); touch(); draw(); });
    on(el, 'click', '[data-del]', b => { st.topics.splice(+b.dataset.del, 1); touch(); draw(); });
    on(el, 'click', '[data-copy]', () => { const M = calc(); U().copy('เนื้อหา\tน้ำหนัก%\t' + BLOOM.join('\t') + '\tรวม\n' + st.topics.map((t, i) => [t[0], t[1], ...M[i], M[i].reduce((a, b) => a + b, 0)].join('\t')).join('\n')); });
    draw();
  };

  /* ─── M3 : Assessment Plan Builder ───────────────── */
  const AP_F = [['lo', 'LO', 200], ['ev', 'หลักฐาน', 160], ['how', 'วิธีการ/เครื่องมือ', 160], ['when', 'ช่วงเวลา', 0], ['who', 'ผู้ประเมิน', 110], ['crit', 'เกณฑ์', 150], ['w', 'น้ำหนัก %', 0], ['use', 'ใช้ผลอย่างไร', 160]];
  T.aplan = el => {
    const st = store('aplan', { example: true, rows: [
      { lo: 'คำนวณค่าเฉลี่ยเลขคณิตจากตารางข้อมูลได้', ev: 'คำตอบที่ถูกต้อง', how: 'แบบทดสอบเติมคำตอบ 5 ข้อ', when: 'ระหว่างเรียน', who: 'ครู', crit: 'ถูก ≥ 4/5', w: 10, use: 'สอนซ่อมเสริมผู้ที่ยังไม่ผ่าน (Formative)' },
      { lo: 'แปลความหมายค่ากลางและสรุปลักษณะข้อมูลพร้อมเหตุผล', ev: 'คำอธิบายเหตุผล', how: 'ข้อสอบสถานการณ์ + อัตนัยสั้น', when: 'หลังเรียน', who: 'ครู', crit: 'Rubric 3 เกณฑ์', w: 20, use: 'ตัดสินผลหน่วย (Summative)' },
      { lo: 'นำเสนอข้อมูลด้วยแผนภูมิที่เหมาะสม', ev: 'ชิ้นงานแผนภูมิ', how: 'Performance + Rubric', when: 'ระหว่างเรียน', who: 'ตนเอง + ครู', crit: 'Analytic Rubric 4 ระดับ', w: 20, use: 'Feedback ก่อนส่งฉบับจริง' }
    ] });
    const draw = () => {
      const sw = st.rows.reduce((a, r) => a + (+r.w || 0), 0);
      el.innerHTML = `<div class="stack">${st.example ? '<div class="fb warn">ตัวอย่างจากหน่วย “สถิติเบื้องต้น” — แก้เป็นหน่วยของคุณ (ใช้ LO จาก Learning Outcome Matrix)</div>' : ''}
        <div class="tbl-wrap"><table class="t"><thead><tr>${AP_F.map(f => `<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${st.rows.map((r, i) => `<tr>${AP_F.map(([k, , w]) => `<td style="${w ? 'min-width:' + w + 'px' : ''}">${k === 'when' ? `<select data-k="when" data-i="${i}">${['ก่อนเรียน', 'ระหว่างเรียน', 'หลังเรียน'].map(o => `<option ${r.when === o ? 'selected' : ''}>${o}</option>`).join('')}</select>` : k === 'w' ? `<input class="cell-in" type="number" min="0" max="100" data-k="w" data-i="${i}" value="${r.w}">` : `<textarea data-k="${k}" data-i="${i}" style="min-height:56px">${E(r[k])}</textarea>`}</td>`).join('')}<td><button class="btn ghost sm" data-del="${i}" aria-label="ลบ">✕</button></td></tr>`).join('')}</tbody></table></div>
        <div class="row"><button class="btn sm" data-add>+ เพิ่มแถว</button><button class="btn sm" data-copy>คัดลอกตาราง</button>${pill('data', `น้ำหนักรวมในแผนนี้ ${sw}%`)}${st.rows.some(r => r.lo.trim() && !r.how.trim()) ? pill('bad', 'มี LO ที่ยังไม่มีวิธีประเมิน') : ''}${st.rows.some(r => !r.use.trim()) ? pill('warn', 'ระบุการใช้ผลให้ครบทุกแถว') : ''}</div></div>`;
    };
    on(el, 'input', '[data-k]', t => { st.rows[+t.dataset.i][t.dataset.k] = t.dataset.k === 'w' ? (+t.value || 0) : t.value; st.example = false; U().saveSoon(); });
    on(el, 'change', '[data-k]', () => draw());
    on(el, 'click', '[data-add]', () => { st.rows.push({ lo: '', ev: '', how: '', when: 'ระหว่างเรียน', who: 'ครู', crit: '', w: 0, use: '' }); U().save(); draw(); });
    on(el, 'click', '[data-del]', b => { st.rows.splice(+b.dataset.del, 1); U().save(); draw(); });
    on(el, 'click', '[data-copy]', () => U().copy(AP_F.map(f => f[1]).join('\t') + '\n' + st.rows.map(r => AP_F.map(([k]) => String(r[k]).replace(/\n/g, ' ')).join('\t')).join('\n')));
    draw();
  };

  /* ─── M4 : Item Writer ───────────────────────────── */
  const MANUAL = ['ตอบได้ก่อนเห็นตัวเลือก (stem ชัด)', 'มีคำตอบถูกชัดเจนเพียงข้อเดียว', 'ตัวลวงมาจากความเข้าใจคลาดเคลื่อนจริง', 'ตัวเลือกเป็นเนื้อเดียวกันและเรียงอย่างมีเหตุผล', 'ภาษาเหมาะกับวัยผู้สอบ', 'ตรงกับ LO และช่องใน Blueprint'];
  T.itemcheck = el => {
    const st = store('itemcheck', { lo: 'แปลความหมายค่ากลางและสรุปลักษณะของข้อมูลได้', stem: 'คะแนนสอบของนักเรียน 5 คน คือ 3, 4, 4, 5 และ 19 ครูควรใช้ค่ากลางใดรายงาน “คะแนนโดยทั่วไป” ของกลุ่มนี้', o: ['ค่าเฉลี่ยเลขคณิต เพราะใช้ข้อมูลทุกตัว', 'มัธยฐาน เพราะไม่ถูกดึงด้วยค่าสุดโต่ง', 'ฐานนิยม เพราะเป็นค่าที่พบบ่อยที่สุด', 'พิสัย เพราะบอกการกระจายของข้อมูล'], key: 1, man: {}, example: true });
    const auto = () => {
      const w = []; const s = st.stem || '', o = st.o.map(x => (x || '').trim());
      if (!st.lo.trim()) w.push(['warn', 'ยังไม่ระบุ LO ที่ข้อนี้วัด']);
      if (s.trim().length < 15) w.push(['warn', 'ตัวคำถามสั้นมาก ตรวจว่าตอบได้ก่อนเห็นตัวเลือกหรือไม่']);
      const neg = (s.match(/ไม่/g) || []).length;
      if (neg >= 2) w.push(['bad', 'อาจมีปฏิเสธซ้อนในตัวคำถาม']); else if (neg === 1 || /ยกเว้น/.test(s)) w.push(['warn', 'มีคำปฏิเสธ — ถ้าจำเป็นให้เน้น (ตัวหนา/ขีดเส้นใต้)']);
      if (o.some(x => !x)) w.push(['bad', 'ตัวเลือกยังไม่ครบ 4 ตัว']);
      if (new Set(o.filter(Boolean)).size < o.filter(Boolean).length) w.push(['bad', 'มีตัวเลือกซ้ำกัน']);
      const others = o.filter((_, i) => i !== +st.key), m = others.reduce((a, x) => a + x.length, 0) / Math.max(1, others.length);
      if (o[st.key] && m && o[st.key].length > 1.5 * m) w.push(['warn', 'ตัวเลือกถูกยาวกว่าตัวอื่นชัดเจน — อาจเป็นคำใบ้']);
      if (o.some(x => /ถูกทุกข้อ|ทุกข้อที่กล่าว|ผิดทุกข้อ|ไม่มีข้อใดถูก/.test(x))) w.push(['warn', 'หลีกเลี่ยง “ถูกทุกข้อ” และใช้ “ไม่มีข้อใดถูก” อย่างระมัดระวัง']);
      if (o.some(x => /เสมอ|ทุกครั้ง|ไม่เคย/.test(x))) w.push(['warn', 'มีคำเด็ดขาดในตัวเลือก (เสมอ/ทุกครั้ง/ไม่เคย) มักเป็นคำใบ้']);
      if (!w.length) w.push(['good', 'ไม่พบข้อบกพร่องที่ตรวจอัตโนมัติได้']);
      return w;
    };
    const draw = () => {
      const done = MANUAL.filter((_, i) => st.man[i]).length;
      el.innerHTML = `<div class="grid g2" style="align-items:start"><div class="stack">${st.example ? '<div class="fb warn">ตัวอย่างข้อสอบวัดระดับ Analyze — แก้เป็นข้อของคุณ</div>' : ''}
          <label class="f">LO ที่วัด<input type="text" id="ic-lo" data-k="lo" value="${E(st.lo)}"></label>
          <label class="f">ตัวคำถาม (Stem)<textarea id="ic-stem" data-k="stem">${E(st.stem)}</textarea></label>
          ${[0, 1, 2, 3].map(i => `<label class="f">ตัวเลือก ${'กขคง'[i]}<input type="text" id="ic-o${i}" data-o="${i}" value="${E(st.o[i])}"></label>`).join('')}
          <label class="f">เฉลย<select id="ic-key" data-key>${[0, 1, 2, 3].map(i => `<option value="${i}" ${+st.key === i ? 'selected' : ''}>${'กขคง'[i]}</option>`).join('')}</select></label></div>
        <div class="stack"><div class="card flat stack" style="background:var(--surface-2)"><span class="eyebrow">ตัวอย่างการแสดงผล</span><b>${E(st.stem)}</b>${st.o.map((x, i) => `<span class="small">${'กขคง'[i]}. ${E(x)}${+st.key === i ? ' <span class="pill good">เฉลย</span>' : ''}</span>`).join('')}</div>
          <div class="stack" style="gap:6px"><span class="eyebrow">ตรวจอัตโนมัติ</span><div data-auto class="stack" style="gap:6px">${auto().map(([c, t]) => `<div class="fb ${c === 'good' ? 'ok' : c === 'bad' ? 'no' : 'warn'}">${t}</div>`).join('')}</div></div>
          <div class="stack" style="gap:6px"><span class="eyebrow">ตรวจด้วยตนเอง (${done}/${MANUAL.length})</span>${MANUAL.map((m, i) => `<label class="row small" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" id="ic-m${i}" data-m="${i}" ${st.man[i] ? 'checked' : ''}>${m}</label>`).join('')}</div>
          <button class="btn sm" data-copy style="align-self:flex-start">คัดลอกข้อสอบ</button></div></div>`;
    };
    const redrawAuto = () => { const box = el.querySelector('[data-auto]'); if (box) box.innerHTML = auto().map(([c, t]) => `<div class="fb ${c === 'good' ? 'ok' : c === 'bad' ? 'no' : 'warn'}">${t}</div>`).join(''); };
    on(el, 'input', '[data-k]', t => { st[t.dataset.k] = t.value; st.example = false; U().saveSoon(); redrawAuto(); });
    on(el, 'input', '[data-o]', t => { st.o[+t.dataset.o] = t.value; st.example = false; U().saveSoon(); redrawAuto(); });
    on(el, 'change', 'textarea,input[type=text]', () => draw());
    on(el, 'change', '[data-key]', t => { st.key = +t.value; U().save(); draw(); });
    on(el, 'change', '[data-m]', t => { st.man[t.dataset.m] = t.checked; U().save(); draw(); });
    on(el, 'click', '[data-copy]', () => U().copy(`LO: ${st.lo}\n${st.stem}\n` + st.o.map((x, i) => `${'กขคง'[i]}. ${x}`).join('\n') + `\nเฉลย: ${'กขคง'[st.key]}`));
    draw();
  };

  /* ─── M5 : IOC ───────────────────────────────────── */
  T.ioc = el => {
    const D = window.DATASETS.ioc;
    const st = store('ioc', () => ({ rows: clone(D.items) }));
    const draw = () => {
      const v = window.Stats.ioc(st.rows.map(r => r[1]));
      const pass = v.filter(x => x >= .5).length;
      el.innerHTML = `<div class="stack"><p class="small muted">${E(D.title)} — เปลี่ยนค่าในตารางเพื่อดูผล · เกณฑ์ IOC ≥ .50</p><div class="formula">IOC = ΣR / N &nbsp;&nbsp;(R = +1, 0, −1 ; N = จำนวนผู้เชี่ยวชาญ)</div>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>ข้อคำถาม / จุดประสงค์</th>${st.rows[0][1].map((_, j) => `<th class="num">E${j + 1}</th>`).join('')}<th class="num">ΣR</th><th class="num">IOC</th><th>ผล</th></tr></thead><tbody>
        ${st.rows.map((r, i) => `<tr><td>${E(r[0])}</td>${r[1].map((x, j) => `<td class="num"><select class="cell-in" data-i="${i}" data-j="${j}" aria-label="ผู้เชี่ยวชาญ ${j + 1}">${[1, 0, -1].map(o => `<option value="${o}" ${x === o ? 'selected' : ''}>${o > 0 ? '+1' : o}</option>`).join('')}</select></td>`).join('')}<td class="num">${r[1].reduce((a, b) => a + b, 0)}</td><td class="num"><b>${U().f2(v[i])}</b></td><td>${v[i] >= .5 ? pill('good', 'ผ่าน') : pill('bad', 'ปรับ/ตัด')}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="row">${pill('good', `ผ่าน ${pass} ข้อ`)}${pill('bad', `ต่ำกว่าเกณฑ์ ${st.rows.length - pass} ข้อ`)}<button class="btn sm" data-reset>คืนค่าข้อมูลตัวอย่าง</button></div>
        <label class="f">การตัดสินใจเชิงการวัดของฉัน: ข้อที่ต่ำกว่าเกณฑ์มีปัญหาที่ภาษา เนื้อหา หรือไม่ตรง LO — จะปรับหรือตัดอย่างไร<textarea data-note="ioc-note"></textarea></label></div>`;
      const t = el.querySelector('[data-note]'); t.value = U().st().notes['ioc-note'] || ''; t.oninput = () => { U().st().notes['ioc-note'] = t.value; U().saveSoon(); };
    };
    on(el, 'change', 'select[data-i]', s => { st.rows[+s.dataset.i][1][+s.dataset.j] = +s.value; U().save(); draw(); });
    on(el, 'click', '[data-reset]', () => { st.rows = clone(D.items); U().save(); draw(); });
    draw();
  };

  /* ─── M5 : CVI ───────────────────────────────────── */
  T.cvi = el => {
    const D = window.DATASETS.cvi;
    const st = store('cvi', () => ({ rows: clone(D.items) }));
    const draw = () => {
      const r = window.Stats.cvi(st.rows.map(x => x[1])), k = st.rows[0][1].length, crit = k <= 5 ? 1 : .78;
      el.innerHTML = `<div class="stack"><p class="small muted">${E(D.title)} — ผู้เชี่ยวชาญ ${k} คน ให้คะแนนความเกี่ยวข้อง 1–4</p>
        <div class="formula">I-CVI = จำนวนผู้เชี่ยวชาญที่ให้ 3 หรือ 4 ÷ ${k} &nbsp;·&nbsp; เกณฑ์ I-CVI ${k <= 5 ? '= 1.00 (3–5 คน; Lynn, 1986)' : '≥ .78 (6 คนขึ้นไป; Polit & Beck, 2006)'} &nbsp;·&nbsp; S-CVI/Ave ≥ .90</div>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>ข้อ</th>${st.rows[0][1].map((_, j) => `<th class="num">E${j + 1}</th>`).join('')}<th class="num">I-CVI</th><th>ผล</th></tr></thead><tbody>
        ${st.rows.map((row, i) => `<tr><td>${E(row[0])}</td>${row[1].map((x, j) => `<td class="num"><select class="cell-in" data-i="${i}" data-j="${j}" aria-label="ผู้เชี่ยวชาญ ${j + 1}">${[1, 2, 3, 4].map(o => `<option ${x === o ? 'selected' : ''}>${o}</option>`).join('')}</select></td>`).join('')}<td class="num"><b>${U().f2(r.icvi[i])}</b></td><td>${r.icvi[i] >= crit - 1e-9 ? pill('good', 'ผ่าน') : pill('bad', 'ปรับ/ตัด')}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="kpis"><div class="kpi"><span class="l">S-CVI/Ave</span><span class="v">${U().f2(r.scviAve)}</span>${r.scviAve >= .9 ? pill('good', 'ถึงเกณฑ์ .90') : pill('warn', 'ต่ำกว่า .90')}</div><div class="kpi"><span class="l">S-CVI/UA</span><span class="v">${U().f2(r.scviUA)}</span><span class="small muted">สัดส่วนข้อที่ทุกคนให้ 3–4</span></div></div>
        <div class="fb info">ลองคิด: ถ้าตัดข้อที่ I-CVI ไม่ผ่านออก S-CVI/Ave จะเปลี่ยนเป็นเท่าไร และแบบวัดยังครอบคลุมโครงสร้างที่ต้องการวัดครบหรือไม่ — การตัดข้อเพื่อ “ให้ค่าผ่าน” อาจลดความครอบคลุมของเนื้อหา</div>
        <button class="btn sm" data-reset style="align-self:flex-start">คืนค่าข้อมูลตัวอย่าง</button></div>`;
    };
    on(el, 'change', 'select[data-i]', s => { st.rows[+s.dataset.i][1][+s.dataset.j] = +s.value; U().save(); draw(); });
    on(el, 'click', '[data-reset]', () => { st.rows = clone(D.items); U().save(); draw(); });
    draw();
  };

  /* ─── M5 : Cronbach's alpha ──────────────────────── */
  T.alpha = el => {
    const D = window.DATASETS.likert;
    const st = store('alpha', () => ({ data: clone(D.data), rev: false }));
    const draw = () => {
      const M = st.data.map(r => r.map((x, j) => st.rev && D.reverse.includes(j) ? 6 - x : x));
      const res = window.Stats.alpha(M);
      const raw = window.Stats.alpha(st.data).alpha, rec = window.Stats.alpha(st.data.map(r => r.map((x, j) => D.reverse.includes(j) ? 6 - x : x))).alpha;
      const neg = res.items.filter(i => i.itemRest < 0);
      el.innerHTML = `<div class="stack"><p class="small muted">${E(D.title)} — ผู้ตอบ ${M.length} คน · มาตร 1–5 · ข้อ 4 เป็นข้อความทางลบ</p>
        <label class="row" style="gap:8px"><input type="checkbox" id="al-rev" data-rev ${st.rev ? 'checked' : ''}> กลับคะแนนข้อ 4 (6 − x) ก่อนคำนวณ</label>
        <div class="kpis"><div class="kpi"><span class="l">Cronbach’s α (ที่ใช้ตอนนี้)</span><span class="v">${U().f2(res.alpha, 3)}</span></div><div class="kpi"><span class="l">α ก่อนกลับคะแนน</span><span class="v" style="color:var(--ink-3)">${U().f2(raw, 3)}</span></div><div class="kpi"><span class="l">α หลังกลับคะแนน</span><span class="v" style="color:var(--data)">${U().f2(rec, 3)}</span></div></div>
        ${neg.length ? `<div class="fb no"><b>สัญญาณเตือน:</b> ข้อ ${neg.map(i => i.item).join(', ')} มี item-rest correlation ติดลบ — ตรวจว่าเป็นข้อความทางลบที่ยังไม่ได้กลับคะแนนหรือไม่</div>` : '<div class="fb ok">ไม่มีข้อที่ item-rest correlation ติดลบ</div>'}
        <div class="tbl-wrap"><table class="t"><thead><tr><th>ข้อ</th><th>ข้อความ</th><th class="num">Mean</th><th class="num">SD</th><th class="num">Item-rest r</th><th class="num">α if item deleted</th></tr></thead><tbody>
        ${res.items.map(i => `<tr><td class="num">${i.item}</td><td class="small">${E(D.itemsText[i.item - 1])}</td><td class="num">${U().f2(i.mean)}</td><td class="num">${U().f2(i.sd)}</td><td class="num" style="${i.itemRest < 0 ? 'color:var(--bad);font-weight:600' : i.itemRest < .3 ? 'color:var(--warn)' : ''}">${U().f2(i.itemRest)}</td><td class="num" style="${i.alphaIfDeleted > res.alpha ? 'color:var(--warn)' : ''}">${U().f2(i.alphaIfDeleted, 3)}</td></tr>`).join('')}</tbody></table></div>
        <p class="small muted">α if item deleted ที่สูงกว่า α ปัจจุบัน (สีเหลือง) บอกว่าข้อนั้นอาจไม่สอดคล้องกับข้ออื่น — แต่ตัดสินใจตัดข้อต้องพิจารณาความตรงเชิงเนื้อหาด้วย · ใน JASP ค่าเหล่านี้คือ item-rest correlation และ “if item dropped”</p>
        <details class="acc"><summary>ข้อมูลดิบ (แก้ไขได้)</summary><div><div class="tbl-wrap"><table class="t"><thead><tr><th>ผู้ตอบ</th>${D.itemsText.map((_, j) => `<th class="num">ข้อ ${j + 1}</th>`).join('')}</tr></thead><tbody>${st.data.map((r, i) => `<tr><td class="mono">R${String(i + 1).padStart(2, '0')}</td>${r.map((x, j) => `<td class="num"><select class="cell-in" data-i="${i}" data-j="${j}" aria-label="R${i + 1} ข้อ ${j + 1}">${[1, 2, 3, 4, 5].map(o => `<option ${x === o ? 'selected' : ''}>${o}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <div class="row" style="margin-top:8px"><button class="btn sm" data-copy>คัดลอก CSV (ข้อมูลดิบ)</button><button class="btn sm" data-reset>คืนค่าข้อมูลตัวอย่าง</button></div></div></details></div>`;
    };
    on(el, 'change', '[data-rev]', t => { st.rev = t.checked; U().save(); draw(); });
    on(el, 'change', 'select[data-i]', s => { st.data[+s.dataset.i][+s.dataset.j] = +s.value; U().save(); draw(); });
    on(el, 'click', '[data-reset]', () => { st.data = clone(D.data); U().save(); draw(); });
    on(el, 'click', '[data-copy]', () => U().copy('id,' + D.itemsText.map((_, i) => 'item' + (i + 1)).join(',') + '\n' + st.data.map((r, i) => 'R' + String(i + 1).padStart(2, '0') + ',' + r.join(',')).join('\n')));
    draw();
  };

  /* ─── M5 : Inter-rater agreement ─────────────────── */
  T.agree = el => {
    const D = window.DATASETS.raters;
    const st = store('agree', () => ({ A: [...D.A], B: [...D.B], C: [...D.C], pair: 'AB' }));
    const draw = () => {
      const [x, y] = st.pair.split('');
      const ck = window.Stats.cohenKappa(st[x], st[y]);
      const fk = window.Stats.fleissKappa(st.A.map((a, i) => [a, st.B[i], st.C[i]]));
      const ic = window.Stats.icc(st.A.map((a, i) => [a, st.B[i], st.C[i]]));
      el.innerHTML = `<div class="stack"><p class="small muted">${E(D.title)} — ระดับ 1–4</p>
